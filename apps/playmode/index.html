<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ESSAzLife PlayMode</title>

    <!-- Browser Tab Icon -->
    <link
        rel="icon"
        href="./MooCow.Icon.2.png?v=3"
    >

    <!-- Apple Home Screen Icon -->
    <link
        rel="apple-touch-icon"
        href="./MooCow.Icon.2.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header>

        <div class="app-name">

            <img
                class="app-icon"
                src="MooCow.Icon.2.png"
                alt="ESSAzLife PlayMode cow icon"
            >

            ESSAzLife Play Mode

        </div>


        <div class="header-buttons">

            <button
                id="world-button"
                type="button"
                title="Back to ESSAzLife World"
            >
                🌎
            </button>

            <button
                id="home-button"
                type="button"
                title="PlayMode Home"
            >
                🏠
            </button>

            <button
                id="help-button"
                type="button"
                title="Help"
            >
                ❓
            </button>

            <button
                id="profile-button"
                type="button"
                title="Profile"
            >
                👤
            </button>

        </div>

    </header>


    <main>

        <h1>
            Welcome Back!
        </h1>

    </main>


    <script src="script.js"></script>

</body>
</html>
