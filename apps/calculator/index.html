<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#179df4"><meta name="description" content="A friendly offline calculator from ESSAzLife."><title>ESSAzLife Calculator</title></head>
<body><main class="shell"><header><h1>ESSAzLife Calculator</h1><div class="top-actions"><button class="history-toggle" id="historyToggle" aria-expanded="false" aria-controls="historyPanel" title="History">History</button><a class="icon-btn" href="https://essazlife.github.io/ESSAzLife-World/" aria-label="Return to World" title="Return to World">◎</a><button class="icon-btn" id="themeToggle" aria-label="Themes" title="Themes">⚙</button></div></header>
<section class="calculator" aria-label="Calculator"><div class="screen" aria-live="polite" aria-atomic="true"><div class="expression" id="expression">&nbsp;</div><div class="result" id="display">0</div></div><div class="keys" id="keys">
<button class="utility" data-action="clear">AC</button><button class="utility" data-action="sign">+/−</button><button class="utility" data-action="percent">%</button><button class="operator" data-op="/">÷</button>
<button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="operator" data-op="*">×</button>
<button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="operator" data-op="-">−</button>
<button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="operator" data-op="+">+</button>
<button class="utility" data-action="backspace" aria-label="Delete last digit">⌫</button><button data-digit="0">0</button><button data-action="decimal">.</button><button class="equals" data-action="equals">=</button>
</div></section>
<aside class="history" id="historyPanel" hidden><div class="history-head"><h2>Recent calculations</h2><button id="clearHistory">Clear</button></div><ol id="historyList"></ol><p id="historyEmpty">No calculations yet.</p></aside><section class="theme-modal" id="themeModal" hidden><div class="theme-head"><h2>Choose a theme</h2><button id="closeThemes" aria-label="Close themes">✕</button></div><div id="themeOptions"></div></section><footer>An ESSAzLife App</footer></main><style>
:root{--accent:#387ac5;--accent-soft:#d7e9fb;--ink:#193d68;--surface:#ffffff;--bg:linear-gradient(155deg,#c7e7ff,#ebf5ff);--digit:#ffffff;--utility:#e4f0fb;--operator:#b6d7f6;--equals:#387ac5;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);background-size:cover;background-position:center;background-attachment:fixed;color:var(--ink)}button,a{font:inherit}button{cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:3px solid #111;outline-offset:2px}.shell{max-width:540px;min-height:100dvh;margin:auto;padding:16px;display:flex;flex-direction:column;gap:12px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:clamp(12px,3.2vw,17px);margin:0;background:var(--surface);border-radius:12px;padding:10px;color:var(--ink);font-weight:700;white-space:nowrap;display:inline-block}.top-actions{display:flex;align-items:center;gap:7px}.top-actions>*{background:var(--surface);border-radius:12px;padding:10px;color:var(--ink);text-decoration:none;font-weight:700;white-space:nowrap}.icon-btn{font-size:23px;min-width:43px;text-align:center}.calculator{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center}.screen{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:22px 16px;text-align:right;min-height:128px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.expression{font-size:15px;min-height:22px;opacity:.65}.result{font-size:clamp(34px,10vw,56px);font-weight:750;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.keys button{min-height:clamp(60px,10dvh,85px);border-radius:18px;background:var(--digit);color:var(--ink);font-size:clamp(22px,6vw,30px);font-weight:650;box-shadow:0 3px 7px #0002}.keys button.utility{background:var(--utility)}.keys button.operator{background:var(--operator)}.keys button.equals{background:var(--equals);color:#fff}.keys button:active{transform:scale(.96)}.history,.theme-modal{background:var(--surface);border-radius:20px;padding:16px;box-shadow:0 8px 30px #0002}.history-head,.theme-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.history-head h2,.theme-head h2{margin:0;font-size:19px}.history-head button,.theme-head button{background:var(--accent-soft);padding:8px 12px;border-radius:10px;color:var(--ink)}.history ol{padding-left:20px;max-height:180px;overflow:auto}.history li{margin:8px 0}.history li span{display:block;font-size:13px;opacity:.75}.history li strong{display:block}.theme-modal{position:fixed;z-index:10;inset:12px;max-width:520px;margin:auto;overflow:auto;max-height:calc(100dvh - 24px);background:#fff;color:#193d68}.theme-group h3{font-size:15px;margin:18px 0 10px}.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:14px 7px}.theme-choice{background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#193d68;text-align:center;padding:0}.swatch{width:60px;height:60px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #a0afc0,0 2px 5px #0002;background-size:cover;background-position:center}.theme-choice[aria-pressed=true] .swatch{box-shadow:0 0 0 3px #246ed2,0 3px 8px #0003}footer{text-align:center;font-size:12px;opacity:.75;padding:6px} [hidden]{display:none!important}@media(min-width:650px){.shell{padding:25px}.keys button{min-height:76px}}@media(max-height:700px){.shell{gap:6px;padding:10px}.calculator{gap:8px}.screen{min-height:90px;padding:10px}.keys{gap:6px}.keys button{min-height:48px}.result{font-size:34px}}
</style><script>'use strict';
const display=document.getElementById('display');
const expression=document.getElementById('expression');
const historyList=document.getElementById('historyList');
const historyEmpty=document.getElementById('historyEmpty');
const historyPanel=document.getElementById('historyPanel');
const historyToggle=document.getElementById('historyToggle');
const symbols={'+':'+','-':'−','*':'×','/':'÷'};
let current='0',stored=null,operator=null,waiting=false,justSolved=false,previous='';
let history=[];
try{const saved=JSON.parse(localStorage.getItem('essazlife-calculator-history')||'[]');if(Array.isArray(saved))history=saved.filter(x=>x&&typeof x.expression==='string'&&typeof x.result==='string').slice(0,30)}catch{}
function format(value){if(value==='Error')return value;const n=Number(value);if(!Number.isFinite(n))return 'Error';if(n===0)return '0';return String(Number(n.toPrecision(12)));}
function show(){display.textContent=current;expression.textContent=operator!==null?`${stored} ${symbols[operator]}`:(previous||'\u00a0');}
function digit(d){if(current==='Error')reset();if(waiting||justSolved){current=d;waiting=false;justSolved=false;previous='';}else if(current==='0'){current=d;}else if(current==='-0'){current='-'+d;}else if(current.replace(/[-.]/g,'').length<14){current+=d;}show();}
function decimal(){if(current==='Error')reset();if(waiting||justSolved){current='0.';waiting=false;justSolved=false;previous='';}else if(!current.includes('.'))current+='.';show();}
function reset(){current='0';stored=null;operator=null;waiting=false;justSolved=false;previous='';show();}
function calculate(a,b,op){const x=Number(a),y=Number(b);if(op==='/'&&y===0)return 'Error';let r;switch(op){case '+':r=x+y;break;case '-':r=x-y;break;case '*':r=x*y;break;case '/':r=x/y;break;default:return b;}return format(r);}
function opSelect(op){if(current==='Error')return;if(operator!==null&&!waiting){const r=calculate(stored,current,operator);if(r==='Error'){current=r;stored=null;operator=null;waiting=false;show();return;}stored=r;current=r;}else if(operator===null)stored=current;operator=op;waiting=true;justSolved=false;previous='';show();}
function saveHistory(label,result){history.unshift({expression:label,result});history=history.slice(0,30);try{localStorage.setItem('essazlife-calculator-history',JSON.stringify(history))}catch{}renderHistory();}
function equals(){if(operator===null||waiting||current==='Error')return;const label=`${stored} ${symbols[operator]} ${current} =`;const result=calculate(stored,current,operator);current=result;previous=label;operator=null;stored=null;waiting=false;justSolved=true;if(result!=='Error')saveHistory(label,result);show();}
function sign(){if(current==='Error')return;current=current.startsWith('-')?current.slice(1):'-'+current;show();}
function percent(){if(current==='Error')return;current=format(Number(current)/100);show();}
function backspace(){if(current==='Error'){reset();return;}if(waiting||justSolved){current='0';waiting=false;justSolved=false;previous='';}else{current=current.slice(0,-1);if(current===''||current==='-')current='0';}show();}
function act(action){if(action==='clear')reset();if(action==='decimal')decimal();if(action==='equals')equals();if(action==='sign')sign();if(action==='percent')percent();if(action==='backspace')backspace();}
document.getElementById('keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)digit(b.dataset.digit);else if(b.dataset.op)opSelect(b.dataset.op);else if(b.dataset.action)act(b.dataset.action);});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;let used=true;if(/^\d$/.test(e.key))digit(e.key);else if(['+','-','*','/'].includes(e.key))opSelect(e.key);else if(e.key==='.'||e.key===',')decimal();else if(e.key==='Enter'||e.key==='=')equals();else if(e.key==='Backspace')backspace();else if(e.key==='Escape')reset();else if(e.key==='%')percent();else used=false;if(used)e.preventDefault();});
function renderHistory(){historyList.replaceChildren();historyEmpty.hidden=history.length>0;for(const entry of history){const li=document.createElement('li'),small=document.createElement('span'),strong=document.createElement('strong');small.textContent=entry.expression;strong.textContent=entry.result;li.append(small,strong);historyList.append(li);}}
historyToggle.addEventListener('click',()=>{historyPanel.hidden=!historyPanel.hidden;historyToggle.setAttribute('aria-expanded',String(!historyPanel.hidden));});
document.getElementById('clearHistory').addEventListener('click',()=>{history=[];try{localStorage.removeItem('essazlife-calculator-history')}catch{}renderHistory();});
renderHistory();show();


const solidColors={Red:'#e74747',Orange:'#f18b31',Yellow:'#f8d74d',Green:'#55b979',Blue:'#367bd8','Light Blue':'#9bd8fa',Purple:'#9564d5','Light Pink':'#f6b8d4',Magenta:'#dc40ad',Black:'#22242a',Grey:'#9299a4',Brown:'#966a4e'};
const gradients={'Sunset':'linear-gradient(145deg,#ffb46a,#f66f9c)','Ocean':'linear-gradient(145deg,#78d9e9,#3e6cda)','Lavender':'linear-gradient(145deg,#e7c9ff,#ac91e7)','Mint':'linear-gradient(145deg,#b6f2cf,#7ac9b7)','Rainbow':'linear-gradient(145deg,#fba4b8,#fbd979,#8ee6bd,#a3b8ff)','Midnight':'linear-gradient(145deg,#202443,#655b9c)','Peach':'linear-gradient(145deg,#ffe0ae,#ff9c9d)','Forest':'linear-gradient(145deg,#276d58,#9ccf77)'};
const themes=[...Object.entries({Teal:'#168e94',Cream:'#c8a979',Maroon:'#822c49',Pink:'#ee8db5',Lime:'#7daf25'}).map(([name,base])=>({id:'essa-'+name,name,category:'ESSA Themes',bg:`url("Themes/${name}.png")`,base,image:true})),...Object.entries(solidColors).map(([name,bg])=>({id:'solid-'+name,name,category:'Solid Colors',bg,base:bg})),...Object.entries(gradients).map(([name,bg])=>({id:'gradient-'+name,name,category:'Gradients',bg,base:({Sunset:'#d45b80',Ocean:'#397fbe',Lavender:'#9169c5',Mint:'#459f83',Rainbow:'#886ed3',Midnight:'#53518c',Peach:'#dc837f',Forest:'#367a5c'})[name]}))];
function mix(a,b,t){const hex=v=>{const c=document.createElement('canvas').getContext('2d');c.fillStyle=v;const h=c.fillStyle;return /^#[0-9a-f]{6}$/i.test(h)?[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)):[90,135,190]};const x=hex(a),y=hex(b);return '#'+x.map((v,i)=>Math.round(v*(1-t)+y[i]*t).toString(16).padStart(2,'0')).join('')}
function applyTheme(id){const theme=themes.find(t=>t.id===id)||themes[5],root=document.documentElement;root.style.setProperty('--bg',theme.bg);root.style.setProperty('--accent',theme.base);root.style.setProperty('--accent-soft',mix(theme.base,'#ffffff',.78));root.style.setProperty('--operator',mix(theme.base,'#ffffff',.55));root.style.setProperty('--utility',mix(theme.base,'#ffffff',.82));root.style.setProperty('--equals',theme.base);root.style.setProperty('--ink','#193047');root.style.setProperty('--surface','#ffffff');root.style.setProperty('--digit','#ffffff');try{localStorage.setItem('essazlife-calculator-theme',theme.id)}catch{}document.querySelectorAll('.theme-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme.id)))}
const modal=document.getElementById('themeModal'),options=document.getElementById('themeOptions');for(const category of ['ESSA Themes','Solid Colors','Gradients']){const section=document.createElement('section');section.className='theme-group';const title=document.createElement('h3');title.textContent=category;const grid=document.createElement('div');grid.className='swatches';for(const t of themes.filter(x=>x.category===category)){const b=document.createElement('button');b.className='theme-choice';b.dataset.theme=t.id;b.setAttribute('aria-pressed','false');const sw=document.createElement('span');sw.className='swatch';sw.style.background=t.bg;const name=document.createElement('span');name.textContent=t.name;b.append(sw,name);b.addEventListener('click',()=>{applyTheme(t.id);modal.hidden=true});grid.append(b)}section.append(title,grid);options.append(section)}
document.getElementById('themeToggle').addEventListener('click',()=>modal.hidden=false);document.getElementById('closeThemes').addEventListener('click',()=>modal.hidden=true);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)modal.hidden=true});let selected='solid-Blue';try{selected=localStorage.getItem('essazlife-calculator-theme')||selected}catch{}applyTheme(selected);
</script></body></html>
