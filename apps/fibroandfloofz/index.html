<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#536e58"><title>Fibro &amp; Floofz</title><link rel="icon" href="fibroandfloofz.icon.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161b17;color:white;font:16px system-ui,sans-serif}#stage{position:fixed;inset:0;display:grid;place-items:center;touch-action:none;overflow:hidden}#page{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:center;pointer-events:none}header{position:fixed;z-index:2;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:12px;background:#536e58;transition:opacity .18s}header[hidden]{display:none}button,a,select{font:inherit}button,a{color:white;background:none;border:0;min-height:44px;display:grid;place-items:center;text-decoration:none;cursor:pointer}select{max-width:100%;width:100%;padding:10px;border:0;border-radius:8px;background:#f8f5ed;color:#344a38}#status{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;pointer-events:none}#retry{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#536e58;border-radius:8px;padding:0 20px}#retry[hidden]{display:none}svg{width:26px;height:26px}#bookmark.saved svg{fill:white}
</style></head><body><main id="stage" aria-label="Book reader"><img id="page" alt="" draggable="false"></main><header id="controls" hidden><button id="bookmark" aria-label="Bookmark current page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button><select id="jump" aria-label="Jump to page"></select><a href="../../index.html" aria-label="Return to World">🌎</a></header><div id="status" role="status">Opening book…</div><button id="retry" hidden>Retry</button><script>
'use strict';
const $=id=>document.getElementById(id), stage=$('stage'), page=$('page'), controls=$('controls'), jump=$('jump'), bookmark=$('bookmark'), status=$('status');
const key='fibroandfloofz.reader.v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}let count=0,current=1,scale=1,x=0,y=0,version=Date.now(),renderId=0;
function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{}}
function url(n){return `Pages/${n}.png?v=${version}`}
function probe(n){return new Promise(resolve=>{const img=new Image();let timer=setTimeout(()=>{img.onload=img.onerror=null;resolve(null)},12000);img.onload=()=>{clearTimeout(timer);resolve(true)};img.onerror=()=>{clearTimeout(timer);resolve(false)};img.src=url(n)})}
function transform(){page.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
function reset(){scale=1;x=y=0;transform()}
function update(){jump.value=String(current);bookmark.classList.toggle('saved',saved.bookmark===current);bookmark.setAttribute('aria-pressed',String(saved.bookmark===current))}
async function show(n){if(!count)return;n=Math.max(1,Math.min(count,n));const id=++renderId;status.textContent='Loading page…';const img=new Image();img.src=url(n);try{await img.decode()}catch{if(id===renderId)status.textContent='Could not load page. Swipe or select a page to retry.';return}if(id!==renderId)return;current=n;page.src=img.src;page.alt=`Page ${n} of ${count}`;reset();saved.current=n;save();update();status.textContent='';for(const k of [n-1,n+1])if(k>=1&&k<=count){const pre=new Image();pre.src=url(k)}}
async function init(){ $('retry').hidden=true;status.textContent='Checking for new pages…';version=Date.now();let n=1;while(true){const exists=await probe(n);if(exists===null||(!exists&&n<=Math.max(1,Number(saved.count)||0))){status.textContent='Could not check all pages. Check your connection and retry.';$('retry').hidden=false;return}if(!exists)break;n++}count=n-1;if(!count){status.textContent='No pages available.';$('retry').hidden=false;return}jump.replaceChildren();for(let i=1;i<=count;i++){const opt=new Option(`Page ${i} of ${count}${saved.bookmark===i?' • Bookmarked':''}`,i);jump.add(opt)}const old=Number(saved.count)||0;const target=old&&count>old?old+1:(Number(saved.current)||1);saved.count=count;await show(target);}
$('retry').onclick=init;jump.onchange=()=>show(Number(jump.value));bookmark.onclick=()=>{const old=saved.bookmark;saved.bookmark=old===current?null:current;save();for(let i=1;i<=count;i++)jump.options[i-1].textContent=`Page ${i} of ${count}${saved.bookmark===i?' • Bookmarked':''}`;update()};
function toggle(){controls.hidden=!controls.hidden}function clamp(){const mx=stage.clientWidth*(scale-1)/2,my=stage.clientHeight*(scale-1)/2;x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));transform()}
let pointers=new Map(),start=null,last=null,pinch=null,multi=false;const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);const p={x:e.clientX,y:e.clientY};pointers.set(e.pointerId,p);if(pointers.size===1){start=last=p;multi=false}else if(pointers.size===2){multi=true;const [a,b]=pointers.values();pinch={distance:dist(a,b),scale}}});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p={x:e.clientX,y:e.clientY};pointers.set(e.pointerId,p);if(pointers.size===2&&pinch){const [a,b]=pointers.values();scale=Math.max(1,Math.min(4,pinch.scale*dist(a,b)/Math.max(1,pinch.distance)));clamp()}else if(pointers.size===1&&scale>1&&last){x+=p.x-last.x;y+=p.y-last.y;clamp()}last=p});stage.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(pointers.size){last=[...pointers.values()][0];return}if(!multi&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)<12)toggle();else if(scale===1&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))show(current+(dx<0?1:-1))}start=last=pinch=null});stage.addEventListener('pointercancel',()=>{pointers.clear();start=last=pinch=null});document.addEventListener('keydown',e=>{if(e.target===jump)return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);if(e.key==='Escape')toggle()});stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();scale=Math.max(1,Math.min(4,scale*Math.exp(-e.deltaY*.01)));clamp()}},{passive:false});init();
</script></body></html>
