<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>ESSAzLife Go</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#090909}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:4;background:#090909;border-bottom:1px solid #343434;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}header b{font-size:1.25rem}header b span,.red{color:#f14646}header button{padding:9px 13px}main{max-width:680px;margin:auto;padding:22px 17px calc(110px + env(safe-area-inset-bottom,0px));min-height:calc(100dvh - 70px)}h1{font-size:1.75rem;margin:6px 0 20px}h2{font-size:1.18rem;margin:0 0 12px}p{line-height:1.5;color:#d0d0d0}.muted{color:#aaa}.small{font-size:.88rem}.card{background:#191919;border:1px solid #383838;border-radius:18px;padding:19px;margin:14px 0}.btn{display:block;width:100%;border:1px solid #d63737;border-radius:13px;background:#b51f25;color:#fff;padding:16px 13px;min-height:54px;font-weight:750;margin:11px 0;text-align:center}.btn.secondary{background:#181818;border-color:#666}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .btn{margin:0}.appchoice{min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#191919;border:1px solid #555;border-radius:18px;color:white;font-size:1.25rem;font-weight:800}.appchoice img{height:65px;width:65px;object-fit:contain}.appchoice .fallback{font-size:2.4rem}.field{display:block;margin:15px 0;font-weight:650}.field input,.field select{display:block;margin-top:7px;width:100%;padding:14px;background:#101010;border:1px solid #777;border-radius:11px;color:#fff;min-height:50px}input::placeholder{color:#999}.tag{overflow-wrap:anywhere;color:#ddd;font-size:.85rem}.notice{border-left:4px solid #e33;padding:12px 15px;background:#232323;border-radius:3px}.pill{display:inline-block;padding:6px 11px;border:1px solid #666;border-radius:30px;font-size:.86rem;margin:0 5px 8px 0}.status{font-size:1rem;font-weight:650;text-align:center;padding:14px}.hero{text-align:center;padding:30px 12px}.hero .symbol{font-size:4.3rem;font-weight:900}.stage{border:2px solid #b92929;border-radius:23px;min-height:260px;padding:25px 15px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}.stage h2{font-size:1.55rem}.clock{font-size:2.5rem;font-weight:850;font-variant-numeric:tabular-nums}.overlay{position:fixed;inset:0;background:#000e;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(100%,500px);background:#1b1b1b;border:1px solid #555;border-radius:18px;padding:22px;max-height:85dvh;overflow:auto}.intro{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;text-align:center;padding:24px}.intro h1{font-size:clamp(2rem,8vw,3.5rem);animation:appear 2.2s ease-in-out both}@keyframes appear{0%,100%{opacity:0}25%,75%{opacity:1}}.intro button{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:20px;background:transparent;border:1px solid #666;color:white;padding:9px 15px;border-radius:10px}.feedback{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:#080808ee;text-align:center}.feedback .mark{font-size:9rem;font-weight:900}.feedback.good .mark{color:#26cc65}.feedback.bad .mark{color:#fa3434}.feedback p{font-size:1.3rem;color:white}.hide{display:none!important}a{color:#fff}@media(max-width:390px){header b{font-size:1rem}header button{padding:8px}.appchoice{min-height:135px}}
</style></head><body>
<header><b>ESSAzLife <span>Go.</span></b><div><button class="btn secondary" style="display:inline-block;width:auto;margin:0" onclick="refreshGo()">↻</button> <button class="btn secondary" style="display:inline-block;width:auto;margin:0" onclick="goWorld()">🌎 World</button></div></header>
<main id="app"></main><div id="modal" class="overlay hide" role="dialog" aria-modal="true"></div><div id="intro" class="intro hide"><h1 id="introText"></h1><button onclick="finishIntro()">Skip intro</button></div><div id="feedback" class="feedback hide"></div>
<script>
'use strict';
const KEY='essazlife-go-v1', TAP_KEY='essazlife-tap-v1';
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{};if(!data||typeof data!=='object')data={caregivers:[],babies:[],settings:{audio:true},history:[],introSeen:false};
data.caregivers??=[];data.babies??=[];data.history??=[];data.settings??={audio:true};
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
let page='choose',type=null,caregiver=null,subject=null,mode=null,session=null,scanner=null,scannerActive=false,ambient=null,cryTimer=null,loop=null,dialogOpen=false;
const tapDb=()=>{try{return JSON.parse(localStorage.getItem(TAP_KEY))||{}}catch{return {}}};
const tapProfiles=()=>Array.isArray(tapDb().essas)?tapDb().essas:[];
const babiezAudio={breath:'../babiez/sounds/breathing.wav',heartbeat:'../babiez/sounds/heartbeat.wav',cry:'../babiez/sounds/crying.wav',happy:'../babiez/sounds/happy.wav'};
const tapAudio={heartbeat:'../tap/sounds/heartbeat.wav',dog:{breath:'../tap/dogsounds/awake.breathing.wav',cry:'../tap/dogsounds/whine.wav',happy:'../tap/dogsounds/dog.talkback.wav'},puppy:{breath:'../tap/dogsounds/awake.breathing.wav',cry:'../tap/dogsounds/puppy.whining.wav',happy:'../tap/dogsounds/puppy.playing.wav'},cat:{breath:'../tap/catsounds/cat.awake.breathing.wav',cry:'../tap/catsounds/Meow.wav',happy:'../tap/catsounds/happy cat.wav'},kitten:{breath:'../tap/catsounds/cat.awake.breathing.wav',cry:'../tap/catsounds/kitten.mew.wav',happy:'../tap/catsounds/kitten.purr.meow.wav'}};
let playing=new Set();function play(path,volume=.65,repeat=false){if(!data.settings.audio||!path)return null;let a=new Audio(encodeURI(path));a.volume=volume;a.loop=repeat;playing.add(a);a.onended=()=>playing.delete(a);a.onerror=()=>{playing.delete(a);if(type==='babiez')console.warn('Check Babiez audio filename:',path)};a.play().catch(()=>{});return a}
function stopSounds(){for(let a of playing){a.pause();a.currentTime=0}playing.clear();ambient=null}
function sound(which){if(type==='babiez')return babiezAudio[which];return which==='heartbeat'?tapAudio.heartbeat:tapAudio[subject?.kind||'dog']?.[which]}
function startAmbient(){if(!session||!data.settings.audio)return;if(!ambient||ambient.paused)ambient=play(sound('breath'),.28,true);if(type==='babiez'&&!session.heartbeat){session.heartbeat=play(sound('heartbeat'),.16,true)}}
function beep(ok){try{let ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ok?720:230;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);o.start();o.stop(ctx.currentTime+.25);setTimeout(()=>ctx.close(),500)}catch{}}
function show(html){$('app').innerHTML=html;window.scrollTo(0,0)}
function button(text,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}
function openModal(html){dialogOpen=true;$('modal').innerHTML=`<div class="dialog">${html}</div>`;$('modal').classList.remove('hide')}
function closeModal(){dialogOpen=false;$('modal').classList.add('hide');$('modal').innerHTML=''}
function goWorld(){if(session&&!confirm('Leave the active simulation?'))return;endTimers();location.href='../../index.html'}
function refreshGo(){if(session&&!confirm('Refresh and end your simulation?'))return;location.reload()}
function intro(){if(data.introSeen)return render();let lines=['Your ESSAs','NFC Powered Care','With a Single Tag.','This is ESSAzLife Go.'],i=0;$('intro').classList.remove('hide');const next=()=>{if(i>=lines.length)return finishIntro();$('introText').textContent=lines[i++];$('introText').style.animation='none';void $('introText').offsetWidth;$('introText').style.animation='appear 2.2s ease-in-out both';window.introTimer=setTimeout(next,2300)};next()}
function finishIntro(){clearTimeout(window.introTimer);$('intro').classList.add('hide');data.introSeen=true;save();render()}
function render(){if(page==='choose')return show(`<h1>Choose your experience</h1><p>One caregiver badge. Two ways to care.</p><div class="grid"><button class="appchoice" onclick="choose('babiez')"><img src="../babiez/Babiez.Icon.png" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hide')" alt=""><span class="fallback hide">◉</span>Babiez</button><button class="appchoice" onclick="choose('tap')"><img src="../../app-icons/Tap.Icon.png" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hide')" alt=""><span class="fallback hide">◆</span>Tap</button></div><div class="card"><h2>How Go works</h2><p>Use one registered caregiver NFC badge to respond to your ESSA. Easy Mode uses one scan; Medium, Hard and Sick use two.</p></div>${button('Caregiver badges','page="caregivers";render()','secondary')}`);
if(page==='caregivers')return show(`<h1>Choose caregiver</h1><p class="muted">Select your name, or register a new caregiver ID badge.</p>${data.caregivers.map(c=>button(safe(c.name)+(c.role?' · '+safe(c.role):''),`selectCaregiver('${safe(c.id)}')`,'secondary')).join('')}${button('+ Add caregiver','page="addcaregiver";render()')}${button('Back','page="choose";render()','secondary')}`);
if(page==='addcaregiver')return show(`<h1>Register caregiver</h1><label class="field">Caregiver name<input id="cName" maxlength="45" placeholder="Your name"></label><label class="field">Babiez relationship<select id="cRole"><option>Mom</option><option>Dad</option><option>Grandma</option><option>Grandpa</option><option>Aunt</option><option>Uncle</option><option>Guardian</option><option>Other</option></select></label><div class="card"><h2>Caregiver NFC badge</h2><p class="small">Write an NDEF text record to your badge using an NFC writing app. Then scan it here to register its exact ID.</p><p class="tag" id="badgeRead">No badge scanned yet</p>${button('Scan caregiver badge','scanRegistration()','secondary')}<label class="field">Or enter its NDEF text manually<input id="cTag" placeholder="Caregiver badge text"></label></div>${button('Save caregiver','saveCaregiver()')}${button('Back','page="caregivers";render()','secondary')}`);
if(page==='subjects'){let list=type==='tap'?tapProfiles():data.babies;return show(`<h1>${type==='tap'?'Choose your ESSA':'Choose your baby'}</h1><p class="muted">Caregiver: ${safe(caregiver?.name)} ${type==='babiez'?'('+safe(caregiver?.role)+')':''}</p>${list.map((e,i)=>button(safe(e.name)+(e.kind?' · '+safe(e.kind):''),`chooseSubject(${i})`,'secondary')).join('')}${type==='babiez'?button('+ Add baby','page="addbaby";render()'):''}${type==='tap'&&!list.length?'<p class="notice">No Tap ESSAs found. Add an ESSA in Tap first, then return to Go.</p>':''}${button('Back to caregivers','page="caregivers";render()','secondary')}`);}
if(page==='addbaby')return show(`<h1>Add baby to Go</h1><label class="field">Baby name<input id="babyName" maxlength="45" placeholder="Baby name"></label>${button('Save baby','addBaby()')}${button('Back','page="subjects";render()','secondary')}`);
if(page==='modes')return show(`<h1>${safe(subject?.name)} · Care Modes</h1><p>Caregiver: ${safe(caregiver?.name)}${type==='babiez'?' · '+safe(caregiver?.role):''}</p>${[['comfort','Comfort','Listen to breathing'+(type==='babiez'?' and heartbeat':'')+'.'],['easy','Easy','One badge tap responds to a need.'],['medium','Medium','Two badge taps, then guess the need.'],['hard','Hard','More frequent needs and bedtime resistance.'],['sick','Sick','Illness-related needs and two-tap care.']].map(([k,n,d])=>`<button class="btn secondary" style="text-align:left" onclick="selectMode('${k}')"><strong>${n}</strong><br><span class="small" style="font-weight:400">${d}</span></button>`).join('')}${button('Back','page="subjects";render()','secondary')}`);
if(page==='prepare')return show(`<h1>Prepare ${safe(subject.name)}</h1><div class="card"><p><b>Mode:</b> ${safe(mode)}</p><p><b>Caregiver:</b> ${safe(caregiver.name)}</p><p><b>Experience:</b> ${safe(type)}</p></div><p class="notice">${mode==='medium'||mode==='hard'||mode==='sick'?'When your '+(type==='babiez'?'baby cries':'ESSA whines or meows')+', tap your caregiver badge twice. The first tap reassures them; the second opens the care choices.':'Keep Go open and your phone unlocked for NFC care.'}</p>${button('Enable NFC scanner','startNfc()','secondary')}<p class="small muted" id="nfcStatus">${scannerActive?'NFC enabled':'Scanner not enabled yet'}</p>${button("I'm Ready — Start Simulation",'begin()')}${button('Back to modes','page="modes";render()','secondary')}`);
if(page==='running')return renderRunning();
if(page==='report')return renderReport();
}
function choose(t){type=t;caregiver=null;subject=null;page='caregivers';render()}
function selectCaregiver(id){caregiver=data.caregivers.find(c=>c.id===id);if(!caregiver)return;page='subjects';render()}
function saveCaregiver(){let name=$('cName').value.trim(),tag=$('cTag').value.trim()||window.pendingBadge||'';if(!name)return alert('Enter a caregiver name.');if(!tag)return alert('Scan or enter a caregiver badge text.');if(data.caregivers.some(c=>c.tag===tag))return alert('That badge is already registered.');data.caregivers.push({id:uuid(),name,role:$('cRole').value,tag});window.pendingBadge='';save();page='caregivers';render()}
function addBaby(){let name=$('babyName').value.trim();if(!name)return alert('Enter a baby name.');data.babies.push({id:uuid(),name});save();page='subjects';render()}
function chooseSubject(i){subject=(type==='tap'?tapProfiles():data.babies)[i];if(!subject)return;page='modes';render()}
function selectMode(m){mode=m;page='prepare';render()}
async function scanRegistration(){if(!('NDEFReader' in window))return alert('Web NFC requires Chrome on a supported Android device over HTTPS.');try{const r=new NDEFReader();await r.scan();$('badgeRead').textContent='Hold your badge to the phone…';r.onreading=e=>{let v=readNdef(e);if(!v)return;window.pendingBadge=v;$('badgeRead').textContent='Badge read: '+v;$('cTag').value=v;r.onreading=null}}catch(e){alert('NFC scanner unavailable: '+e.message)}}
function readNdef(event){for(const record of event.message.records){try{if(record.recordType==='text'){return new TextDecoder(record.encoding||'utf-8').decode(record.data).replace(/^\uFEFF/,'').trim()}}catch{}}return ''}
async function startNfc(){if(!('NDEFReader' in window))return alert('Web NFC is supported on Chrome for Android over HTTPS. You can also use the manual badge button during a simulation.');try{if(scannerActive)return alert('NFC scanner already active.');scanner=new NDEFReader();await scanner.scan();scannerActive=true;scanner.onreading=e=>{let tag=readNdef(e);if(tag)handleBadge(tag)};if($('nfcStatus'))$('nfcStatus').textContent='NFC enabled';if(page==='running')renderRunning()}catch(e){alert('Unable to enable NFC: '+e.message)}}
function needs(){return type==='babiez'?(mode==='sick'?['milk','diaper','comfort','sleep','medicine']:['milk','diaper','comfort','sleep']):(mode==='sick'?['food','water','potty','comfort','sleep','medicine']:['food','water','potty','comfort','sleep'])}
function intervalMs(){return mode==='hard'?20000:mode==='sick'?26000:mode==='medium'?36000:48000}
function begin(){endTimers();session={start:Date.now(),need:null,step:0,score:100,correct:0,wrong:0,events:[],paused:false,heartbeat:null};page='running';startAmbient();if(mode!=='comfort')scheduleNeed(4000);loop=setInterval(()=>{if(page==='running')updateClock()},1000);render()}
function scheduleNeed(delay){clearTimeout(cryTimer);if(!session||session.paused||mode==='comfort')return;cryTimer=setTimeout(()=>{if(!session||session.paused)return;if(!session.need){let list=needs();session.need=list[Math.floor(Math.random()*list.length)];session.step=0;play(sound('cry'));renderRunning()}scheduleNeed(intervalMs())},delay)}
function renderRunning(){if(!session)return;let need=session.need;show(`<div><h1>${safe(subject.name)} <span class="pill">${safe(mode.toUpperCase())}</span></h1><span class="pill">Caregiver: ${safe(caregiver.name)}</span><span class="pill">Score: ${session.score}%</span><span class="pill" id="elapsed">00:00</span><div class="stage"><div style="font-size:3rem">${type==='babiez'?'♡':'◆'}</div><h2>${mode==='comfort'?'Comfort Mode':need?'Your '+(type==='babiez'?'baby':'ESSA')+' needs care':session.paused?'Paused':'Relaxing'}</h2><div class="clock">${need?'!':'♥'}</div><p>${mode==='comfort'?'Listen to the ambient sounds.':need?(mode==='easy'?'Tap your caregiver badge once.':session.step===0?'Tap your caregiver badge to reassure them.':'Tap the caregiver badge again to choose care.'):'Waiting for the next care moment…'}</p></div><div class="status">${scannerActive?'NFC scanner enabled':'NFC scanner not enabled'}</div><div class="grid">${button('Enable NFC','startNfc()','secondary')}${button('Use caregiver ID','manualBadge()','secondary')}${button('Care history','showCareHistory()','secondary')}${button(session.paused?'Resume':'Take a break','togglePause()','secondary')}</div>${button('End Simulation','finish()','secondary')}</div>`);updateClock()}
function updateClock(){if($('elapsed')&&session)$('elapsed').textContent=fmt(Date.now()-session.start)}
function fmt(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function handleBadge(tag){if(!session||page!=='running'||session.paused||dialogOpen)return;if(tag!==caregiver.tag){feedback(false,'Unrecognized caregiver badge');return}respond()}
function manualBadge(){if(!session||session.paused)return;respond()}
function respond(){if(!session.need){feedback(true,'Caregiver recognized');return}if(mode==='easy'){applyCare(session.need);return}if(session.step===0){session.step=1;feedback(true,'Caregiver is here');renderRunning();return}session.step=0;chooseCare()}
function chooseCare(){let opts=needs();openModal(`<h2>What does ${type==='babiez'?'baby':'your ESSA'} need?</h2><p>Choose the care you think is needed.</p><div class="grid">${opts.map(n=>button(n[0].toUpperCase()+n.slice(1),`guess('${n}')`,'secondary')).join('')}</div>${button('Cancel','closeModal()','secondary')}`)}
function guess(choice){closeModal();if(!session?.need)return;if(choice===session.need)applyCare(choice);else{session.wrong++;session.score=Math.max(0,session.score-10);session.events.push({time:Date.now(),text:'Incorrect guess: '+choice});feedback(false,'Not quite. Try again.');play(sound('cry'));renderRunning()}}
function applyCare(choice){if(mode==='hard'&&choice==='sleep'&&Math.random()<.55){session.wrong++;session.score=Math.max(0,session.score-5);session.events.push({time:Date.now(),text:'Resisted bedtime'});feedback(false,'Not ready for bed');play(sound('cry'));renderRunning();return}session.correct++;session.events.push({time:Date.now(),text:'Care completed: '+choice});session.need=null;session.step=0;feedback(true,'Correct care!');play(sound('happy'));renderRunning()}
function feedback(ok,msg){beep(ok);const el=$('feedback');el.className='feedback '+(ok?'good':'bad');el.innerHTML=`<div><div class="mark">${ok?'✓':'✕'}</div><p>${safe(msg)}</p></div>`;setTimeout(()=>el.classList.add('hide'),850)}
function togglePause(){if(!session)return;session.paused=!session.paused;if(session.paused)clearTimeout(cryTimer);else if(!session.need)scheduleNeed(intervalMs());renderRunning()}
function showCareHistory(){if(!session)return;openModal(`<h2>Care so far</h2><p>Correct: ${session.correct} · Incorrect: ${session.wrong}</p>${session.events.length?session.events.map(e=>`<p class="small">${safe(e.text)}</p>`).join(''):'<p>No care yet.</p>'}${button('Close','closeModal()','secondary')}`)}
function endTimers(){clearTimeout(cryTimer);clearInterval(loop);stopSounds()}
function finish(){if(!session)return;if(!confirm('End this simulation and view the report?'))return;endTimers();data.history.unshift({id:uuid(),date:new Date().toISOString(),name:subject.name,type,mode,caregiver:caregiver.name,score:session.score,correct:session.correct,wrong:session.wrong,events:session.events});data.history=data.history.slice(0,100);save();page='report';render()}
function renderReport(){let r=data.history[0];if(!r)return page='choose',render();show(`<h1>Go Report Card</h1><div class="card hero"><div class="symbol" style="color:${r.score>=80?'#35c46b':'#f14646'}">${r.score>=90?'A':r.score>=80?'B':r.score>=70?'C':r.score>=60?'D':'F'}</div><h2>${r.score}%</h2><p>${safe(r.name)} · ${safe(r.mode)}</p></div><div class="grid"><div class="card"><h2>${r.correct}</h2>Correct care</div><div class="card"><h2>${r.wrong}</h2>Incorrect actions</div></div><div class="card"><h2>Caregiver</h2>${safe(r.caregiver)}</div><div class="card"><h2>Care history</h2>${r.events.length?r.events.map(e=>`<p>${safe(e.text)}</p>`).join(''):'<p>No care actions recorded.</p>'}</div>${button('Choose another mode','session=null;page="modes";render()')}${button('Go home','session=null;page="choose";render()','secondary')}`)}
intro();
</script></body></html>
