<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b37"><title>Santa Voidy Saves Christmas</title><style>

ves img{width:16px;height:16px}#world{width:37px;height:40px;font-size:21px}}#overlay{position:fixed;inset:0;background:#06151dcf;display:grid;place-items:center;padding:20px;overflow-y:auto}#panel{background:linear-gradient(145deg,#183e49,#0d2834);border:2px solid #b8e6e0;border-radius:24px;max-width:520px;width:100%;padding:24px;text-align:center;box-shadow:0 18px 60px #0009}h1{font-size:clamp(28px,6vw,42px);line-height:1.05;margin:8px 0 12px;color:#fff4cb}p{line-height:1.5}#panel.gold{background:linear-gradient(145deg,#704717,#39240b);border:3px solid #ffe09b;box-shadow:0 0 0 4px #a87926,0 18px 60px #0009}#panel .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.small{font-size:13px;color:#c6d9df}#touch{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}#touch button{pointer-events:auto;width:65px;height:65px;background:#194b58bb;border:2px solid #c5e9e8aa;border-radius:50%;font-size:26px;touch-action:none}#touch .group{display:flex;gap:10px}#touch[hidden],#overlay[hidden]{display:none!important}@media(min-width:850px){#touch{opacity:.65}}

</style></head><body><audio id="christmasMusic" src="../../HolidayStash/Christmas/Sounds/christmas-piano.wav" preload="none" loop></audio><button id="musicToggle" type="button" aria-label="Play Christmas music" title="Play Christmas music" aria-pressed="false">▶</button><canvas id="game" aria-label="Santa Voidy Christmas runner"></canvas><div id="hud" hidden><div class="stats"><span id="score">Score 0</span><span id="gifts">Gifts 0</span><span id="stage">Stage 1</span></div><div class="hud-right"><div id="lives" aria-label="10 lives remaining"></div><a id="world" href="../../index.html" aria-label="Return to ESSAzLife World" title="Back to World">🌎</a><button id="pause" aria-label="Pause game">Ⅱ</button></div></div><div id="touch" hidden><div class="group"><button data-move="left" aria-label="Move left">←</button><button data-move="right" aria-label="Move right">→</button></div><div class="group"><button data-move="jump" aria-label="Jump">↑</button><button data-move="slide" aria-label="Slide">↓</button></div></div><div id="overlay"><div id="panel"></div></div><script>
(()=>{'use strict';
// Music is user-initiated (browser autoplay restrictions) and independent of game pause.
const christmasMusic=document.getElementById('christmasMusic');
const musicToggle=document.getElementById('musicToggle');
christmasMusic.volume=0.45;
function syncMusicButton(){
  const playing=!christmasMusic.paused;
  musicToggle.textContent=playing?'Ⅱ':'▶';
  musicToggle.setAttribute('aria-label',playing?'Pause Christmas music':'Play Christmas music');
  musicToggle.setAttribute('title',playing?'Pause Christmas music':'Play Christmas music');
  musicToggle.setAttribute('aria-pressed',String(playing));
}
musicToggle.addEventListener('click',async()=>{
  if(!christmasMusic.paused){christmasMusic.pause();syncMusicButton();return;}
  try{await christmasMusic.play();}catch(err){
    musicToggle.title='Music could not load. Check HolidayStash/Christmas/Sounds/christmas-piano.wav';
    console.warn('Christmas music unavailable:',err);
  }
  syncMusicButton();
});
christmasMusic.addEventListener('play',syncMusicButton);
christmasMusic.addEventListener('pause',syncMusicButton);
christmasMusic.addEventListener('ended',syncMusicButton);
christmasMusic.addEventListener('error',()=>{musicToggle.title='Music file not found';syncMusicButton()});
const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d'),panel=$('panel');let W=0,H=0,dpr=1,last=0,raf=0,mode='menu',audio=null,muted=false;let state;
const santaVoidySprite=new Image();santaVoidySprite.src='../playmode/PlayModeAssets/Voidy/voidy-dog-santa.png';
const STAGES=[{name:'Snowy Village',speed:330,sky:'#143b59'},{name:'Candy Cane Forest',speed:395,sky:'#4a254f'},{name:'North Pole Express',speed:460,sky:'#122e54'}];const KEY='essazlife-santa-voidy-best-v1';
function best(){try{return Number(localStorage.getItem(KEY)||0)}catch{return 0}}function saveBest(n){try{localStorage.setItem(KEY,String(Math.max(best(),n)))}catch{}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function sound(freq=440,dur=.1,type='sine',vol=.05){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function jingle(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>sound(f,.13,'triangle',.045),i*95))}
function overlay(title,body,buttons){$('overlay').hidden=false;panel.replaceChildren();let h=document.createElement('h1');h.textContent=title;panel.append(h);let p=document.createElement('p');p.innerHTML=body;panel.append(p);let a=document.createElement('div');a.className='actions';buttons.forEach(([name,fn,secondary])=>{let b=document.createElement('button');b.textContent=name;if(secondary)b.className='secondary';b.onclick=fn;a.append(b)});panel.append(a)}
function showMenu(){panel.classList.remove('gold');mode='menu';$('hud').hidden=true;$('touch').hidden=true;overlay('Santa Voidy Saves Christmas','The presents have scattered across the North Pole! Run endlessly down a snowy Christmas hill, collect gifts, and dodge obstacles. You have 10 Santa Voidy lives. Collisions cost one life; the run ends when all 10 are gone.<br><br><b>Controls:</b> ← → change lanes · ↑ jump over logs · ↓ duck under arches. Swipe on phones.<br><span class="small">50 gifts: choose an outfit code · 100 gifts: mystery box · Best score: '+best()+' · Sound is synthesized, no external audio files required.</span>',[['Save Christmas!',start],['Sound: '+(muted?'Off':'On'),()=>{muted=!muted;showMenu()},true]])}
function start(){state={stage:0,score:0,total:0,collected:0,lives:10,awarded50:false,awarded100:false,stageGifts:0,lane:1,visualLane:1,jump:0,slide:0,invuln:0,items:[],spawn:0,dist:0,elapsed:0,particles:[],snow:Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,v:20+Math.random()*45}))};mode='playing';$('overlay').hidden=true;$('hud').hidden=false;$('touch').hidden=false;updateHUD();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);jingle()}
function updateHUD(){$('score').textContent='Score '+Math.floor(state.score);$('gifts').textContent='Gifts '+state.total;renderLives();$('stage').textContent=STAGES[state.stage].name}
function renderLives(){const el=$('lives');if(el.dataset.remaining===String(state.lives))return;el.dataset.remaining=String(state.lives);el.replaceChildren();for(let i=0;i<10;i++){let img=document.createElement('img');img.src=santaVoidySprite.src;img.alt='';if(i>=state.lives)img.className='lost';el.append(img)}el.setAttribute('aria-label',state.lives+' of 10 Santa Voidy lives remaining')}
function move(action){if(mode!=='playing')return;if(action==='left')state.lane=Math.max(0,state.lane-1);if(action==='right')state.lane=Math.min(2,state.lane+1);if(action==='jump'&&state.jump<=0&&state.slide<=0){state.jump=.85;sound(580,.09,'square',.025)}if(action==='slide'&&state.slide<=0&&state.jump<=0){state.slide=.75;sound(220,.08,'sine',.03)}}
function pause(){if(mode==='playing'){mode='paused';overlay('Paused','Voidy is taking a cocoa break.',[['Resume',()=>{mode='playing';$('overlay').hidden=true;last=performance.now();raf=requestAnimationFrame(loop)}],['Restart',start,true],['Main Menu',showMenu,true]])}}
$('pause').onclick=pause;document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.move)}));addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','Escape','p'].includes(e.key))e.preventDefault();if(e.key==='Escape'||e.key==='p'){pause();return}let a=({'ArrowLeft':'left','a':'left','ArrowRight':'right','d':'right','ArrowUp':'jump','w':'jump',' ':'jump','ArrowDown':'slide','s':'slide'})[e.key];if(a)move(a)});let swipe=null;c.addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',e=>{if(!swipe)return;let dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'slide':'jump');swipe=null});
function spawn(){let lane=Math.floor(Math.random()*3),roll=Math.random();let type=roll<.56?'gift':roll<.75?'log':roll<.91?'arch':'snowman';state.items.push({lane,type,z:1.3,hit:false});if(Math.random()<.27){let other=(lane+1+Math.floor(Math.random()*2))%3;state.items.push({lane:other,type:'gift',z:1.48,hit:false})}}
const REWARD_KEY='essazlife-santa-voidy-rewards-v1';
function rewardData(){try{return JSON.parse(localStorage.getItem(REWARD_KEY)||'{}')}catch{return {}}}
function saveReward(key,value){let r=rewardData();r[key]=value;try{localStorage.setItem(REWARD_KEY,JSON.stringify(r))}catch{}}
// Codes are provisional local claim tokens until MooCow/DaisyBelle redemption handlers are implemented.
function claimCode(kind){let r=rewardData();if(r[kind])return r[kind];let code='SV26-'+kind.toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();saveReward(kind,code);return code}
function resumeRun(){mode='playing';$('overlay').hidden=true;panel.classList.remove('gold');last=performance.now();raf=requestAnimationFrame(loop)}
function rewardPopup100(){mode='reward';panel.classList.add('gold');overlay('A GIANT MYSTERY BOX!','🎁<br><br>You collected <b>100 gifts in one run!</b> Your surprise is waiting inside the box.',[['Open Mystery Box',()=>{let code=claimCode('buddy');overlay('SURPRISE!','You unlocked the <b>Santa Voidy Buddy</b> reward for MooCow and DaisyBelle!<br><br>Save this claim code:<br><strong>'+code+'</strong><br><span class="small">Code redemption in the two house games still needs to be connected.</span>',[['Copy Code',()=>{navigator.clipboard?.writeText(code)}],['Keep Running',resumeRun]])}]]);}
function rewardPopup50(){
 mode='reward';panel.classList.add('gold');
 overlay('GOLDEN CHRISTMAS PRESENT!',
 'You collected <b>50 gifts in one run!</b><br>Choose one golden present.<div class="present-choices">'+
 '<button type="button" class="present-choice" onclick="showOutfitCode(\'moocow\')"><img src="../../HolidayStash/Christmas/Presents/gold-present.png" alt="Golden present"><span>MooCow</span></button>'+
 '<button type="button" class="present-choice" onclick="showOutfitCode(\'daisybelle\')"><img src="../../HolidayStash/Christmas/Presents/gold-present.png" alt="Golden present"><span>DaisyBelle</span></button></div>',[]);
}
function showOutfitCode(which){let code=claimCode(which+'-outfit');overlay('Your '+(which==='moocow'?'MooCow':'DaisyBelle')+' Present!','Your outfit claim code is:<br><strong>'+code+'</strong><br><span class="small">Keep this code. Redemption in the matching game still needs to be implemented.</span>',[['Copy Code',()=>{navigator.clipboard?.writeText(code)}],['Keep Running',resumeRun]])}
function lose(){panel.classList.remove('gold');mode='gameover';saveBest(Math.floor(state.score));$('touch').hidden=true;sound(170,.45,'sawtooth',.04);overlay('Oh No, Voidy!','All ten Santa Voidy lives have been used.<br><br>Score: <b>'+Math.floor(state.score)+'</b><br>Gifts rescued: '+state.total+'<br>Best score: '+best(),[['Try Again',start],['Main Menu',showMenu,true]])}
function update(dt){let s=state,stage=STAGES[s.stage];s.elapsed+=dt;s.score+=dt*12;s.dist+=dt*stage.speed;if(s.elapsed>40&&s.stage<2)s.stage=1;if(s.elapsed>95)s.stage=2;s.jump=Math.max(0,s.jump-dt);s.slide=Math.max(0,s.slide-dt);s.invuln=Math.max(0,s.invuln-dt);s.visualLane+=(s.lane-s.visualLane)*Math.min(1,dt*13);s.spawn-=dt;if(s.spawn<=0){spawn();s.spawn=.48+Math.random()*.35}for(let it of s.items){it.z-=dt*(stage.speed/520);if(!it.hit&&it.z<.14&&it.z>-.08&&it.lane===s.lane){it.hit=true;if(it.type==='gift'){s.collected++;s.total++;s.score+=100;sound(820,.08,'triangle');setTimeout(()=>sound(1100,.11,'triangle'),65);if(s.total===50&&!s.awarded50){s.awarded50=true;updateHUD();rewardPopup50();return}if(s.total===100&&!s.awarded100){s.awarded100=true;updateHUD();rewardPopup100();return}}else{let safe=it.type==='log'?s.jump>.18:it.type==='arch'?s.slide>.15:false;if(!safe&&s.invuln<=0){s.lives=Math.max(0,s.lives-1);s.invuln=1.5;sound(160,.2,'sine',.035);updateHUD();if(s.lives===0){lose();return}}}}}s.items=s.items.filter(it=>it.z>-.15);for(let fl of s.snow){fl.y+=fl.v*dt;fl.x-=dt*9;if(fl.y>H){fl.y=0;fl.x=Math.random()*W}if(fl.x<0)fl.x=W}updateHUD()}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function laneX(l,z){let spread=W*(.29-.18*Math.max(0,Math.min(1,z)));return W/2+(l-1)*spread}function project(z){let t=1-Math.max(0,Math.min(1,z));return {y:H*.28+t*t*H*.67,scale:.15+t*1.15}}
function draw(){let s=state;if(!s)return;let stage=STAGES[s.stage];let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,stage.sky);sky.addColorStop(1,'#5f9eac');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#e9f3f5';ctx.beginPath();ctx.arc(W*.79,H*.14,Math.min(W,H)*.06,0,Math.PI*2);ctx.fill();for(let i=0;i<14;i++){let x=(i*149+37)%W,y=H*.32+Math.sin(i*2.7)*H*.07;ctx.fillStyle=i%2?'#e9ffff':'#c5e8ec';ctx.beginPath();ctx.moveTo(x-90,H*.58);ctx.lineTo(x,y);ctx.lineTo(x+90,H*.58);ctx.fill();ctx.fillStyle='#285e55';ctx.beginPath();ctx.moveTo(x-25,H*.56);ctx.lineTo(x,y+20);ctx.lineTo(x+25,H*.56);ctx.fill()}ctx.fillStyle='#edf7f9';ctx.fillRect(0,H*.55,W,H*.45);
// Solid snow hill, with gentle static shading and no flashing or moving road markings.
let hill=ctx.createLinearGradient(0,H*.29,0,H);hill.addColorStop(0,'#f9fdff');hill.addColorStop(.52,'#e6f3fa');hill.addColorStop(1,'#c8e3f0');ctx.fillStyle=hill;ctx.beginPath();ctx.moveTo(W*.33,H*.29);ctx.lineTo(W*.67,H*.29);ctx.lineTo(W*.99,H);ctx.lineTo(W*.01,H);ctx.closePath();ctx.fill();
for(let it of [...s.items].sort((a,b)=>b.z-a.z)){let p=project(it.z),x=laneX(it.lane,it.z),size=42*p.scale;if(it.z>1.05)continue;ctx.fillStyle='#779bad48';ctx.beginPath();ctx.ellipse(x,p.y+2*p.scale,size*.56,size*.13,0,0,Math.PI*2);ctx.fill();if(it.type==='gift'){rounded(x-size*.48,p.y-size*.78,size,size*.85,4*p.scale,'#d9364c');rounded(x-size*.08,p.y-size*.78,size*.16,size*.85,2,'#ffe59a');rounded(x-size*.48,p.y-size*.48,size,size*.13,2,'#ffe59a');ctx.fillStyle='#ffe59a';ctx.beginPath();ctx.ellipse(x-size*.12,p.y-size*.85,size*.17,size*.11,-.5,0,Math.PI*2);ctx.ellipse(x+size*.12,p.y-size*.85,size*.17,size*.11,.5,0,Math.PI*2);ctx.fill()}else if(it.type==='log'){rounded(x-size*.7,p.y-size*.42,size*1.4,size*.42,size*.2,'#77472c');ctx.strokeStyle='#c48a55';ctx.lineWidth=3*p.scale;ctx.strokeRect(x-size*.6,p.y-size*.35,size*1.2,size*.2)}else if(it.type==='arch'){ctx.strokeStyle='#e84150';ctx.lineWidth=12*p.scale;ctx.beginPath();ctx.moveTo(x-size*.6,p.y);ctx.lineTo(x-size*.6,p.y-size*1.5);ctx.quadraticCurveTo(x,p.y-size*2,x+size*.6,p.y-size*1.5);ctx.lineTo(x+size*.6,p.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=4*p.scale;ctx.setLineDash([10*p.scale,9*p.scale]);ctx.stroke();ctx.setLineDash([])}else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,p.y-size*.38,size*.45,0,7);ctx.arc(x,p.y-size*.98,size*.3,0,7);ctx.fill();ctx.fillStyle='#232b3a';ctx.beginPath();ctx.arc(x-size*.1,p.y-size*1.02,size*.035,0,7);ctx.arc(x+size*.1,p.y-size*1.02,size*.035,0,7);ctx.fill()}}
let px=laneX(s.visualLane,0.04),py=H*.86-(s.jump>0?Math.sin((.85-s.jump)/.85*Math.PI)*H*.18:0);drawVoidy(px,py,s.slide>0);for(let fl of s.snow){ctx.fillStyle='#ffffffb9';ctx.beginPath();ctx.arc(fl.x,fl.y,fl.r,0,7);ctx.fill()}}
function drawVoidy(x,y,slide){
  let sz=Math.min(W*.19,115);
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#18333b55';ctx.beginPath();ctx.ellipse(0,8,sz*.48,sz*.13,0,0,Math.PI*2);ctx.fill();
  if(santaVoidySprite.complete&&santaVoidySprite.naturalWidth>0){
    const ratio=santaVoidySprite.naturalWidth/santaVoidySprite.naturalHeight;
    const h=slide?sz*.82:sz*1.55;
    const w=Math.min(sz*1.65,h*ratio);
    ctx.drawImage(santaVoidySprite,-w/2,-h,w,h);
  }else{
    // Do not substitute the old black character when the artwork is unavailable.
    ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';
    ctx.fillText('Santa Voidy',0,-sz*.45);
  }
  ctx.restore();
}
function loop(t){if(mode!=='playing')return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();if(mode==='playing')raf=requestAnimationFrame(loop)}showMenu();
})();
</script></body></html>
