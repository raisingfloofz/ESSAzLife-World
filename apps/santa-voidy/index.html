<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b37"><title>Santa Voidy Saves Christmas</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#102b37}*{box-sizing:border-box}body{margin:0;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;background:#102b37}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:800;color:white;background:#d83f4c}button:focus-visible{outline:3px solid #fff}button.secondary{background:#315d69}#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none;text-shadow:0 2px 5px #000}#hud>*{pointer-events:auto}.stats{display:flex;gap:10px;flex-wrap:wrap;font-weight:900;font-size:clamp(12px,3vw,17px)}#hud button{padding:9px 13px}#overlay{position:fixed;inset:0;background:#06151dcf;display:grid;place-items:center;padding:20px;overflow-y:auto}#panel{background:linear-gradient(145deg,#183e49,#0d2834);border:2px solid #b8e6e0;border-radius:24px;max-width:520px;width:100%;padding:24px;text-align:center;box-shadow:0 18px 60px #0009}h1{font-size:clamp(28px,6vw,42px);line-height:1.05;margin:8px 0 12px;color:#fff4cb}p{line-height:1.5}#panel .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.small{font-size:13px;color:#c6d9df}#touch{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}#touch button{pointer-events:auto;width:65px;height:65px;background:#194b58bb;border:2px solid #c5e9e8aa;border-radius:50%;font-size:26px;touch-action:none}#touch .group{display:flex;gap:10px}#touch[hidden],#overlay[hidden]{display:none!important}@media(min-width:850px){#touch{opacity:.65}}
</style></head><body><canvas id="game" aria-label="Santa Voidy Christmas runner"></canvas><div id="hud" hidden><div class="stats"><span id="score">Score 0</span><span id="gifts">Gifts 0/15</span><span id="lives">♥ ♥ ♥</span><span id="stage">Stage 1</span></div><button id="pause" aria-label="Pause game">Ⅱ</button></div><div id="touch" hidden><div class="group"><button data-move="left" aria-label="Move left">←</button><button data-move="right" aria-label="Move right">→</button></div><div class="group"><button data-move="jump" aria-label="Jump">↑</button><button data-move="slide" aria-label="Slide">↓</button></div></div><div id="overlay"><div id="panel"></div></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d'),panel=$('panel');let W=0,H=0,dpr=1,last=0,raf=0,mode='menu',audio=null,muted=false;let state;
const STAGES=[{name:'Snowy Village',goal:15,speed:330,sky:'#143b59'},{name:'Candy Cane Forest',goal:25,speed:395,sky:'#4a254f'},{name:'North Pole Express',goal:35,speed:460,sky:'#122e54'}];const KEY='essazlife-santa-voidy-best-v1';
function best(){try{return Number(localStorage.getItem(KEY)||0)}catch{return 0}}function saveBest(n){try{localStorage.setItem(KEY,String(Math.max(best(),n)))}catch{}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function sound(freq=440,dur=.1,type='sine',vol=.05){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function jingle(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>sound(f,.13,'triangle',.045),i*95))}
function overlay(title,body,buttons){$('overlay').hidden=false;panel.replaceChildren();let h=document.createElement('h1');h.textContent=title;panel.append(h);let p=document.createElement('p');p.innerHTML=body;panel.append(p);let a=document.createElement('div');a.className='actions';buttons.forEach(([name,fn,secondary])=>{let b=document.createElement('button');b.textContent=name;if(secondary)b.className='secondary';b.onclick=fn;a.append(b)});panel.append(a)}
function showMenu(){mode='menu';$('hud').hidden=true;$('touch').hidden=true;overlay('Santa Voidy Saves Christmas','The presents have scattered across the North Pole! Run through <b>3 festive stages</b>, collect enough gifts, and dodge obstacles to save Christmas.<br><br><b>Controls:</b> ← → change lanes · ↑ jump over logs · ↓ duck under arches. Swipe on phones.<br><span class="small">3 hearts per run · Best score: '+best()+' · Sound is synthesized, no external audio files required.</span>',[['Save Christmas!',start],['Sound: '+(muted?'Off':'On'),()=>{muted=!muted;showMenu()},true]])}
function start(){state={stage:0,score:0,total:0,collected:0,lives:3,lane:1,visualLane:1,jump:0,slide:0,invuln:0,items:[],spawn:0,dist:0,elapsed:0,particles:[],snow:Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,v:20+Math.random()*45}))};mode='playing';$('overlay').hidden=true;$('hud').hidden=false;$('touch').hidden=false;updateHUD();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);jingle()}
function updateHUD(){$('score').textContent='Score '+Math.floor(state.score);$('gifts').textContent='Gifts '+state.collected+'/'+STAGES[state.stage].goal;$('lives').textContent='♥ '.repeat(state.lives).trim();$('stage').textContent='Stage '+(state.stage+1)}
function move(action){if(mode!=='playing')return;if(action==='left')state.lane=Math.max(0,state.lane-1);if(action==='right')state.lane=Math.min(2,state.lane+1);if(action==='jump'&&state.jump<=0&&state.slide<=0){state.jump=.85;sound(580,.09,'square',.025)}if(action==='slide'&&state.slide<=0&&state.jump<=0){state.slide=.75;sound(220,.08,'sine',.03)}}
function pause(){if(mode==='playing'){mode='paused';overlay('Paused','Voidy is taking a cocoa break.',[['Resume',()=>{mode='playing';$('overlay').hidden=true;last=performance.now();raf=requestAnimationFrame(loop)}],['Restart',start,true],['Main Menu',showMenu,true]])}}
$('pause').onclick=pause;document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.move)}));addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','Escape','p'].includes(e.key))e.preventDefault();if(e.key==='Escape'||e.key==='p'){pause();return}let a=({'ArrowLeft':'left','a':'left','ArrowRight':'right','d':'right','ArrowUp':'jump','w':'jump',' ':'jump','ArrowDown':'slide','s':'slide'})[e.key];if(a)move(a)});let swipe=null;c.addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',e=>{if(!swipe)return;let dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'slide':'jump');swipe=null});
function spawn(){let lane=Math.floor(Math.random()*3),roll=Math.random();let type=roll<.56?'gift':roll<.75?'log':roll<.91?'arch':'snowman';state.items.push({lane,type,z:1.3,hit:false});if(Math.random()<.27){let other=(lane+1+Math.floor(Math.random()*2))%3;state.items.push({lane:other,type:'gift',z:1.48,hit:false})}}
function winStage(){mode='transition';jingle();if(state.stage===STAGES.length-1){saveBest(Math.floor(state.score));overlay('CHRISTMAS IS SAVED!','Santa Voidy recovered all the presents! 🎄<br><br><b>Final score: '+Math.floor(state.score)+'</b><br>Total gifts: '+state.total+'<br>Best score: '+best(),[['Play Again',start],['Main Menu',showMenu,true]]);$('touch').hidden=true;return}overlay('Stage '+(state.stage+1)+' Complete!','You rescued '+state.collected+' presents in '+STAGES[state.stage].name+'.<br><br>Next stop: <b>'+STAGES[state.stage+1].name+'</b>!',[['Next Stage',()=>{state.stage++;state.collected=0;state.items=[];state.spawn=.5;state.invuln=1.5;mode='playing';$('overlay').hidden=true;updateHUD();last=performance.now();raf=requestAnimationFrame(loop)}]])}
function lose(){mode='gameover';saveBest(Math.floor(state.score));$('touch').hidden=true;sound(170,.45,'sawtooth',.04);overlay('Oh No, Voidy!','The Christmas mission ended early.<br><br>Score: <b>'+Math.floor(state.score)+'</b><br>Gifts rescued: '+state.total+'<br>Best score: '+best(),[['Try Again',start],['Main Menu',showMenu,true]])}
function update(dt){let s=state,stage=STAGES[s.stage];s.elapsed+=dt;s.score+=dt*12;s.dist+=dt*stage.speed;s.jump=Math.max(0,s.jump-dt);s.slide=Math.max(0,s.slide-dt);s.invuln=Math.max(0,s.invuln-dt);s.visualLane+=(s.lane-s.visualLane)*Math.min(1,dt*13);s.spawn-=dt;if(s.spawn<=0){spawn();s.spawn=.48+Math.random()*.35-(s.stage*.05)}for(let it of s.items){it.z-=dt*(stage.speed/520);if(!it.hit&&it.z<.14&&it.z>-.08&&it.lane===s.lane){it.hit=true;if(it.type==='gift'){s.collected++;s.total++;s.score+=100;sound(820,.08,'triangle');setTimeout(()=>sound(1100,.11,'triangle'),65);if(s.collected>=stage.goal){updateHUD();winStage();return}}else{let safe=it.type==='log'?s.jump>.18:it.type==='arch'?s.slide>.15:false;if(!safe&&s.invuln<=0){s.lives--;s.invuln=1.5;sound(160,.25,'sawtooth');if(s.lives<=0){updateHUD();lose();return}}}}}s.items=s.items.filter(it=>it.z>-.15);for(let fl of s.snow){fl.y+=fl.v*dt;fl.x-=dt*9;if(fl.y>H){fl.y=0;fl.x=Math.random()*W}if(fl.x<0)fl.x=W}updateHUD()}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function laneX(l,z){let spread=W*.23*(1.25-z*.65);return W/2+(l-1)*spread}function project(z){let t=1-Math.max(0,Math.min(1,z));return {y:H*.28+t*t*H*.67,scale:.15+t*1.15}}
function draw(){let s=state;if(!s)return;let stage=STAGES[s.stage];let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,stage.sky);sky.addColorStop(1,'#5f9eac');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#e9f3f5';ctx.beginPath();ctx.arc(W*.79,H*.14,Math.min(W,H)*.06,0,Math.PI*2);ctx.fill();for(let i=0;i<14;i++){let x=(i*149+37)%W,y=H*.32+Math.sin(i*2.7)*H*.07;ctx.fillStyle=i%2?'#e9ffff':'#c5e8ec';ctx.beginPath();ctx.moveTo(x-90,H*.58);ctx.lineTo(x,y);ctx.lineTo(x+90,H*.58);ctx.fill();ctx.fillStyle='#285e55';ctx.beginPath();ctx.moveTo(x-25,H*.56);ctx.lineTo(x,y+20);ctx.lineTo(x+25,H*.56);ctx.fill()}ctx.fillStyle='#edf7f9';ctx.fillRect(0,H*.55,W,H*.45);
ctx.fillStyle='#568e9d';ctx.beginPath();ctx.moveTo(W*.45,H*.29);ctx.lineTo(W*.55,H*.29);ctx.lineTo(W*.99,H);ctx.lineTo(W*.01,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#b4e3df';ctx.lineWidth=4;for(let lane=.5;lane<=1.5;lane++){ctx.beginPath();ctx.moveTo(laneX(lane,1),H*.29);ctx.lineTo(laneX(lane,0),H);ctx.stroke()}for(let k=0;k<11;k++){let z=((k/10+s.dist/230)%1);let p=project(z);ctx.strokeStyle='#ffffff70';ctx.lineWidth=Math.max(2,6*p.scale);ctx.beginPath();ctx.moveTo(laneX(0,z)-W*.09*p.scale,p.y);ctx.lineTo(laneX(2,z)+W*.09*p.scale,p.y);ctx.stroke()}
for(let it of [...s.items].sort((a,b)=>b.z-a.z)){let p=project(it.z),x=laneX(it.lane,it.z),size=42*p.scale;if(it.z>1.05)continue;if(it.type==='gift'){rounded(x-size*.48,p.y-size*.78,size,size*.85,4*p.scale,'#d9364c');rounded(x-size*.08,p.y-size*.78,size*.16,size*.85,2,'#ffe59a');rounded(x-size*.48,p.y-size*.48,size,size*.13,2,'#ffe59a');ctx.fillStyle='#ffe59a';ctx.beginPath();ctx.ellipse(x-size*.12,p.y-size*.85,size*.17,size*.11,-.5,0,Math.PI*2);ctx.ellipse(x+size*.12,p.y-size*.85,size*.17,size*.11,.5,0,Math.PI*2);ctx.fill()}else if(it.type==='log'){rounded(x-size*.7,p.y-size*.42,size*1.4,size*.42,size*.2,'#77472c');ctx.strokeStyle='#c48a55';ctx.lineWidth=3*p.scale;ctx.strokeRect(x-size*.6,p.y-size*.35,size*1.2,size*.2)}else if(it.type==='arch'){ctx.strokeStyle='#e84150';ctx.lineWidth=12*p.scale;ctx.beginPath();ctx.moveTo(x-size*.6,p.y);ctx.lineTo(x-size*.6,p.y-size*1.5);ctx.quadraticCurveTo(x,p.y-size*2,x+size*.6,p.y-size*1.5);ctx.lineTo(x+size*.6,p.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=4*p.scale;ctx.setLineDash([10*p.scale,9*p.scale]);ctx.stroke();ctx.setLineDash([])}else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,p.y-size*.38,size*.45,0,7);ctx.arc(x,p.y-size*.98,size*.3,0,7);ctx.fill();ctx.fillStyle='#232b3a';ctx.beginPath();ctx.arc(x-size*.1,p.y-size*1.02,size*.035,0,7);ctx.arc(x+size*.1,p.y-size*1.02,size*.035,0,7);ctx.fill()}}
let px=laneX(s.visualLane,0.04),py=H*.86-(s.jump>0?Math.sin((.85-s.jump)/.85*Math.PI)*H*.18:0);if(s.invuln>0&&Math.floor(s.invuln*9)%2===0)ctx.globalAlpha=.38;drawVoidy(px,py,s.slide>0);ctx.globalAlpha=1;for(let fl of s.snow){ctx.fillStyle='#ffffffb9';ctx.beginPath();ctx.arc(fl.x,fl.y,fl.r,0,7);ctx.fill()}}
function drawVoidy(x,y,slide){let sz=Math.min(W*.17,86);ctx.save();ctx.translate(x,y);if(slide)ctx.scale(1.25,.65);ctx.fillStyle='#18333b55';ctx.beginPath();ctx.ellipse(0,8,sz*.55,sz*.14,0,0,7);ctx.fill();ctx.fillStyle='#1a202e';ctx.beginPath();ctx.ellipse(0,-sz*.5,sz*.43,sz*.55,0,0,7);ctx.fill();ctx.fillStyle='#f7f9fc';ctx.beginPath();ctx.ellipse(-sz*.15,-sz*.58,sz*.1,sz*.14,0,0,7);ctx.ellipse(sz*.15,-sz*.58,sz*.1,sz*.14,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-sz*.14,-sz*.58,sz*.035,0,7);ctx.arc(sz*.16,-sz*.58,sz*.035,0,7);ctx.fill();rounded(-sz*.39,-sz*.93,sz*.78,sz*.15,sz*.08,'#fff');ctx.fillStyle='#d93545';ctx.beginPath();ctx.moveTo(-sz*.36,-sz*.94);ctx.lineTo(-sz*.05,-sz*1.43);ctx.lineTo(sz*.35,-sz*.94);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-sz*.05,-sz*1.42,sz*.12,0,7);ctx.fill();ctx.fillStyle='#d93545';rounded(-sz*.34,-sz*.23,sz*.68,sz*.22,sz*.1,'#d93545');ctx.restore()}
function loop(t){if(mode!=='playing')return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();if(mode==='playing')raf=requestAnimationFrame(loop)}showMenu();
})();
</script></body></html>
