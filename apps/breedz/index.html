<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ed"><link rel="icon" href="breedz.icon.png"><title>ESSAzLife Breedz</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8ed;color:#382b24;font:16px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#fff8edf5;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #e7d9c7}header img{width:48px;height:48px;object-fit:contain}header strong{font-size:24px}header a{margin-left:auto;text-decoration:none;font-size:25px}main{max-width:720px;margin:auto;padding:18px 14px 40px}h1{font-size:25px;margin:0 0 6px}p{line-height:1.5}.intro{color:#78685b;margin:0 0 18px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}button{font:inherit;cursor:pointer;color:inherit}.tile{border:1px solid #eadbc7;border-radius:18px;background:white;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}.tile img{width:100%;aspect-ratio:1;object-fit:contain}.tile span{text-align:center;font-size:14px}dialog{border:0;border-radius:22px;padding:0;width:min(94vw,480px);max-height:92dvh;background:#fffdf8;color:inherit;box-shadow:0 12px 50px #0004}dialog::backdrop{background:#251b15aa}.bar{position:sticky;top:0;background:#fffdf8;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eadbc7;z-index:1}.bar button,.nav button{border:0;border-radius:12px;background:#ead9bd;padding:10px 14px;font-weight:700}.content{padding:16px}.hero{width:100%;height:180px;object-fit:contain}.content h2{margin:8px 0 16px;text-align:center}.fact{border-top:1px solid #eee3d5;padding:12px 0}.fact h3{font-size:14px;color:#88602e;margin:0 0 5px}.fact p{margin:0}.nav{position:sticky;bottom:0;background:#fffdf8;padding:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eadbc7}.nav button:disabled{opacity:.4}.note{font-size:12px;color:#78685b}button:focus-visible,a:focus-visible{outline:3px solid #9a672a;outline-offset:2px}</style></head><body><header><img src="breedz.icon.png" alt=""><strong>Breedz</strong><a href="../../index.html" aria-label="Return to ESSAzLife World">🌎</a></header><main><h1>Meet the animals</h1><p class="intro">Tap an ESSA to learn about the real animal it represents.</p><div class="gallery" id="gallery"></div><p class="note">Breed traits are general tendencies, not guarantees. Wild animals belong in appropriate natural habitats.</p></main><dialog id="detail" aria-labelledby="animalName"><div class="bar"><strong>Animal facts</strong><button id="close" aria-label="Close facts">✕</button></div><div class="content" id="content"></div><div class="nav"><button id="prev">← Previous</button><span id="count"></span><button id="next">Next →</button></div></dialog><script>const animals=[["akita", "Akita", "Canis lupus familiaris", "Large, sturdy dog with erect ears, thick double coat and curled tail.", "Often loyal, reserved and independent.", "Responds to consistent reward-based training and early socialization.", "Exercise, predictable routines and time with trusted people.", "Rough handling, overheating and unwanted interactions.", "A complete, balanced dog food suited to age, size and activity, with fresh water. Adjust portions to maintain a healthy weight."], ["basset-hound", "Basset Hound", "Canis lupus familiaris", "Short legs, long ears and a long, low body.", "Often gentle, sociable and scent-driven.", "Trainable with rewards; scent distractions can be challenging.", "Sniffing, leisurely walks and companionship.", "Harsh training and prolonged isolation.", "Complete, balanced dog food in measured portions. Bassets can gain weight easily, so limit treats and provide fresh water."], ["bat", "Bat", "Chiroptera (order)", "Winged mammal with elongated fingers supporting a membrane.", "Behavior varies widely; many species are social and nocturnal.", "Wild animals; not suitable for pet training.", "Species-appropriate roosts, darkness and natural food sources.", "Disturbed roosts, habitat loss and handling.", "Diet depends on the species. Many bats eat insects; others eat fruit, nectar, fish or small animals. A few species feed on blood."], ["beagle", "Beagle", "Canis lupus familiaris", "Compact hound with floppy ears and a short coat.", "Often curious, friendly and energetic.", "Reward-based training works well; scent distractions are common.", "Scent games, company and exploration.", "Boredom and long periods alone.", "Complete, balanced dog food with measured portions and fresh water. Beagles are often food-motivated and may overeat."], ["bengal-coco", "Bengal Cat", "Felis catus", "Athletic cat with spotted or marbled coat.", "Often active, curious and playful.", "Can learn tricks through positive reinforcement.", "Climbing, interactive play and exploration.", "Understimulation and forced handling.", "A complete, balanced cat food containing animal-derived nutrients, including taurine. Cats are obligate carnivores and need fresh water."], ["border-collie", "Border Collie", "Canis lupus familiaris", "Athletic herding dog with varied coat colors and lengths.", "Often alert, focused and energetic.", "Highly responsive to reward-based training.", "Problem-solving, exercise and structured activities.", "Boredom and insufficient rest or stimulation.", "Complete, balanced dog food with portions adjusted to activity level. Working dogs may need more energy than less active companions."], ["boston-terrier", "Boston Terrier", "Canis lupus familiaris", "Compact dog with upright ears, short muzzle and tuxedo-like markings.", "Often affectionate and playful.", "Usually responsive to short, positive sessions.", "Companionship and gentle play.", "Heat, strenuous exercise in hot weather and rough handling.", "Complete, balanced dog food suited to age and size, with measured portions and fresh water."], ["bunny", "Domestic Rabbit", "Oryctolagus cuniculus", "Long ears, powerful hind legs and soft fur.", "Often curious, cautious and social.", "Can learn litter habits and simple cues with rewards.", "Hay, hiding places, digging and safe companionship.", "Being lifted unnecessarily, loud noises and rough handling.", "Unlimited grass hay for healthy adults, fresh leafy greens, a small measured amount of rabbit pellets and fresh water. Fruit is an occasional treat."], ["devon-rex", "Devon Rex", "Felis catus", "Large ears, slender body and short wavy coat.", "Often playful, curious and people-oriented.", "Can learn tricks with rewards.", "Warm resting places, climbing and interactive play.", "Cold environments and forced interactions.", "Complete, balanced cat food supplying animal-derived nutrients, including taurine, with fresh water. Portions should match age and activity."], ["doodle", "Doodle (Poodle Mix)", "Canis lupus familiaris", "Appearance varies by parent breeds; coats may be curly, wavy or straight.", "Temperament varies with ancestry and individual experience.", "Often responsive to rewards; ability varies.", "Play, enrichment and companionship.", "Boredom and uncomfortable grooming.", "Complete, balanced dog food suited to the individual dog’s age, adult size and activity. Nutritional needs vary with the parent breeds."], ["duck-tolling-retriever", "Nova Scotia Duck Tolling Retriever", "Canis lupus familiaris", "Medium-sized retriever with reddish coat and often white markings.", "Often energetic, alert and playful.", "Typically responsive to positive, varied training.", "Retrieving, swimming where safe and active games.", "Repetitive drills and lack of stimulation.", "Complete, balanced dog food with energy and portions matched to activity level, plus fresh water."], ["emperor-penguin", "Emperor Penguin", "Aptenodytes forsteri", "Large flightless seabird with black, white and yellow markings.", "Social, colonial and adapted to Antarctic conditions.", "Wild species; not a domestic training animal.", "Marine prey, suitable sea ice and colony life.", "Habitat disruption, overheating and human disturbance.", "Carnivorous: primarily fish, along with krill and squid caught while diving in Antarctic waters."], ["german-pointer", "German Pointer", "Canis lupus familiaris", "Athletic hunting dog; coat and appearance depend on the pointer variety.", "Often active, attentive and exploratory.", "Typically responds well to reward-based training.", "Scent work, exercise and retrieving.", "Insufficient activity and harsh corrections.", "Complete, balanced dog food adjusted to age and activity. Highly active working dogs may require more calories."], ["german-shepherd", "German Shepherd", "Canis lupus familiaris", "Large athletic dog with erect ears and a double coat.", "Often attentive, loyal and confident when well socialized.", "Generally highly trainable with positive reinforcement.", "Structured activities, scent work and companionship.", "Boredom, harsh handling and overwhelming situations.", "Complete, balanced dog food appropriate for age and activity. Large-breed puppies need food formulated for their growth needs."], ["golden-retriever", "Golden Retriever", "Canis lupus familiaris", "Medium-large dog with a golden, feathered coat.", "Often friendly, sociable and eager to engage.", "Typically responsive to reward-based training.", "Retrieving, play and companionship.", "Isolation, harsh training and boredom.", "Complete, balanced dog food with measured portions and fresh water. Goldens can be prone to weight gain."], ["grey-tabby", "Grey Tabby Cat", "Felis catus", "Grey coat with striped, spotted or swirled tabby markings.", "Personality varies; tabby is a coat pattern, not a breed.", "Can learn cues through rewards.", "Play, scratching posts and comfortable hiding places.", "Forced contact and unpredictable disturbances.", "Complete, balanced cat food containing essential animal-derived nutrients such as taurine, plus fresh water. Coat pattern does not determine dietary needs."], ["husky", "Siberian Husky", "Canis lupus familiaris", "Medium-sized dog with thick coat, erect ears and bushy tail.", "Often social, energetic and independent.", "Trainable with patience, rewards and consistency.", "Running safely, exploration and companionship.", "Heat, boredom and prolonged confinement.", "Complete, balanced dog food adjusted to age, body condition and exercise. Endurance-working dogs may have much higher energy needs."], ["piglet-piebald", "Piebald Domestic Pig", "Sus scrofa domesticus", "Young pig with contrasting patches of color; piebald is a coat pattern.", "Often curious, social and intelligent.", "Can learn cues and routines through rewards.", "Rooting, foraging and social contact.", "Isolation, rough handling and lack of enrichment.", "Pigs are omnivores. Domestic pigs need balanced pig-specific feed appropriate for age, with suitable vegetables and fresh water. Young piglets initially drink milk."], ["pug", "Pug", "Canis lupus familiaris", "Small dog with wrinkled face, short muzzle and curled tail.", "Often sociable and affectionate.", "Usually responds to gentle reward-based sessions.", "Companionship, gentle play and cool resting areas.", "Heat and strenuous exercise, especially with breathing difficulties.", "Complete, balanced dog food in measured portions, with fresh water. Maintaining a healthy weight is especially important for pugs."], ["red-doxie", "Red Dachshund", "Canis lupus familiaris", "Long-bodied, short-legged dog with reddish coat.", "Often curious, bold and scent-driven.", "Can learn well with patient rewards.", "Sniffing, play and companionship.", "Rough handling and activities that strain the back.", "Complete, balanced dog food in measured portions. Maintaining a healthy weight helps reduce unnecessary strain on the back."], ["red-panda", "Red Panda", "Ailurus fulgens", "Reddish fur, ringed tail and pale facial markings.", "Generally solitary and often active around dawn and dusk.", "Wild species; not suitable as a pet.", "Bamboo, trees and cool forest habitat.", "Heat, habitat loss and disturbance.", "Mostly bamboo leaves and shoots, with occasional fruit, berries, insects or eggs. Despite belonging to the order Carnivora, red pandas mainly eat plants."], ["whitetail", "White-tailed Deer", "Odocoileus virginianus", "Slender deer with a white underside to its tail.", "Alert and cautious; social behavior varies by season.", "Wild species; not suitable for pet training.", "Natural forage, cover and undisturbed habitat.", "Predator threats, habitat disruption and human pursuit.", "Herbivorous: leaves, twigs, shoots, grasses, herbs, acorns and other fruits. Food choices change with the seasons and habitat."], ["yellow-lab", "Yellow Labrador Retriever", "Canis lupus familiaris", "Sturdy retriever with short yellow coat and thick tail.", "Often outgoing, playful and food-motivated.", "Typically responsive to positive reinforcement.", "Retrieving, swimming safely and companionship.", "Boredom, harsh handling and excessive heat.", "Complete, balanced dog food with measured portions and fresh water. Labradors are often enthusiastic eaters and can be prone to weight gain."]];const $=id=>document.getElementById(id);const path=a=>'Breed-Plush-Images/'+a[0]+'.png';function imageFallback(img,a){const alternatives={'basset-hound':['bassett-hound'],'golden-retriever':['golder-retriever']}[a[0]]||[];let i=0;img.onerror=()=>{if(i<alternatives.length)img.src='Breed-Plush-Images/'+alternatives[i++]+'.png';else img.onerror=null;};}let current=0;const dialog=$('detail');animals.forEach((a,i)=>{const b=document.createElement('button');b.className='tile';const img=document.createElement('img');imageFallback(img,a);img.src=path(a);img.alt='';img.loading='lazy';const label=document.createElement('span');label.textContent=a[1];b.append(img,label);b.onclick=()=>{show(i);dialog.showModal()};$('gallery').append(b)});function show(i){current=i;const a=animals[i];const c=$('content');c.replaceChildren();const img=document.createElement('img');img.className='hero';imageFallback(img,a);img.src=path(a);img.alt=a[1]+' plush';const h=document.createElement('h2');h.id='animalName';h.textContent=a[1];c.append(img,h);['Scientific name / classification','Appearance','Personality / behavior','Trainability','Things they like','Things they don’t like','Diet'].forEach((label,j)=>{const section=document.createElement('section');section.className='fact';const title=document.createElement('h3');title.textContent=label;const p=document.createElement('p');p.textContent=a[j+2];section.append(title,p);c.append(section)});if(a[0]==='yellow-lab'){const section=document.createElement('section');section.className='fact';const title=document.createElement('h3');title.textContent='Fun fact: Maple’s birthmark';const p=document.createElement('p');p.textContent='Maple, our Yellow Labrador ESSA, has a black birthmark on her face! Real yellow Labradors can occasionally have unusual patches of black fur due to localized differences in pigmentation, sometimes called somatic mosaicism.';section.append(title,p);c.append(section);}$('count').textContent=(i+1)+' / '+animals.length;$('prev').disabled=i===0;$('next').disabled=i===animals.length-1;dialog.scrollTop=0} $('prev').onclick=()=>{if(current>0)show(current-1)};$('next').onclick=()=>{if(current<animals.length-1)show(current+1)};$('close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});</script></body></html>
