<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#92691e"><title>ESSAz Monthly</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf4e5;color:#493619;font:16px system-ui,sans-serif}header{text-align:center;background:#92691e;color:white;padding:18px;position:relative}header img{width:72px;height:72px;border:2px solid white;border-radius:18px}h1{font-size:23px;margin:8px 0}header p{margin:0;font-size:14px}.world{position:absolute;right:14px;top:14px;background:white;border-radius:12px;padding:12px;text-decoration:none}main{max-width:650px;margin:auto;padding:22px 16px}h2{font-size:21px}.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.issue{background:white;border:2px solid #e1c78e;border-radius:16px;padding:8px;color:inherit;text-align:left;box-shadow:0 4px 12px #59451b22;cursor:pointer}.issue canvas{width:100%;height:auto;display:block;border-radius:9px;background:#e9d8b3}.issue strong,.issue small{display:block;padding:5px}button{font:inherit;cursor:pointer}#reader{position:fixed;inset:0;background:#141414;z-index:10;display:none;overflow:hidden}#reader.open{display:block}#stage{position:absolute;inset:0;display:grid;place-items:center;touch-action:none;overflow:hidden}#page{display:block;max-width:none;transform-origin:center;user-select:none}#bar{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:#211b12ed;color:white;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2}#bar[hidden]{display:none}#bar button{border:0;border-radius:9px;padding:10px;background:#fff4d8;color:#493619}#bar button[aria-pressed=true]{background:#d9a740}#status{position:absolute;bottom:20px;left:10px;right:10px;text-align:center;color:white;pointer-events:none}a{color:inherit}.note{font-size:13px;color:#725e3b}body.reading{overflow:hidden}
</style></head><body><header><a class="world" href="../../index.html" aria-label="Return to World">🌐</a><img src="magazine.icon.png" alt="Magazine"><h1>ESSAz Monthly</h1><p>Made by the ESSA community, for the ESSA community.</p></header><main><h2>Latest Issue</h2><div class="shelf" id="latest"></div><h2>Previous Issues</h2><div class="shelf" id="archive"></div><p class="note" id="empty">More issues coming soon!</p><p class="note">Swipe to turn pages. Tap once to show reading controls.</p></main><section id="reader" aria-label="Magazine reader"><div id="stage"><canvas id="page"></canvas></div><div id="bar" hidden><button id="back">← Back</button><span id="count"></span><button id="mark" aria-pressed="false" aria-label="Bookmark page">☆ Bookmark</button></div><div id="status" role="status"></div></section><script type="module">
const issues=[{id:'2026-12',title:'December 2026',number:1,file:'Issues/December 2026 Issue.pdf'}];
const $=id=>document.getElementById(id);let pdfjs;const docs=new Map();let current,doc,n=1,zoom=1,dx=0,dy=0,renderId=0;const read=(id)=>{try{return JSON.parse(localStorage.getItem('essaz-monthly:'+id))||{}}catch{return {}}};const save=(data)=>{try{localStorage.setItem('essaz-monthly:'+current.id,JSON.stringify({...read(current.id),...data}))}catch{}};async function getDoc(i){if(!pdfjs){pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs'}if(!docs.has(i.id))docs.set(i.id,pdfjs.getDocument(encodeURI(i.file)).promise.catch(e=>{docs.delete(i.id);throw e}));return docs.get(i.id)}
function library(){ $('latest').replaceChildren();$('archive').replaceChildren();$('empty').hidden=issues.length>1;issues.forEach((i,k)=>{const b=document.createElement('button');b.className='issue';const c=document.createElement('canvas');c.width=300;c.height=300;const t=document.createElement('strong');t.textContent=i.title;const s=document.createElement('small');const r=read(i.id);s.textContent='Issue #'+i.number+(r.page?' · Resume page '+r.page:'');b.append(c,t,s);b.onclick=()=>open(i);$(k?'archive':'latest').append(b);getDoc(i).then(async d=>{const p=await d.getPage(1);const v=p.getViewport({scale:340/p.getViewport({scale:1}).width});c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}).catch(()=>{s.textContent+=' · PDF unavailable';});});}
async function open(i){current=i;doc=null;n=read(i.id).page||1;zoom=1;dx=dy=0;$('reader').classList.add('open');document.body.classList.add('reading');$('bar').hidden=true;$('status').textContent='Loading magazine…';$('page').width=0;try{const d=await getDoc(i);if(current!==i||!$('reader').classList.contains('open'))return;doc=d;n=Math.min(d.numPages,Math.max(1,n));await draw()}catch(e){$('status').textContent='Unable to load magazine. Check your connection and PDF path.';$('bar').hidden=false}}
function transform(){$('page').style.transform=`translate(${dx}px,${dy}px) scale(${zoom})`}
async function draw(){if(!doc)return;const token=++renderId;const p=await doc.getPage(n);const v0=p.getViewport({scale:1});const fit=Math.min(innerWidth/v0.width,innerHeight/v0.height);const v=p.getViewport({scale:fit*Math.min(devicePixelRatio*1.8,4)});const c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;if(token!==renderId)return;const out=$('page');out.width=c.width;out.height=c.height;out.style.width=fit*v0.width+'px';out.style.height=fit*v0.height+'px';out.getContext('2d').drawImage(c,0,0);transform();$('status').textContent='';save({page:n});controls()}
function controls(){$('count').textContent=doc?`${n} / ${doc.numPages}`:'';const marked=read(current.id).bookmark===n;$('mark').textContent=marked?'★ Bookmarked':'☆ Bookmark';$('mark').setAttribute('aria-pressed',marked)}function turn(delta){if(!doc)return;const next=Math.max(1,Math.min(doc.numPages,n+delta));if(next===n)return;n=next;zoom=1;dx=dy=0;draw().catch(()=>{$('status').textContent='Unable to render page.'})}
$('back').onclick=()=>{renderId++;$('reader').classList.remove('open');document.body.classList.remove('reading');library()};$('mark').onclick=()=>{if(doc){save({bookmark:read(current.id).bookmark===n?null:n});controls()}};
let start=null,pinch=null;const stage=$('stage');stage.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch={dist:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),zoom};start=null}else if(e.touches.length===1){start={x:e.touches[0].clientX,y:e.touches[0].clientY,dx,dy};pinch=null}},{passive:true});stage.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){zoom=Math.max(1,Math.min(4,pinch.zoom*Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/pinch.dist));if(zoom===1)dx=dy=0;transform()}else if(start&&zoom>1&&e.touches.length===1){dx=start.dx+e.touches[0].clientX-start.x;dy=start.dy+e.touches[0].clientY-start.y;transform()}},{passive:true});stage.addEventListener('touchend',e=>{if(!start||pinch){if(!e.touches.length)pinch=null;return}const t=e.changedTouches[0],x=t.clientX-start.x,y=t.clientY-start.y;start=null;if(Math.abs(x)<12&&Math.abs(y)<12)$('bar').hidden=!$('bar').hidden;else if(zoom===1&&Math.abs(x)>45&&Math.abs(x)>Math.abs(y))turn(x<0?1:-1)},{passive:true});stage.addEventListener('click',e=>{if(!e.sourceCapabilities?.firesTouchEvents&& !('ontouchstart' in window))$('bar').hidden=!$('bar').hidden});window.addEventListener('keydown',e=>{if(!$('reader').classList.contains('open'))return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);if(e.key==='Escape')$('back').click()});window.addEventListener('resize',()=>{if(doc&&$('reader').classList.contains('open'))draw()});library();
</script></body></html>
