rid-template-columns:1fr;gap:23px}.video{border:0;background:transparent;padding:0;text-align:left;color:inherit;width:100%}.thumb{width:100%;aspect-ratio:16/9;position:relative;background:#eadbc0;overflow:hidden}.thumb img{height:100%;width:100%;object-fit:cover}.playmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1c140d9c;color:white;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font-size:23px}.metadata{display:flex;gap:12px;padding:12px 16px 0}.miniavatar{width:39px;height:39px;flex:none;border-radius:50%;background:#edd19c;display:grid;place-items:center;overflow:hidden;font-size:16px;font-weight:700}.miniavatar img{width:100%;height:100%;object-fit:cover}.vtitle{font-size:15px;line-height:1.4;font-weight:750;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.byline{font-size:12px;color:#8a7861;margin-top:5px}.empty{text-align:center;padding:28px 25px;color:#8a7861}.empty strong{display:block;color:#4b3b26;margin-bottom:8px}footer{padding:20px 16px;color:#9b896f;text-align:center;font-size:11px}.viewer{position:fixed;inset:0;background:#110f0d;z-index:20;display:flex;flex-direction:column;color:white}.viewerbar{height:55px;display:flex;align-items:center;gap:12px;padding:8px 12px;background:#17120d}.viewerbar button,.viewercontrols button{background:#ffffff22;border:0;border-radius:22px;color:white;padding:9px 14px}.viewerbar b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative}.screen iframe{width:100%;height:100%;border:0;display:block}.viewer.browsing .screen{flex:0 0 auto;height:min(52vw,42vh);min-height:190px}.viewercontrols{padding:9px 12px;display:flex;justify-content:center;gap:9px;background:#17120d;flex-wrap:wrap}.recommendations{flex:1;overflow-y:auto;background:#fffaf1;color:#2f271e;padding:12px 0}.recommendations h3{padding:0 16px;font-size:16px}.rec{display:flex;gap:12px;padding:9px 16px;border:0;background:transparent;width:100%;text-align:left;color:inherit}.rec img{width:140px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.rec div{font-size:13px;font-weight:700}.rec small{display:block;color:#85735b;margin-top:5px}.shortsviewer{position:fixed;inset:0;z-index:30;background:#000;color:white}.shortsclose{position:absolute;top:12px;left:12px;z-index:3;border:0;border-radius:22px;padding:10px 16px;background:#333c;color:white}.shortsstack{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}.shortslide{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center}.shortslide iframe{width:100%;height:100%;border:0}.shortlabel{position:absolute;bottom:25px;left:12px;right:12px;padding:10px;background:#0009;border-radius:10px;pointer-events:none;font-size:13px}.shortnav{position:absolute;right:12px;top:50%;z-index:3;display:grid;gap:8px}.shortnav button{background:#333b;color:white;border:0;border-radius:25px;padding:10px}.shortbadge{position:absolute;right:8px;bottom:8px;background:#161616bc;color:white;padding:3px 7px;border-radius:5px;font-size:11px}@media(min-width:650px){.feed{grid-template-columns:1fr 1fr;gap:25px 16px;padding:0 16px}.thumb{border-radius:14px}.metadata{padding:12px 2px 0}.creator{min-width:84px;width:84px}.creators{gap:22px}.viewer.browsing .screen{height:45vh}.rec{max-width:650px;margin:auto}.shortsstack{max-width:440px;margin:auto}}@media(orientation:landscape) and (max-height:540px){.viewer.browsing .screen{height:42vh;min-height:120px}.viewerbar{height:42px}}
</style></head><body><header><div class="brand"><img src="ESSAzTube.Icon.png" alt="ESSAzTube icon" onerror="this.style.display='none'"><div><div class="smallnote">THE ESSA COMMUNITY</div><strong>ESSAz<span>Tube</span></strong></div></div><span class="headerpill">★ FEATURED</span></header><main><div class="section"><h1 class="heading">Featured Videoz <span class="star">★</span></h1><p class="sub">Watch the latest from your favorite ESSA creators.</p></div><div class="creators" id="creators" aria-label="Choose a featured creator"></div><div class="feedbar"><h2 id="feedTitle">Latest uploads</h2><span id="feedCount"></span></div><div class="feed" id="feed"></div><footer>ESSAzTube · Featuring approved creators · Videos hosted by YouTube</footer></main><div class="viewer hidden" id="viewer" role="dialog" aria-label="Full video player" aria-modal="true"><div class="viewerbar"><button id="backBtn">← Back</button><b id="playingTitle">Now Playing</b></div><div class="screen" id="screen"><iframe id="player" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="viewercontrols"><button id="rotateBtn">Fullscreen / Rotate ↗</button><button id="browseBtn">Browse other videoz ↓</button></div><div class="recommendations hidden" id="recommendations"><h3>More Featured Videoz</h3><div id="recList"></div></div></div><div class="shortsviewer hidden" id="shortsviewer" role="dialog" aria-modal="true" aria-label="Shortz player"><button class="shortsclose" id="shortsClose">← Back</button><div class="shortnav"><button id="shortPrev" aria-label="Previous short">↑</button><button id="shortNext" aria-label="Next short">↓</button></div><div class="shortsstack" id="shortsstack"></div></div>
<script>
'use strict';const HANDLES=['raisingfloofz','Vicky_and_her_Essas','Wobbles_Essa','OliPaws_ESSA','CuddlyHowlers'];const $=id=>document.getElementById(id);let channels=[],videos=[],selected='all',current=null,shortObserver=null;const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const avatar=c=>c?.avatar?`<img src="${safe(c.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:safe((c?.name||c?.handle||'?').charAt(0).toUpperCase());const channelFor=v=>channels.find(c=>c.handle.toLowerCase()===String(v.handle).toLowerCase())||{handle:v.handle,name:v.handle};function date(s){const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}function kind(v){if(v.videoType==='full'||v.videoType==='short')return v.videoType;const n=Number(v.durationSeconds);return Number.isFinite(n)&&n>0?(n>60?'full':'short'):'unknown';}function visible(){return selected==='all'?videos:videos.filter(v=>String(v.handle).toLowerCase()===selected.toLowerCase())}function renderCreators(){const all=`<button class="creator ${selected==='all'?'active':''}" data-handle="all"><span class="avatar">★</span><span class="creator-name">All Creatorz</span></button>`;$('creators').innerHTML=all+channels.map(c=>`<button class="creator ${selected===c.handle?'active':''}" data-handle="${safe(c.handle)}"><span class="avatar">${avatar(c)}</span><span class="creator-name">${safe(c.name||c.handle)} <span class="star">★</span></span></button>`).join('');$('creators').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.handle;renderCreators();renderFeed()});}function videoCard(v){const c=channelFor(v);return `<button class="video" data-id="${safe(v.id)}" aria-label="Watch ${safe(v.title)}"><div class="thumb"><img loading="lazy" src="${safe(v.thumbnail)}" alt=""><span class="playmark">▶</span>${kind(v)==='short'?'<span class="shortbadge">SHORTZ</span>':''}</div><div class="metadata"><div class="miniavatar">${avatar(c)}</div><div><div class="vtitle">${safe(v.title)}</div><div class="byline">${safe(c.name||c.handle)} <span class="star">★</span> · ${date(v.published)}</div></div></div></button>`}function fillFeed(id,list,short=false){$(id).innerHTML=list.length?list.map(videoCard).join(''):`<div class="empty"><strong>${short?'No Shortz available.':'No videos in this section yet.'}</strong></div>`;$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>short?openShort(b.dataset.id):openVideo(b.dataset.id));}function renderFeed(){const list=visible();const ch=channels.find(c=>c.handle.toLowerCase()===selected.toLowerCase());$('feedTitle').textContent=selected==='all'?'Latest uploads':(ch?.name||selected)+' Videoz';$('feedCount').textContent=list.length?`${list.length} video${list.length===1?'':'z'}`:'';$('feed').innerHTML=list.length?list.map(videoCard).join(''):`<div class="empty"><strong>No videos loaded yet.</strong>${videos.length?'Try All Creatorz.':'Run the Update Featured Videos workflow in GitHub Actions.'}</div>`;$('feed').querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=videos.find(x=>x.id===b.dataset.id);if(v&&kind(v)==='short')openShort(v.id);else openVideo(b.dataset.id)});}function recommendations(){const list=visible().filter(v=>v.id!==current?.id).slice(0,45);$('recList').innerHTML=list.map(v=>`<button class="rec" data-id="${safe(v.id)}"><img src="${safe(v.thumbnail)}" loading="lazy" alt=""><div>${safe(v.title)}<small>${safe(channelFor(v).name)} ★</small></div></button>`).join('');$('recList').querySelectorAll('button').forEach(b=>b.onclick=()=>openVideo(b.dataset.id));}function embed(id,autoplay=true){return 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0&autoplay='+(autoplay?'1':'0');}async function tryLandscape(){try{if($('screen').requestFullscreen)await $('screen').requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape');}catch(e){console.info('Landscape requires device/browser permission',e);}}function openVideo(id){const v=videos.find(x=>x.id===id);if(!v)return;current=v;$('playingTitle').textContent=v.title;$('player').src=embed(v.id);$('viewer').classList.remove('hidden');document.body.style.overflow='hidden';recommendations();}async function closeVideo(){if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){}$('viewer').classList.add('hidden');$('player').src='about:blank';$('viewer').classList.remove('browsing');$('recommendations').classList.add('hidden');$('browseBtn').textContent='Browse other videoz ↓';document.body.style.overflow='';current=null;}$('backBtn').onclick=closeVideo;$('rotateBtn').onclick=tryLandscape;$('browseBtn').onclick=()=>{const browse=$('viewer').classList.toggle('browsing');$('recommendations').classList.toggle('hidden',!browse);$('browseBtn').textContent=browse?'Expand video ↑':'Browse other videoz ↓'};
function shortList(){return visible().filter(v=>kind(v)==='short')}function activateShort(slide){$('shortsstack').querySelectorAll('.shortslide').forEach(s=>{const iframe=s.querySelector('iframe');if(s===slide){if(!iframe.src||iframe.src==='about:blank')iframe.src=embed(s.dataset.id)}else if(iframe.src&&iframe.src!=='about:blank')iframe.src='about:blank';});}function openShort(id){const list=shortList();const index=list.findIndex(v=>v.id===id);if(index<0)return;$('shortsstack').innerHTML=list.map(v=>`<section class="shortslide" data-id="${safe(v.id)}"><iframe title="${safe(v.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" loading="lazy"></iframe><div class="shortlabel">${safe(channelFor(v).name)} · ${safe(v.title)}</div></section>`).join('');$('shortsviewer').classList.remove('hidden');document.body.style.overflow='hidden';const slides=[...$('shortsstack').children];if(shortObserver)shortObserver.disconnect();shortObserver=new IntersectionObserver(entries=>{const most=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(most)activateShort(most.target)},{root:$('shortsstack'),threshold:[.55,.8]});slides.forEach(s=>shortObserver.observe(s));slides[index].scrollIntoView({block:'start',behavior:'instant'});activateShort(slides[index]);}function closeShort(){if(shortObserver)shortObserver.disconnect();$('shortsviewer').classList.add('hidden');$('shortsstack').innerHTML='';document.body.style.overflow='';}function stepShort(delta){const stack=$('shortsstack'),slides=[...stack.children];if(!slides.length)return;const idx=Math.round(stack.scrollTop/stack.clientHeight);slides[Math.max(0,Math.min(slides.length-1,idx+delta))].scrollIntoView({block:'start',behavior:'smooth'});}$('shortsClose').onclick=closeShort;$('shortPrev').onclick=()=>stepShort(-1);$('shortNext').onclick=()=>stepShort(1);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('shortsviewer').classList.contains('hidden'))closeShort();else if(!$('viewer').classList.contains('hidden'))closeVideo();}});async function init(){try{const res=await fetch('./videos.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('Feed unavailable');const data=await res.json();channels=HANDLES.map(h=>data.channels?.find(c=>String(c.handle).toLowerCase()===h.toLowerCase())||{handle:h,name:h,avatar:''});videos=(data.videos||[]).filter(v=>HANDLES.some(h=>h.toLowerCase()===String(v.handle).toLowerCase())&&/^[\w-]{11}$/.test(v.id)).sort((a,b)=>String(b.published).localeCompare(String(a.published)));}catch(e){channels=HANDLES.map(handle=>({handle,name:handle,avatar:''}));videos=[];console.warn(e);}renderCreators();renderFeed();}init();
</script></body></html>
