.driverz-dialog h2{font-size:24px;line-height:1.2;text-align:center;margin:8px 0 10px}.driverz-dialog p{font-size:16px;line-height:1.45;font-weight:700;text-align:center;color:var(--muted);margin:0 0 22px;overflow-wrap:anywhere}

'use strict';
const CHARACTERS=['boba','brisket','coco','coolant','crash','lily','maple','mocha','moose','mudpie','oreo','sprinkles','stormy','trouble'];
const STATES='Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming'.split('|');
const THEMES={green:['#58cc02','#e4f8d8'],pink:['#ef69a8','#ffe5f0'],blue:['#1cb0f6','#def4ff'],purple:['#9c70e8','#eee3ff'],orange:['#f49a28','#fff0d9'],dark:['#79c83d','#263728']};
const SOUND={correct:'correct.wav',incorrect:'incorrect.wav',click:'click.wav',complete:'complete.wav',unlock:'unlock.mp3',levelup:'levelup.wav',achievement:'achievement.wav',streak:'streak.wav'};
const LESSONS=[
 {unit:'Meet Your Car',title:'NO NO & GO GO',teacher:'mudpie',info:['In most automatic cars, the <strong>brake</strong> is the wider pedal on the LEFT. We call it <strong>NO NO</strong> because it slows or stops the car.','The <strong>accelerator (gas pedal)</strong> is on the RIGHT. We call it <strong>GO GO</strong> because it makes the car go faster.','In an automatic car, use your <strong>RIGHT FOOT</strong> for both the brake and accelerator. Keep your left foot on the footrest.'],q:[['Which pedal is NO NO?',['Brake','Accelerator','Parking brake'],0,'NO NO means brake. It slows or stops the car.'],['Which pedal is GO GO?',['Brake','Accelerator','Clutch'],1,'GO GO means accelerator (gas pedal).'],['Which foot should operate both pedals in an automatic car?',['Left foot','Right foot','Both feet'],1,'Use your right foot for both pedals in an automatic car.']]},
 {unit:'Meet Your Car',title:'The Steering Wheel',teacher:'stormy',info:['The <strong>steering wheel</strong> controls the direction of the front wheels.','Use smooth, controlled steering movements and keep both hands ready to steer.','Look toward where you want the vehicle to go, while continually scanning the road.'],q:[['What controls the direction of the car?',['Steering wheel','Gas pedal','Turn signal'],0,'The steering wheel turns the vehicle.'],['How should you steer?',['With sudden jerks','Smoothly and deliberately','Only with one finger'],1,'Smooth steering gives you better control.']]},
 {unit:'Meet Your Car',title:'Mirrors & Blind Spots',teacher:'lily',info:['The <strong>rearview mirror</strong> shows traffic behind your vehicle. Side mirrors show areas to either side and behind.','<strong>Blind spots</strong> are areas that your mirrors may not show. Check over your shoulder when appropriate before changing lanes.','Adjust your mirrors before moving, not while distracted in traffic.'],q:[['Can mirrors show every area around your car?',['Yes','No'],1,'Mirrors leave blind spots.'],['When should you adjust mirrors?',['Before driving','In the middle of a turn'],0,'Set mirrors before you move.']]},
 {unit:'Meet Your Car',title:'Automatic Gears',teacher:'boba',info:['Most automatic gear selectors include <strong>P</strong> (Park), <strong>R</strong> (Reverse), <strong>N</strong> (Neutral), and <strong>D</strong> (Drive).','<strong>Park</strong> helps hold the vehicle while parked; <strong>Reverse</strong> moves backward; <strong>Drive</strong> is for normal forward travel.','Keep the brake pressed while selecting a gear, following the vehicle owner’s manual.'],q:[['Which letter means Reverse?',['P','R','D'],1,'R stands for Reverse.'],['Which letter is used for normal forward driving?',['N','D','P'],1,'D stands for Drive.']]},
 {unit:'Meet Your Car',title:'Dashboard Basics',teacher:'coolant',info:['The <strong>speedometer</strong> shows how fast the vehicle is traveling.','The <strong>fuel gauge</strong> shows how much fuel is in the tank. Electric vehicles have battery-charge displays.','Warning lights may indicate problems. Learn their meanings from your vehicle owner’s manual; never ignore a critical warning.'],q:[['What does a speedometer show?',['Speed','Fuel level','Engine temperature only'],0,'The speedometer displays vehicle speed.'],['Where can you find the meaning of a dashboard warning?',['Vehicle owner’s manual','Guessing from its color'],0,'Consult the owner’s manual.']]},
 {unit:'Meet Your Car',title:'Lights, Signals & Wipers',teacher:'sprinkles',info:['<strong>Turn signals</strong> communicate your intention to turn or change lanes. They do not give you the right-of-way.','<strong>Headlights</strong> help you see and be seen; use them as required by your state’s laws and conditions.','<strong>Windshield wipers</strong> clear rain and moisture from the windshield.'],q:[['Does signaling automatically give you the right-of-way?',['Yes','No'],1,'You still must check that the maneuver is safe.'],['What clears rain from the windshield?',['Wipers','Horn','Parking brake'],0,'Windshield wipers help maintain visibility.']]},
 {unit:'Meet Your Car',title:'Seats & Seat Belts',teacher:'maple',info:['Adjust the seat so you can comfortably reach the pedals and steering wheel while maintaining control.','Wear your <strong>seat belt</strong> correctly before moving. All occupants should be properly restrained.','Adjust head restraints and mirrors before driving.'],q:[['When should you fasten your seat belt?',['Before driving','Only on highways'],0,'Buckle up before moving.'],['What should you check before starting?',['Seat position','Phone notifications'],0,'Set up a safe driving position.']]},
 {unit:'Meet Your Car',title:'Parking Brake',teacher:'brisket',info:['The <strong>parking brake</strong> helps prevent a parked vehicle from rolling.','Use the parking brake as directed by your vehicle’s manual, especially when parking.','Check that it is released before driving, unless the vehicle releases it automatically.'],q:[['What is the parking brake for?',['Keeping a parked car from rolling','Making turns faster'],0,'It helps secure a parked vehicle.']]},
 {unit:'Meet Your Car',title:'Starting & Shutting Off',teacher:'mocha',info:['Before starting, check your surroundings, adjust your seat and mirrors, buckle up, and press the brake as required.','For many automatic cars, start the engine with the gear selector in <strong>Park</strong> and your foot on the brake.','When parking, come to a full stop, secure the vehicle with Park and the parking brake as directed, and switch it off. Vehicle procedures vary.'],q:[['Before moving, what should you do?',['Buckle up and check surroundings','Accelerate immediately'],0,'Prepare yourself and check the area around the car.'],['Do all vehicles have identical starting procedures?',['Yes','No'],1,'Follow the owner’s manual for your vehicle.']]},
 {unit:'Meet Your Car',title:'Unit 1 Checkpoint',teacher:'trouble',info:['You’ve met the major controls of an automatic car! Let’s check your understanding.','This is a learning checkpoint, not a state DMV exam.'],q:[['Which pedal slows or stops the car?',['Accelerator','Brake','Wiper'],1,'The brake is NO NO.'],['What does D mean on an automatic gear selector?',['Drive','Downhill','Door'],0,'D means Drive.'],['Should you check blind spots before changing lanes?',['Yes','No'],0,'Check mirrors and blind spots before moving over.'],['What is the speedometer for?',['Showing speed','Showing fuel'],0,'It shows your speed.'],['When do you fasten your seat belt?',['Before driving','After arriving'],0,'Buckle up before moving.']]}
];

LESSONS.push(...[{"unit":"Before You Drive","title":"Your Pre-Drive Check","teacher":"oreo","info":["Walk around the vehicle before getting in. Look for people, animals, obstacles, leaks, and tire damage.","Remember: A walk-around helps you notice hazards. Check that the entire path is clear before starting or reversing.","Real-world practice: You spot a child near the rear of your parked car. What should you do? Think through the safest response before continuing."],"q":[["What should you do before entering a parked car?",["Check around it for hazards","Start moving immediately"],0,"A walk-around helps you notice hazards."],["You spot a child near the rear of your parked car. What should you do?",["Wait and confirm the area is clear before moving","Assume the child will move"],0,"Check that the entire path is clear before starting or reversing."]]},{"unit":"Before You Drive","title":"Find Your Driving Position","teacher":"coco","info":["Adjust your seat so you can reach the pedals fully without stretching. Set your mirrors, head restraint, and steering position before moving.","Remember: Adjust your position while parked. You must be able to press the brake fully and comfortably.","Real-world practice: Your knees are fully stretched to reach the brake. What should you do? Think through the safest response before continuing."],"q":[["When should you adjust your seat?",["Before moving","While turning"],0,"Adjust your position while parked."],["Your knees are fully stretched to reach the brake. What should you do?",["Adjust your seat while parked","Drive anyway"],0,"You must be able to press the brake fully and comfortably."]]},{"unit":"Before You Drive","title":"Buckle Up Correctly","teacher":"moose","info":["Wear the lap belt low across your hips and the shoulder belt across your chest, not behind your back. Make sure passengers are properly restrained.","Remember: The shoulder belt belongs across your chest. A correctly positioned belt protects you better in a crash.","Real-world practice: Your shoulder belt rubs your neck. What is the safest next step? Think through the safest response before continuing."],"q":[["Where should the shoulder belt go?",["Across your chest","Behind your back"],0,"The shoulder belt belongs across your chest."],["Your shoulder belt rubs your neck. What is the safest next step?",["Adjust your seating and belt fit before driving","Put the shoulder belt behind your back"],0,"A correctly positioned belt protects you better in a crash."]]},{"unit":"Before You Drive","title":"Look Before Moving","teacher":"crash","info":["Check mirrors, blind spots, pedestrians, and cross traffic before pulling away. Signal when appropriate and yield when required.","Remember: Always check the area before moving. Mirrors do not eliminate blind spots.","Real-world practice: A side mirror looks clear before you pull away. Is that enough? Think through the safest response before continuing."],"q":[["What comes before pulling away?",["Check surroundings and blind spots","Assume the road is empty"],0,"Always check the area before moving."],["A side mirror looks clear before you pull away. Is that enough?",["No, check blind spots and surroundings too","Yes, mirrors show everything"],0,"Mirrors do not eliminate blind spots."]]},{"unit":"Before You Drive","title":"Pre-Drive Checkpoint","teacher":"maple","info":["A safe drive begins before the engine starts: vehicle check, seat and mirrors, seat belt, and a clear path.","Remember: Prepare fully before moving. Preparation must happen while stationary.","Real-world practice: When should you adjust mirrors and fasten your belt? Think through the safest response before continuing."],"q":[["What is the safest sequence?",["Check, adjust, buckle, observe","Accelerate, then adjust"],0,"Prepare fully before moving."],["When should you adjust mirrors and fasten your belt?",["Before the vehicle moves","After entering traffic"],0,"Preparation must happen while stationary."]]},{"unit":"Controlling the Car","title":"Smooth Starts","teacher":"boba","info":["In an automatic car, keep your right foot on the brake when selecting Drive. Release the brake gently and accelerate smoothly when safe.","Remember: Smooth acceleration improves control. Automatic cars can creep at idle; stay in control.","Real-world practice: The car begins to creep when you release the brake in Drive. What should you do? Think through the safest response before continuing."],"q":[["How should you accelerate?",["Smoothly and gradually","Suddenly and hard"],0,"Smooth acceleration improves control."],["The car begins to creep when you release the brake in Drive. What should you do?",["Control speed with the brake and move only when clear","Press the accelerator hard"],0,"Automatic cars can creep at idle; stay in control."]]},{"unit":"Controlling the Car","title":"Smooth Stops","teacher":"lily","info":["Look ahead and brake early and progressively. Allow enough space so you do not need sudden hard braking in ordinary situations.","Remember: Early observation gives you stopping room. Looking ahead gives you time to slow smoothly.","Real-world practice: You see brake lights several cars ahead. What is best? Think through the safest response before continuing."],"q":[["What helps you stop smoothly?",["Look ahead and brake early","Wait until the last moment"],0,"Early observation gives you stopping room."],["You see brake lights several cars ahead. What is best?",["Ease off the accelerator and prepare to brake early","Wait until the last moment"],0,"Looking ahead gives you time to slow smoothly."]]},{"unit":"Controlling the Car","title":"Steering Through Turns","teacher":"sprinkles","info":["Slow to a safe speed before a turn. Look through the turn, steer smoothly, and avoid accelerating sharply.","Remember: Set a safe speed before the turn. Choose a safe entry speed before steering into the curve.","Real-world practice: You are approaching a sharp turn. When should you slow? Think through the safest response before continuing."],"q":[["When should you reduce speed for a turn?",["Before entering the turn","Only after turning"],0,"Set a safe speed before the turn."],["You are approaching a sharp turn. When should you slow?",["Before the turn","Halfway through the turn"],0,"Choose a safe entry speed before steering into the curve."]]},{"unit":"Controlling the Car","title":"Backing Up Safely","teacher":"coolant","info":["Before reversing, check all around your vehicle. Move slowly, look in the direction of travel, and use mirrors and cameras only as aids.","Remember: Cameras can miss people and objects. Cameras have blind spots and can miss hazards.","Real-world practice: Your backup camera shows no obstacle. What else must you do? Think through the safest response before continuing."],"q":[["Are backup cameras a replacement for looking?",["No","Yes"],0,"Cameras can miss people and objects."],["Your backup camera shows no obstacle. What else must you do?",["Look around and check the actual path","Reverse quickly without checking"],0,"Cameras have blind spots and can miss hazards."]]},{"unit":"Controlling the Car","title":"Control Checkpoint","teacher":"mudpie","info":["Good control combines scanning, smooth steering, gradual acceleration, and safe braking.","Remember: Controlled movements and observation work together. Planning and smooth control reduce loss-of-control risk.","Real-world practice: Which action helps maintain control on a curve? Think through the safest response before continuing."],"q":[["What is a good habit?",["Smooth inputs and active scanning","Abrupt moves without looking"],0,"Controlled movements and observation work together."],["Which action helps maintain control on a curve?",["Reduce speed before entering and steer smoothly","Brake harshly while turning"],0,"Planning and smooth control reduce loss-of-control risk."]]},{"unit":"Road Signs","title":"Sign Shapes","teacher":"stormy","info":["An octagon identifies STOP. An inverted triangle means YIELD. Shapes help you recognize signs even before reading them.","Remember: STOP signs are octagonal. The inverted triangle identifies a yield sign.","Real-world practice: You see a red-and-white upside-down triangle. What does it mean? Think through the safest response before continuing."],"q":[["Which shape is a STOP sign?",["Octagon","Circle"],0,"STOP signs are octagonal."],["You see a red-and-white upside-down triangle. What does it mean?",["Yield","Stop sign"],0,"The inverted triangle identifies a yield sign."]]},{"unit":"Road Signs","title":"Sign Colors","teacher":"mocha","info":["Red commonly marks stop or prohibition; yellow warns of hazards; orange warns of work zones; green guides routes and destinations.","Remember: Orange is commonly used for temporary traffic control. Orange commonly warns of work zones.","Real-world practice: An orange diamond sign appears ahead. What should you expect? Think through the safest response before continuing."],"q":[["What do orange road signs often indicate?",["Work zones","Hospital parking"],0,"Orange is commonly used for temporary traffic control."],["An orange diamond sign appears ahead. What should you expect?",["Roadwork or temporary traffic changes","A tourist attraction"],0,"Orange commonly warns of work zones."]]},{"unit":"Road Signs","title":"Regulatory Signs","teacher":"brisket","info":["Regulatory signs communicate rules such as speed limits, turn restrictions, and one-way travel. Follow posted instructions.","Remember: Regulatory signs tell you required or prohibited actions. Regulatory signs state requirements and prohibitions.","Real-world practice: A sign says NO LEFT TURN. What should you do? Think through the safest response before continuing."],"q":[["What does a regulatory sign communicate?",["A rule drivers must follow","A restaurant recommendation"],0,"Regulatory signs tell you required or prohibited actions."],["A sign says NO LEFT TURN. What should you do?",["Choose a legal alternative route","Turn left if no one is watching"],0,"Regulatory signs state requirements and prohibitions."]]},{"unit":"Road Signs","title":"Warning Signs","teacher":"trouble","info":["Warning signs alert you to curves, crossings, slippery surfaces, and other conditions that may require adjusting speed or position.","Remember: Warning signs help you prepare for hazards. Warnings give advance notice of changing road conditions.","Real-world practice: A yellow curve warning sign appears. What should you do? Think through the safest response before continuing."],"q":[["What should you do when you see a curve warning?",["Prepare to slow as needed","Ignore it"],0,"Warning signs help you prepare for hazards."],["A yellow curve warning sign appears. What should you do?",["Assess the curve and adjust speed as needed","Ignore it until inside the curve"],0,"Warnings give advance notice of changing road conditions."]]},{"unit":"Road Signs","title":"Sign Checkpoint","teacher":"oreo","info":["Read both a sign’s shape and its message. Look for regulatory, warning, guide, and temporary work-zone signs.","Remember: The inverted triangle is the yield sign. Speed limits are regulatory; slippery-road signs warn of hazards.","Real-world practice: Which sign gives a legal instruction rather than a warning? Think through the safest response before continuing."],"q":[["What does an inverted triangle indicate?",["Yield","Stop"],0,"The inverted triangle is the yield sign."],["Which sign gives a legal instruction rather than a warning?",["Speed Limit 35","Slippery When Wet"],0,"Speed limits are regulatory; slippery-road signs warn of hazards."]]},{"unit":"Traffic Rules","title":"Traffic Lights","teacher":"coco","info":["A steady red signal means stop and remain stopped unless a movement is legally permitted after meeting applicable conditions. Green does not cancel your duty to yield.","Remember: You must still yield when required. A steady yellow warns the signal will turn red.","Real-world practice: You approach a steady yellow and can stop safely. What should you do? Think through the safest response before continuing."],"q":[["Does green mean you can ignore pedestrians?",["No","Yes"],0,"You must still yield when required."],["You approach a steady yellow and can stop safely. What should you do?",["Prepare to stop","Accelerate to beat the red"],0,"A steady yellow warns the signal will turn red."]]},{"unit":"Traffic Rules","title":"Lane Markings","teacher":"moose","info":["Lane lines guide traffic. A solid line generally discourages or restricts crossing; specific legal meanings vary by marking and location.","Remember: Markings organize and regulate traffic. Solid yellow lines restrict passing on that side.","Real-world practice: A solid yellow line is on your side of a two-way road. What is safest? Think through the safest response before continuing."],"q":[["What should you do with road markings?",["Read and follow them","Ignore them if traffic is light"],0,"Markings organize and regulate traffic."],["A solid yellow line is on your side of a two-way road. What is safest?",["Do not cross it to pass","Pass whenever you like"],0,"Solid yellow lines restrict passing on that side."]]},{"unit":"Traffic Rules","title":"Speed and Conditions","teacher":"crash","info":["Obey posted speed limits and slow further when visibility, traction, or traffic makes the posted speed unsafe.","Remember: A speed limit is not a promise of safe speed in every condition. A speed limit is not a target in hazardous conditions.","Real-world practice: The posted limit is 45 mph but visibility is poor. What should you do? Think through the safest response before continuing."],"q":[["Should you always drive at the posted limit?",["No, conditions may require slower travel","Yes, regardless of weather"],0,"A speed limit is not a promise of safe speed in every condition."],["The posted limit is 45 mph but visibility is poor. What should you do?",["Drive slower if needed for safety","Always drive exactly 45 mph"],0,"A speed limit is not a target in hazardous conditions."]]},{"unit":"Traffic Rules","title":"Intersections","teacher":"maple","info":["Approach intersections scanning for signs, signals, pedestrians, cyclists, and turning vehicles. Never assume another driver will yield.","Remember: Intersections demand broad observation. Green means proceed only when the way is clear.","Real-world practice: The light is green but a pedestrian is crossing in front of you. What should you do? Think through the safest response before continuing."],"q":[["What should you do approaching an intersection?",["Scan and prepare to yield","Only watch the car ahead"],0,"Intersections demand broad observation."],["The light is green but a pedestrian is crossing in front of you. What should you do?",["Yield and wait until safe","Proceed because green always gives priority"],0,"Green means proceed only when the way is clear."]]},{"unit":"Traffic Rules","title":"Traffic Rules Checkpoint","teacher":"boba","info":["Safe rule-following means observing signals, markings, speed restrictions, and surrounding traffic together.","Remember: A green light does not remove your duty to drive safely. Stop signs require a full stop.","Real-world practice: You reach a stop sign with no cars visible. What is required? Think through the safest response before continuing."],"q":[["What matters even with a green light?",["Checking for hazards and yielding as required","Accelerating without looking"],0,"A green light does not remove your duty to drive safely."],["You reach a stop sign with no cars visible. What is required?",["Come to a complete stop","Roll through slowly"],0,"Stop signs require a full stop."]]},{"unit":"Right-of-Way","title":"Yielding Basics","teacher":"lily","info":["Right-of-way rules tell drivers who must yield. Never force your way through; take action to avoid a collision even if another road user makes a mistake.","Remember: Preventing a crash is more important than proving priority. Yielding means allowing other road users priority.","Real-world practice: A yield sign appears and traffic is approaching. What should you do? Think through the safest response before continuing."],"q":[["If someone fails to yield, should you force your turn?",["No","Yes"],0,"Preventing a crash is more important than proving priority."],["A yield sign appears and traffic is approaching. What should you do?",["Slow and wait for a safe gap","Force the other driver to brake"],0,"Yielding means allowing other road users priority."]]},{"unit":"Right-of-Way","title":"Four-Way Stops","teacher":"sprinkles","info":["At an all-way stop, stop fully and watch arrival order. When arrivals are simultaneous, apply your state’s right-of-way rules.","Remember: A stop sign requires stopping. At an all-way stop, the driver on the left yields to the right.","Real-world practice: Two vehicles arrive at the same time from different roads. Who generally goes first? Think through the safest response before continuing."],"q":[["What is required at a STOP sign?",["A complete stop","Only slowing down"],0,"A stop sign requires stopping."],["Two vehicles arrive at the same time from different roads. Who generally goes first?",["The vehicle on the right","The vehicle on the left"],0,"At an all-way stop, the driver on the left yields to the right."]]},{"unit":"Right-of-Way","title":"Pedestrians and Crosswalks","teacher":"coolant","info":["Look carefully for people crossing, including at turns and driveways. Yield to pedestrians as required and never pass a vehicle stopped for a crosswalk.","Remember: Protect people crossing the roadway. Drivers must protect pedestrians using crosswalks.","Real-world practice: A person is in a marked crosswalk ahead. What should you do? Think through the safest response before continuing."],"q":[["What should you do at an occupied crosswalk?",["Yield as required","Speed up"],0,"Protect people crossing the roadway."],["A person is in a marked crosswalk ahead. What should you do?",["Yield and be ready to stop","Honk and keep moving"],0,"Drivers must protect pedestrians using crosswalks."]]},{"unit":"Right-of-Way","title":"Turning Left","teacher":"mudpie","info":["Left turns require careful judgment of gaps, signals, oncoming traffic, and people crossing. Never assume an approaching vehicle will stop.","Remember: Look for conflicts across your intended path. A turn signal does not grant right-of-way.","Real-world practice: You are turning left across oncoming traffic. What must you do? Think through the safest response before continuing."],"q":[["What should you check before a left turn?",["Oncoming traffic and crosswalks","Only your rearview mirror"],0,"Look for conflicts across your intended path."],["You are turning left across oncoming traffic. What must you do?",["Yield until there is a safe gap","Turn because your signal is on"],0,"A turn signal does not grant right-of-way."]]},{"unit":"Right-of-Way","title":"Right-of-Way Checkpoint","teacher":"stormy","info":["At intersections and crossings, scan, communicate, yield when required, and avoid forcing a maneuver.","Remember: Waiting for a safe opportunity is better than guessing. Safety matters more than claiming the right-of-way.","Real-world practice: You have priority but another driver enters your path. What should you do? Think through the safest response before continuing."],"q":[["What is the safest response to uncertainty?",["Wait and reassess","Rush through"],0,"Waiting for a safe opportunity is better than guessing."],["You have priority but another driver enters your path. What should you do?",["Avoid a collision by slowing or stopping","Insist on your priority"],0,"Safety matters more than claiming the right-of-way."]]},{"unit":"Safe Driving","title":"Space Cushion","teacher":"mocha","info":["Keep a generous following distance. Increase the gap for higher speeds, rain, snow, darkness, and poor visibility.","Remember: Reduced traction requires more stopping space. Space gives you time to see and respond.","Real-world practice: The car ahead suddenly brakes. What reduces collision risk? Think through the safest response before continuing."],"q":[["What should happen to following distance in rain?",["Increase it","Decrease it"],0,"Reduced traction requires more stopping space."],["The car ahead suddenly brakes. What reduces collision risk?",["A generous following gap","Driving close to react faster"],0,"Space gives you time to see and respond."]]},{"unit":"Safe Driving","title":"Scanning Ahead","teacher":"brisket","info":["Look well ahead while checking mirrors and side areas regularly. Search for hazards early instead of staring at the bumper in front.","Remember: Scanning helps you anticipate problems. Scanning includes predicting hazards, not just noticing them.","Real-world practice: You see a ball roll into the street. What should you anticipate? Think through the safest response before continuing."],"q":[["Where should your attention go?",["Ahead and around the vehicle","Only straight at the hood"],0,"Scanning helps you anticipate problems."],["You see a ball roll into the street. What should you anticipate?",["A child may follow it","The road must be clear"],0,"Scanning includes predicting hazards, not just noticing them."]]},{"unit":"Safe Driving","title":"Distractions","teacher":"trouble","info":["Keep your attention on driving. Set navigation before leaving and avoid handling your phone or other distracting tasks.","Remember: Prepare navigation while parked. Phone use diverts attention from driving.","Real-world practice: Your phone rings while driving. What is safest? Think through the safest response before continuing."],"q":[["When should you set your route?",["Before driving","While entering an intersection"],0,"Prepare navigation while parked."],["Your phone rings while driving. What is safest?",["Ignore it until safely parked","Read it quickly at a red light"],0,"Phone use diverts attention from driving."]]},{"unit":"Safe Driving","title":"Fatigue and Impairment","teacher":"oreo","info":["Never drive when impaired by alcohol, drugs, medication effects, or severe fatigue. Arrange a safe alternative instead.","Remember: Fatigue reduces alertness and reaction time. Drowsiness can seriously impair reaction and judgment.","Real-world practice: You are struggling to keep your eyes open. What should you do? Think through the safest response before continuing."],"q":[["What should you do if too sleepy to drive safely?",["Stop and arrange rest or another ride","Keep driving faster"],0,"Fatigue reduces alertness and reaction time."],["You are struggling to keep your eyes open. What should you do?",["Stop in a safe place and rest","Turn up music and continue"],0,"Drowsiness can seriously impair reaction and judgment."]]},{"unit":"Safe Driving","title":"Safe Driving Checkpoint","teacher":"coco","info":["Space, scanning, attention, and good judgment help prevent crashes.","Remember: A space cushion gives you time to react. Defensive driving combines observation, spacing, and attention.","Real-world practice: Which habit best reduces risk? Think through the safest response before continuing."],"q":[["What reduces risk?",["Adequate space and focused attention","Tailgating and multitasking"],0,"A space cushion gives you time to react."],["Which habit best reduces risk?",["Scan ahead, leave space, and stay attentive","Watch only the car immediately ahead"],0,"Defensive driving combines observation, spacing, and attention."]]},{"unit":"Special Situations","title":"School Buses","teacher":"moose","info":["School-bus stopping requirements vary with roadway layout and state law. Learn your state’s exact rules and watch carefully for children.","Remember: State rules can differ by road configuration. Yellow bus lights warn that a stop is coming.","Real-world practice: A school bus ahead activates flashing yellow lights. What should you do? Think through the safest response before continuing."],"q":[["Where should you verify school-bus stop rules?",["Your official state driver manual","A random comment online"],0,"State rules can differ by road configuration."],["A school bus ahead activates flashing yellow lights. What should you do?",["Slow down and prepare to stop","Speed up and pass"],0,"Yellow bus lights warn that a stop is coming."]]},{"unit":"Special Situations","title":"Emergency Vehicles","teacher":"crash","info":["When an emergency vehicle approaches using warning equipment, follow local move-over or yielding laws and find a safe way to give it room.","Remember: Give emergency responders a safe path. Give emergency responders room while avoiding abrupt unsafe moves.","Real-world practice: An emergency vehicle with lights and siren approaches. What should you do? Think through the safest response before continuing."],"q":[["What should you do around an approaching emergency vehicle?",["Yield safely according to law","Race ahead of it"],0,"Give emergency responders a safe path."],["An emergency vehicle with lights and siren approaches. What should you do?",["Yield safely as required by local law","Race ahead of it"],0,"Give emergency responders room while avoiding abrupt unsafe moves."]]},{"unit":"Special Situations","title":"Rain and Hydroplaning","teacher":"maple","info":["Wet pavement reduces traction. Slow down, increase following distance, avoid abrupt steering, and ensure tires and wipers are in good condition.","Remember: Smooth inputs and extra room reduce risk. Smooth actions help you regain traction.","Real-world practice: Your tires begin to lose grip on standing water. What should you do? Think through the safest response before continuing."],"q":[["What helps in heavy rain?",["Slower speed and more space","Hard sudden steering"],0,"Smooth inputs and extra room reduce risk."],["Your tires begin to lose grip on standing water. What should you do?",["Ease off the accelerator and steer gently","Brake sharply and jerk the wheel"],0,"Smooth actions help you regain traction."]]},{"unit":"Special Situations","title":"Night Driving","teacher":"boba","info":["Drive at a speed that allows you to stop within the distance you can see. Keep headlights clean and avoid staring into oncoming glare.","Remember: Reduced visibility can require lower speeds. Avoid staring into glare while maintaining lane position.","Real-world practice: An oncoming vehicle has bright headlights. Where should you focus? Think through the safest response before continuing."],"q":[["What should you adjust at night?",["Speed to match visibility","Only the radio volume"],0,"Reduced visibility can require lower speeds."],["An oncoming vehicle has bright headlights. Where should you focus?",["Toward the right edge of your lane","Directly at its headlights"],0,"Avoid staring into glare while maintaining lane position."]]},{"unit":"Special Situations","title":"Work Zones","teacher":"lily","info":["Orange signs and cones often mark road work. Reduce distractions, follow flaggers and temporary signs, and watch for workers and changing lanes.","Remember: Temporary traffic controls direct safe movement. Work zones require patience and attention to temporary controls.","Real-world practice: Traffic merges into one lane at a construction site. What should you do? Think through the safest response before continuing."],"q":[["Who should you obey in a work zone?",["Authorized flaggers and signs","Only your navigation app"],0,"Temporary traffic controls direct safe movement."],["Traffic merges into one lane at a construction site. What should you do?",["Follow signs, reduce speed, and merge safely","Speed past the queue"],0,"Work zones require patience and attention to temporary controls."]]},{"unit":"Special Situations","title":"Special Situations Checkpoint","teacher":"sprinkles","info":["Unusual conditions require patience, extra space, careful scanning, and attention to state-specific rules.","Remember: Adjust driving to conditions. Poor visibility requires more time and space.","Real-world practice: You cannot see clearly in heavy rain. What is safest? Think through the safest response before continuing."],"q":[["What is a good response to poor visibility?",["Slow down and increase space","Maintain speed no matter what"],0,"Adjust driving to conditions."],["You cannot see clearly in heavy rain. What is safest?",["Reduce speed and increase following distance","Use cruise control to maintain speed"],0,"Poor visibility requires more time and space."]]},{"unit":"Your State Driving Laws","title":"Find Your Official Manual","teacher":"coolant","info":["Each state publishes an official driver handbook or manual. Use the current edition from your state licensing agency for legal requirements.","Remember: The official manual is the primary study source. Official state guidance is the best source for current requirements.","Real-world practice: A social media post contradicts your DMV manual. Which source should you check? Think through the safest response before continuing."],"q":[["Which source is best for state driving laws?",["Official state driver manual","An outdated social post"],0,"The official manual is the primary study source."],["A social media post contradicts your DMV manual. Which source should you check?",["The current official licensing agency guidance","The post with the most likes"],0,"Official state guidance is the best source for current requirements."]]},{"unit":"Your State Driving Laws","title":"Permits and License Stages","teacher":"mudpie","info":["Permit ages, supervision rules, testing requirements, and graduated licensing restrictions differ by state and age. Check the official rules that apply to you.","Remember: Licensing rules vary by state and sometimes by age. Age, restrictions, and testing requirements vary by state.","Real-world practice: Your friend in another state has different permit rules. What should you do? Think through the safest response before continuing."],"q":[["Are permit rules identical in all 50 states?",["No","Yes"],0,"Licensing rules vary by state and sometimes by age."],["Your friend in another state has different permit rules. What should you do?",["Check your own state's requirements","Assume the same rules apply everywhere"],0,"Age, restrictions, and testing requirements vary by state."]]},{"unit":"Your State Driving Laws","title":"State-Specific Situations","teacher":"stormy","info":["Rules about school buses, turns on red, hands-free devices, and required lights can differ. Never assume another state’s rule applies.","Remember: Use your state’s current official guidance. State laws and licensing rules can differ.","Real-world practice: You move to another state. Can you assume all rules stay identical? Think through the safest response before continuing."],"q":[["How should you check a rule that varies by state?",["Consult your state manual","Guess based on another state"],0,"Use your state’s current official guidance."],["You move to another state. Can you assume all rules stay identical?",["No, check the new state's official guidance","Yes, every state has identical rules"],0,"State laws and licensing rules can differ."]]},{"unit":"Your State Driving Laws","title":"State Law Study Checkpoint","teacher":"mocha","info":["This unit teaches how to verify rules; it is not a substitute for a verified state-specific question bank.","Remember: Use the official state manual for legal specifics. Rules can change; verify before depending on them.","Real-world practice: You are unsure whether a driving rule changed. What should you do? Think through the safest response before continuing."],"q":[["Is this a verified DMV exam?",["No","Yes"],0,"Use the official state manual for legal specifics."],["You are unsure whether a driving rule changed. What should you do?",["Consult an up-to-date official source","Rely on an old screenshot"],0,"Rules can change; verify before depending on them."]]},{"unit":"Permit Exam Academy","title":"How to Study","teacher":"brisket","info":["Read your state manual section by section. Use practice questions to locate gaps, then return to the relevant official chapter.","Remember: Understand the rule behind the answer. Understanding the reason helps with unfamiliar questions.","Real-world practice: You keep missing right-of-way questions. What helps most? Think through the safest response before continuing."],"q":[["What should you do after missing a practice question?",["Review the related manual section","Memorize the answer without understanding"],0,"Understand the rule behind the answer."],["You keep missing right-of-way questions. What helps most?",["Review explanations and practice new examples","Memorize only answer positions"],0,"Understanding the reason helps with unfamiliar questions."]]},{"unit":"Permit Exam Academy","title":"Signs and Signals Review","teacher":"trouble","info":["Practice identifying sign shapes, colors, regulatory instructions, and traffic signal meanings before the real test.","Remember: The red octagon is STOP. A flashing red signal is treated like a stop sign.","Real-world practice: What does a flashing red traffic light generally require? Think through the safest response before continuing."],"q":[["What does a red octagonal sign mean?",["Stop","Yield"],0,"The red octagon is STOP."],["What does a flashing red traffic light generally require?",["Stop, then proceed when safe and lawful","Continue without slowing"],0,"A flashing red signal is treated like a stop sign."]]},{"unit":"Permit Exam Academy","title":"Hazard Decisions","teacher":"oreo","info":["Permit questions often test how you respond to road users and changing conditions. Choose actions that are lawful, predictable, and safe.","Remember: Extra space gives more reaction time. Anticipate doors, people, and sudden obstacles.","Real-world practice: A parked car's door begins to open into your lane. What should you do? Think through the safest response before continuing."],"q":[["What is a safe response to reduced traction?",["Slow and leave extra space","Follow closer"],0,"Extra space gives more reaction time."],["A parked car's door begins to open into your lane. What should you do?",["Slow and give safe clearance","Maintain speed and squeeze past"],0,"Anticipate doors, people, and sudden obstacles."]]},{"unit":"Permit Exam Academy","title":"Exam Practice Strategy","teacher":"coco","info":["Read every answer choice. Watch for words such as always and never. Follow your state’s official rules rather than guessing.","Remember: Careful reading prevents avoidable errors. Test questions may include plausible but unsafe choices.","Real-world practice: Why should you read every answer choice? Think through the safest response before continuing."],"q":[["What is a good test habit?",["Read the whole question carefully","Tap the first answer quickly"],0,"Careful reading prevents avoidable errors."],["Why should you read every answer choice?",["To choose the safest legally correct option","To find the longest answer"],0,"Test questions may include plausible but unsafe choices."]]},{"unit":"Permit Exam Academy","title":"Practice Knowledge Check","teacher":"moose","info":["This checkpoint reviews general knowledge only. It is not a scored or verified state DMV exam.","Remember: Only the licensing authority administers the official exam. Targeted review improves understanding.","Real-world practice: A practice test shows several missed topics. What next? Think through the safest response before continuing."],"q":[["Does this checkpoint replace the official permit exam?",["No","Yes"],0,"Only the licensing authority administers the official exam."],["A practice test shows several missed topics. What next?",["Review those topics before retesting","Ignore mistakes and only retake easy questions"],0,"Targeted review improves understanding."]]},{"unit":"Behind the Wheel","title":"Practice With Supervision","teacher":"crash","info":["Practice only when legally permitted, with the required licensed supervisor or instructor, in a suitable location and vehicle.","Remember: Follow your state’s supervised-driving requirements. Behind-the-wheel practice must follow licensing laws.","Real-world practice: You have no valid permit or qualified supervisor. Should you practice on public roads? Think through the safest response before continuing."],"q":[["What comes first for real-world practice?",["Legal permission and proper supervision","Driving alone without a permit"],0,"Follow your state’s supervised-driving requirements."],["You have no valid permit or qualified supervisor. Should you practice on public roads?",["No, meet legal requirements first","Yes, if the street looks empty"],0,"Behind-the-wheel practice must follow licensing laws."]]},{"unit":"Behind the Wheel","title":"Moving and Stopping","teacher":"maple","info":["In a controlled practice area, work on gentle starts, smooth stops, and staying centered, under supervision.","Remember: Begin in a suitable low-risk setting. Look and yield before entering the roadway.","Real-world practice: Before moving away from the curb, what must you check? Think through the safest response before continuing."],"q":[["Where should a beginner first practice?",["A safe, legal area with supervision","A crowded high-speed road"],0,"Begin in a suitable low-risk setting."],["Before moving away from the curb, what must you check?",["Traffic, people, mirrors, and blind spots","Only the speedometer"],0,"Look and yield before entering the roadway."]]},{"unit":"Behind the Wheel","title":"Turns and Lane Position","teacher":"boba","info":["Learn to signal, scan, choose a safe speed, steer smoothly, and end in the correct lane as required.","Remember: Prepare early for turns. Plan and communicate before changing direction.","Real-world practice: What should you do before a turn? Think through the safest response before continuing."],"q":[["What should happen before a turn?",[" riving skill requires supervised practice; app lessons can teach decisions but cannot certify physical vehicle control.","Remember: Behind-the-wheel skill needs real, legal practice. Knowledge and physical driving skill are different.","Real-world practice: A driving app says you passed its quizzes. Does that prove you can safely drive? Think through the safest response before continuing."],"q":[["Can completing an app replace supervised driving?",["No","Yes"],0,"Behind-the-wheel skill needs real, legal practice."],["A driving app says you passed its quizzes. Does that prove you can safely drive?",["No, real supervised practice is still necessary","Yes, quizzes replace driving practice"],0,"Knowledge and physical driving skill are different."]]},{"unit":"Road Test Academy","title":"Know Your Test","teacher":"mudpie","info":["Road-test requirements and scoring differ by state. Review your licensing agency’s current checklist, appointment rules, and test maneuvers.","Remember: Requirements depend on your jurisdiction. Test formats differ by jurisdiction.","Real-world practice: Where can you confirm which maneuvers your road test includes? Think through the safest response before continuing."],"q":[["Where should you check road-test requirements?",["Official state licensing agency","An unrelated state’s website"],0,"Requirements depend on your jurisdiction."],["Where can you confirm which maneuvers your road test includes?",["Your state licensing agency","A random influencer's video"],0,"Test formats differ by jurisdiction."]]},{"unit":"Road Test Academy","title":"Vehicle Readiness","teacher":"stormy","info":["Before test day, verify required documents, vehicle registration and insurance where applicable, safe equipment, and the testing agency’s vehicle rules.","Remember: Preparation prevents avoidable test-day problems. Testing vehicles must meet the agency's safety requirements.","Real-world practice: A brake light is broken before your road test. What should you do? ositions only","Skip every explanation"],0,"Active recall and reviewing mistakes build understanding."],"Signs and Signals Review":["A red octagon is visible ahead. What should you prepare to do?",["Stop at the required location","Speed up","Change lanes without checking"],0,"An octagonal red sign means STOP."],"Hazard Decisions":["A parked vehicle’s door starts opening near your lane. What should you do?",["Slow and allow safe clearance","Accelerate past without checking","Move suddenly into another lane"],0,"Anticipate opening doors and protect cyclists and other road users."],"Exam Practice Strategy":["A question seems unfamiliar during practice. What should you do?",["Read carefully and reason from the rule","Pick the longest answer automatically","Ignore the question"],0,"Understanding the rule is more reliable than guessing patterns."],"Practice With Supervision":["You are practicing with a permit. Who may supervise?",["A person who meets your state’s requirements","Anyone with a phone","No one is needed"],0,"Verify age, licensing, and seating requirements with your DMV."],"Moving and Stopping":["Before releasing the brake to move, what matters?",["The route is clear and the vehicle is in the intended gear","The radio is loud","You are looking at the phone"],0,"Check surroundings and gear selection before moving."],"Turns and Lane Position":["What should you do before a right turn?",["Signal, check for people and traffic, and slow appropriately","Turn without looking","Drive onto the sidewalk"],0,"Plan the turn, yield as required, and remain in a proper lane."],"Lane Changes":["A car is in your blind spot. Should you change lanes?",["No, wait for a safe gap","Yes, the signal gives priority","Yes, if you move quickly"],0,"Do not move into an occupied blind spot."],"Parking Basics":["You park on a slope. What should you check?",["State-specific wheel-position rules and parking brake","Only your music volume","Whether the horn works"],0,"Secure the vehicle and fo let driverzDialogReturnFocus=null;
function driverzPopup(message,{title='Driverz',kind='info',confirmText='GOT IT'}={}){
 const existing=document.getElementById('driverzDialogLayer');if(existing)existing.remove();
 driverzDialogReturnFocus=document.activeElement;
 const layer=document.createElement('div');layer.id='driverzDialogLayer';layer.className='driverz-dialog-layer';
 const icons={info:'i',success:'✓',warn:'!',error:'!'};
 layer.innerHTML=`<section class="driverz-dialog" role="alertdialog" aria-modal="true" aria-labelledby="driverzDialogTitle" aria-describedby="driverzDialogMessage"><div class="driverz-dialog-icon ${kind==='warn'||kind==='error'?kind:''}" aria-hidden="true">${icons[kind]||'i'}</div><h2 id="driverzDialogTitle">${esc(title)}</h2><p id="driverzDialogMessage">${esc(message)}</p><div class="driverz-dialog-actions"><button type="button" class="btn wide" id="driverzDialogClose">${esc(confirmText)}</button></div></section>`;
 document.body.appendChild(layer);
 const close=()=>{layer.remove();document.removeEventListener('keydown',keyHandler);if(driverzDialogReturnFocus?.isConnected)driverzDialogReturnFocus.focus()};
 const keyHandler=e=>{if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Tab'){e.preventDefault();layer.querySelector('button').focus()}};

}

function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('Progress could not be saved',e)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function play(k){if(!data.sound)return;try{const a=new Audio('./'+SOUND[k]);a.volume=.55;a.play().catch(()=>{})}catch(e){}}function setTheme(){const t=THEMES[data.theme]||THEMES.green;document.documentElement.style.setProperty('--accent',t[0]);document.documentElement.style.setProperty('--pale',t[1]);const dark=data.theme==='dark';document.documentElement.style.setProperty('--bg',dark?'#151d19':'#fff');document.documentElement.style.setProperty('--panel',dark?'#1d2922':'#fff');document.documentElement.style.setProperty('--ink',dark?'#f4f4f4':'#4b4b4b');document.documentElement.style.setProperty('--muted',dark?'#b4c1b7':'#777');document.documentElement.style.setProperty('--line',dark?'#354339':'#e5e5e5');document.querySelector('meta[name="theme-color"]').content=t[0]}
function plain(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent||''}
function refreshVoices(){if(!('speechSynthesis' in window))return;speechVoices=window.speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));const el=document.getElementById('voiceSelect');if(el){const current=data.voiceURI;el.innerHTML='<option value="">Device default</option>'+speechVoices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===current?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}}

function pedalActivity(){return `<div class="card"><h2>Try it: tap the pedal that SLOWS the car</h2><p>In an automatic car, the brake is on the left.</p><div class="pedal-lab"><button class="pedal ${selected===0?'chosen':''}" data-pedal="0"><span class="metal"></span><b>LEFT PEDAL</b></button><button class="pedal gas ${selected===1?'chosen':''}" data-pedal="1"><span class="metal"></span><b>RIGHT PEDAL</b></button></div>${selected>=0?`<div class="feedback ${selected===0?'':'bad'}">${selected===0?'Correct! The left pedal is the brake (NO NO).':'That is the accelerator (GO GO). Try the left pedal!'}</div>`:''}</div>`}
function img(name){return `<img src="./${esc(name)}.png" alt="${esc(name)}" loading="lazy" onerror="this.style.opacity='.15'">`}function bubble(name,text){return `<div class="buddy">${img(name)}<div class="bubble"><b>${esc(name[0].toUpperCase()+name.slice(1))}:</b> ${text}</div></div>`}function button(label,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`}function render(){setTheme();document.body.classList.toggle('in-lesson',screen==='lesson'||screen==='exam');document.getElementById('xpLabel').textContent='⭐ '+data.xp+' XP';document.getElementById('stateLabel').textContent=data.setup?data.state+' Driving School':'Your Driving School';document.getElementById('nav').classList.toggle('hidden',!data.setup||['welcome','onboard','lesson','exam'].includes(screen));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===screen));document.getElementById('settingsBtn').style.display=data.setup?'':'none';const views={welcome,onboard,learn,review,awards,profile,settings,lesson,exam};app.innerHTML=(views[screen]||learn)();if(screen==='settings')refreshVoices()}
function welcome(){return `<section class="hero"><div class="eyebrow" style="color:white">ESSAzLife presents</div><h1>Welcome to Driverz! 🚗</h1><p>Learn to drive, one little lesson at a time.</p></section><div class="card"><h2>Start from the very beginning</h2><p>Meet the controls, practice road safety, and build confidence with your very own ESSA Buddy.</p>${button('LET’S GET STARTED','onboard','wide')}</div><div class="notice">Driverz is an educational study aid, not a replacement for official driver manuals, professional instruction, or supervised driving.</div>`}

function learn(){const sections=UNIT_NAMES.map((name,u)=>{const indices=LESSONS.map((l,i)=>l.unit===name?i:-1).filter(i=>i>=0);const done=indices.filter(i=>data.completed.includes(i)).length;return `<section class="unit-section"><div class="hero"><div class="eyebrow" style="color:white">UNIT ${u+1} · ${done===indices.length?'COMPLETE':'DRIVING SCHOOL'}</div><h1>${esc(name)}</h1><div class="progress" style="background:#ffffff66;margin-top:12px"><div style="width:${done/indices.length*100}%;background:white"></div></div><small>${done} of ${indices.length} lessons completed</small></div><div class="path">${indices.map(i=>{const l=LESSONS[i];return `<div class="path-item"><button class="node ${data.completed.includes(i)?'done':''} ${i>data.unlocked?'locked':''}" data-lesson="${i}" ${i>data.unlocked?'disabled':''} aria-label="${esc(l.title)}">${i>data.unlocked?'🔒':data.completed.includes(i)?'✓':unitLast(i)?'🏆':'★'}</button><div class="path-label">${unitLessonNumber(i)}. ${esc(l.title)}</div></div>`}).join('')}</div></section>`}).join('');return `<div class="quiet-essa">${img(data.buddy)}</div>${sections}<div class="notice">These are general learning lessons, not verified state-specific legal courses or official exam simulations. Consult your current state driver manual and practice legally with supervision.</div>`}

function lesson(){const l=LESSONS[lessonIndex],intro=step<l.info.length,question=l.q[questionIndex];const teacher=l.teacher===data.buddy?CHARACTERS.find(c=>c!==data.buddy):l.teacher;const correct=selected===question?.[2];const total=l.info.length+l.q.length;const active=intro?step:l.info.length+questionIndex;const segments=Array.from({length:total},(_,i)=>`<span class="lesson-segment ${i<active?'passed':i===active?'current':''}" aria-hidden="true"></span>`).join('');return `<section class="lesson-screen"><div class="lesson-header"><button class="lesson-exit" data-action="exitLesson" aria-label="Exit lesson">×</button><div class="lesson-steps" role="progressbar" aria-label="Lesson steps" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${active+1}">${segments}</div></div><div class="lesson-content"><p class="eyebrow">UNIT ${unitNumber(lessonIndex)} · LESSON ${unitLessonNumber(lessonIndex)} · ${intro?'LEARN':'PRACTICE'}</p><h1>${esc(l.title)}</h1><div class="quiet-essa">${img(teacher)}</div>${intro?`<div class="card lesson-info">${l.info[step]}</div>${l.info[step].startsWith('Real-world practice:')?scenarioPanel(l):''}${voiceControls()}`:`<h2 class="question">${esc(question[0])}</h2><div class="tiny-count">Question ${questionIndex+1} of ${l.q.length}</div>${voiceControls()}<button class="btn neutral" data-action="hint" style="padding:7px 10px;font-size:12px;align-self:flex-start">💡 Hint</button><div class="stack">${question[1].map((a,i)=>`<button class="choice ${answered&&i===question[2]?'answer-good':answered&&selected===i&&!correct?'answer-bad':selected===i?'selected':''}" data-answer="${i}" ${answered?'disabled':''}>${esc(a)} ${answered&&i===question[2]?'✓':answered&&selected===i&&!correct?'✕':''}</button>`).join('')}</div>${answered?`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'Amazing! That’s correct!':'Not quite — here’s why.'}</strong><p>${esc(question[3])}</p>${!correct?`<p><b>Correct answer:</b> ${esc(question[1][question[2]])}</p>`:' function awards(){return `<section class="hero"><h1>Your achievements 🏆</h1><p>Celebrate every step forward.</p></section><div class="card"><h2>⭐ ${data.xp} XP</h2><p>🔥 ${data.streak} day study streak</p><p>📗 ${data.completed.length} lessons completed</p></div><div class="card"><h2>Badges</h2>${data.awards.length?data.awards.map(a=>`<p>🏅 ${esc(a)}</p>`).join(''):'<p>Complete your first lesson to earn a badge!</p>'}</div>`}
function profile(){return `<section class="hero"><h1>My Driverz Profile</h1><p>Your driving journey is just getting started.</p></section><div class="card"><div class="quiet-essa">${img(data.buddy)}</div><p><b>State:</b> ${esc(data.state)}</p><p><b>Completed:</b> ${data.completed.length} / ${LESSONS.length} driving school lessons</p><p><b>XP:</b> ${data.xp}</p>${button('SETTINGS','settings','secondary wide')}</div>`}
function settings(){return `<h1>Settings ⚙</h1><div class="card"><h2>State</h2><select id="stateSelect">${STATES.map(s=>`<option ${data.state===s?'selected':''}>${s}</option>`).join('')}</select><p class="muted">Changing state does not reset driving school lessons. State-specific courses are not yet implemented.</p></div><div class="card"><h2>Driving School Buddy</h2><div class="grid">${CHARACTERS.map(c=>`<button class="choice avatar ${data.buddy===c?'selected':''}" data-buddy="${c}">${img(c)}<span>${esc(c)}</span></button>`).join('')}</div></div><div class="card"><h2>Theme</h2>${themeChoices()}</div><div class="card"><h2>Voice Assistant</h2><p class="settings-note">Your browser reads lessons and questions aloud. Voice choices depend on the device.</p><label><input id="voiceOn" type="checkbox" ${data.voiceOn?'checked':''}> Enable voice assistant</label><p><label><input id="autoRead" type="checkbox" ${data.autoRead?'checked':''}> Automatically read each lesson screen</label></p><label for="voiceSelect">Reading voice</label><select id="voiceSelect"><option value="">Device default</option></select><label for="speechRate">Reading speed: <span id="rateLabel">${data.speechRate}×</span></label><input type="range" id="speechRate" min="0.5" max="1.5" step="0.1" value="${data.speechRate}" style="width:100%">${button('TEST MY VOICE','testVoice','secondary wide')}</div><div class="card"><h2>Sound effects</h2><button class="btn secondary wide" data-action="sound">${data.sound?'🔊 ON — Tap to mute':'🔇 OFF — Tap to enable'}</button></div><div class="card"><h2>Progress backup</h2><p class="muted">Progress is saved on this device in this browser. Clearing site data may erase it.</p>${button('EXPORT MY PROGRESS','export','secondary wide')}<p><label class="btn neutral wide" for="importFile">IMPORT PROGRESS FILE</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></p></div>${button('← BACK TO SCHOOL','learn','neutral wide')}`}
function finish(){stopSpeech();const finishedFinal=lessonIndex===LESSONS.length-1;const was=data.completed.includes(lessonIndex);if(!was){data.completed.push(lessonIndex);data.completed.sort((a,b)=>a-b);data.xp+=unitLast(lessonIndex)?30:20;const today=new Date().toLocaleDateString('en-CA');if(data.lastStudy!==today){const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);data.streak=data.lastStudy===yesterday.toLocaleDateString('en-CA')?data.streak+1:1;data.lastStudy=today;play('streak')}if(data.completed.length===1&&!data.awards.includes('First Steps')){data.awards.push('First Steps');play('achievement')}if(unitLast(lessonIndex)&&!data.awards.includes(LESSONS[lessonIndex].unit+' Graduate')){data.awards.push(LESSONS[lessonIndex].unit+' Graduate');play('levelup')}else play('complete');if(data.unlocked===lessonIndex&&lessonIndex<LESSONS.length-1){data.unlocked++;setTimeout(()=>play('unlock'),350)}}else play('complete');reconcileUnlock();save();screen=finishedFinal?'review':'learn';render();if(!finishedFinal){const nextIndex=Math.min(lessonIndex+1,LESSONS.length-1);requestAnimationFrame(()=>{const next=document.querySelector(`[data-lesson="${nextIndex}"]`);if(next){next.scrollIntoView({behavior:'instant',block:'center'});next.focus({preventScroll:true})}})}else window.scrollTo(0,0)}
function openLesson(i){if(i>data.unlocked)return;stopSpeech();lessonIndex=i;scenarioDraft='';scenarioChecked=false;scenarioRating=null;step=0;questionIndex=0;selected=-1;answered=false;mistakes=0;missedQuestions.clear();screen='lesson';play('click');render();window.scrollTo(0,0);if(data.autoRead)say(LESSONS[i].info[0])}
function hint(){const l=LESSONS[lessonIndex],q=l.q[questionIndex];const hints=[`Think back to the explanation. ${q[3]} 🤔`,`Try eliminating answers that don't match what you learned. 💚`,`The answer is: <strong>${esc(q[1][q[2]])}</strong>. You can do it! ⭐`];const el=document.getElementById('hint');let n=Number(el.dataset.level||0);el.innerHTML=bubble(data.buddy,hints[Math.min(n,2)]);el.dataset.level=String(Math.min(n+1,2));play('click')}
function doAction(a){if(!['check','replayVoice','pauseVoice','stopVoice'].includes(a))play('click');switch(a){case'onboard':screen='onboard';break;case'startExam':startExam();return;case'exitExam':screen='review';break;case'examCheck':if(examSelected<0)return;examChecked=true;examResults.push({q:examItems[examPos].q,ok:examSelected===examItems[examPos].q[2]});if(examSelected===examItems[examPos].q[2]){examScore++;play('correct')}else play('incorrect');break;case'examNext':examPos++;examSelected=-1;examChecked=false;break;case'finishSetup':data.setup=true;save();screen='learn';break;case'checkScenario':if(scenarioDraft.trim().split(/\s+/).filter(Boolean).length<3){driverzPopup('Write a short answer before comparing it with the recommended response.',{title:'Add your answer',kind:'warn'});return}scenarioChecked=true;scenarioRating=null;break;case'scenarioYes':scenarioRating=true;break;case'scenarioNo':scenarioRating=false;break;case'nextInfo':stopSpeech();selected=-1;scenarioDraft='';scenarioChecked=false;scenarioRating=null;step++;if(step>=LESSONS[lessonIndex].info.length){step=LESSONS[lessonIndex].info.length;questionIndex=0}break;case'check':if(selected<0)return;answered=true;if(selected===LESSONS[lessonIndex].q[questionIndex][2])play('correct');else{mistakes++;missedQuestions.add(questionIndex);play('incorrect')}break;case'retry':selected=-1;answered=false;break;case'nextQuestion':stopSpeech();if(questionIndex+1>=LESSONS[lessonIndex].q.length){if(missedQuestions.size){questionIndex=[...missedQuestions][0];missedQuestions.delete(questionIndex);selected=-1;answered=false;break}finish();return}questionIndex++;selected=-1;answered=false;break;case'exitLesson':stopSpeech();screen='learn';break;case'hint':hint();return;case'replayVoice':narrateCurrent();return;case'pauseVoice':if('speechSynthesis' in window){if(window.speechSynthesis.paused)window.speechSynthesis.resume();else window.speechSynthesis.pause()}return;case'stopVoice':stopSpeech();return;case'testVoice':say('Welcome to Driverz! Let’s learn to drive, one step at a time.');return;case'sound':data.sound=!data.sound;save();break;case'export':{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='driverz-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}default:if(['learn','review','awards','profile','settings'].includes(a))screen=a}render();if(screen==='lesson'&&data.autoRead&&['nextInfo','nextQuestion'].includes(a))narrateCurrent()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action){doAction(b.dataset.action);return}if(b.dataset.lesson!==undefined){openLesson(Number(b.dataset.lesson));return}if(b.dataset.buddy){data.buddy=b.dataset.buddy;save();play('click');render();return}if(b.dataset.theme){data.theme=b.dataset.theme;save();play('click');render();return}if(b.dataset.pedal!==undefined){selected=Number(b.dataset.pedal);play(selected===0?'correct':'incorrect');render();return}if(b.dataset.examAnswer!==undefined&&!examChecked){examSelected=Number(b.dataset.examAnswer);play('click');render();return}if(b.dataset.answer!==undefined&&!answered){selected=Number(b.dataset.answer);play('click');render()}});
app.addEventListener('input',e=>{if(e.target.id==='scenarioAnswer'){scenarioDraft=e.target.value;const counter=e.target.parentElement.querySelector('.tiny-count');if(counter)counter.textContent=scenarioDraft.trim().length+'/1200 characters'}});
app.addEventListener('change',async e=>{if(e.target.id==='voiceOn'){data.voiceOn=e.target.checked;stopSpeech();save();render();return}if(e.target.id==='autoRead'){data.autoRead=e.target.checked;save();return}if(e.target.id==='voiceSelect'){data.voiceURI=e.target.value;save();return}if(e.target.id==='speechRate'){data.speechRate=Number(e.target.value);save();document.getElementById('rateLabel').textContent=data.speechRate+'×';return}if(e.target.id==='stateSelect'){data.state=e.target.value;save();render()}if(e.target.id==='importFile'){const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x||typeof x!=='object'||!STATES.includes(x.state)||!CHARACTERS.includes(x.buddy)||!Object.hasOwn(THEMES,x.theme)||!Array.isArray(x.completed)||!x.completed.every(i=>Number.isInteger(i)&&i>=0&&i<LESSONS.length))throw Error('Invalid backup');data={...defaults,...x,setup:true,unlocked:Math.max(0,Math.min(LESSONS.length-1,Number(x.unlocked)||0)),completed:[...new Set(x.completed)],xp:Math.max(0,Number(x.xp)||0),streak:Math.max(0,Number(x.streak)||0),awards:Array.isArray(x.awards)?x.awards.filter(a=>typeof a==='string').slice(0,50):[]};save();screen='profile';render();driverzPopup('Your saved progress has been restored successfully.',{title:'Progress restored!',kind:'success'})}catch(err){driverzPopup('This file is not a valid Driverz progress backup. Please choose a backup exported from Driverz.',{title:'Could not import',kind:'error'})}}});
if('speechSynthesis' in window){speechVoices=window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices)}
document.getElementById('settingsBtn').addEventListener('click',()=>{stopSpeech();screen='settings';play('click');render()});document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){stopSpeech();screen=b.dataset.tab;play('click');render();window.scrollTo(0,0)}});render();
</script></body></html>
