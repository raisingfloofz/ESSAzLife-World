function play(key,loop=false){if(!db.settings.sound||!FILES[key])return;stopAudio();let a=new Audio(encodeURI(FILES[key]));a.loop=loop;a.volume=.8;activeAudio=a;a.play().catch(()=>{});if(key==='dogsleep'){a.loop=false;a.addEventListener('timeupdate',()=>{if(a.currentTime>=19)a.currentTime=0})}return a}

function playClip(key,start=0,end=null){if(!db.settings.sound||!FILES[key])return;stopAudio();let a=new Audio(encodeURI(FILES[key]));a.volume=.8;activeAudio=a;const begin=()=>{if(start>0){try{a.currentTime=start}catch{}}a.play().catch(()=>{})};if(a.readyState>=1)begin();else a.addEventListener('loadedmetadata',begin,{once:true});if(end!==null){let timer=setInterval(()=>{if(activeAudio!==a||a.paused||a.ended){clearInterval(timer);return}if(a.currentTime>=end){a.pause();clearInterval(timer);if(activeAudio===a)activeAudio=null}},45);a.addEventListener('ended',()=>clearInterval(timer),{once:true})}return a}
function workSound(type){const kind=session?.essa.kind;if(!kind)return;const key=type==='heard'&&['cat','kitten'].includes(kind)?kind+'confused':kind+'listen';return play(key)}
let previewAudio=null;
function previewWorkSound(key){if(previewAudio){previewAudio.pause();previewAudio=null}if(!FILES[key])return;const a=new Audio(encodeURI(FILES[key]));previewAudio=a;a.volume=.8;a.play().catch(()=>{alert('This sound could not be played. Check that the audio file is uploaded to GitHub with the exact filename.')});a.onended=()=>{if(previewAudio===a)previewAudio=null}}
function stopPreview(){if(previewAudio){previewAudio.pause();previewAudio=null}}
function stopVoice(){clearTimeout(voiceTimer);clearTimeout(workPottyTimer);voiceWindowUntil=0;if(recognition){const r=recognition;recognition=null;try{r.onend=null;r.abort()}catch{}}}
function startVoice(){if(!session?.running||session.mode!=='working')return;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){alert('Voice recognition is unavailable in this browser. You can still use NFC and manual care.');return}if(recognition){stopVoice();render();return}try{const r=new Speech();r.lang='en-US';r.continuous=true;r.interimResults=false;r.maxAlternatives=1;recognition=r;r.onresult=e=>{for(let i=e.resultIndex||0;i<e.results.length;i++){if(e.results[i].isFinal){const words=String(e.results[i][0]?.transcript||'').trim();if(words)processVoice(words)}}};r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopVoice();alert('Microphone permission was denied. NFC and manual care still work.');render()}};r.onend=()=>{if(recognition===r&&session?.running&&session.mode==='working'){voiceTimer=setTimeout(()=>{if(recognition===r&&session?.running&&session.mode==='working'){try{r.start()}catch{}}},1500)}};r.start();render()}catch{recognition=null;alert('Could not start voice recognition on this device.')}}
const BUILTIN_WORK_COMMANDS=['Sit','Stay','Focus','Come',"Let's go",'Good job','Go Potty','Go Pee','Go Poop'];
function trainingKey(essa){return String(essa?.id||essa?.name||'').trim()}
function customCommands(essa){return db.trainingCommands[trainingKey(essa)]||[]}
function allWorkCommands(essa){return [...BUILTIN_WORK_COMMANDS,...customCommands(essa)]}
function normalizeWork(text){return String(text||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function workCommandFrom(text,essa){const t=normalizeWork(text);const patterns=[['go poop',/\b(go (poop|poo|number two)|do a poop|poop|poo|number two)\b/],['go pee',/\b(go (pee|peep|tinkle)|pee|peep|tinkle|urinate)\b/],['go potty',/\b(go potty|potty|toilet|bathroom|use the bathroom|go to the bathroom|do your business)\b/],['sit',/\b(sit|sit down)\b/],['stay',/\b(stay|wait here)\b/],['focus',/\b(focus|watch me|attention|look at me)\b/],['come',/\b(come|come here|here)\b/],['lets go',/\b(let s go|lets go|let us go|heel|walk)\b/],['good job',/\b(good job|good boy|good girl|well done)\b/]];const built=patterns.find(x=>x[1].test(t));if(built)return built[0];return customCommands(essa).find(c=>normalizeWork(c)===t)||null}
function workPottyNeed(s,command){const c=normalizeWork(command);const need=normalizeWork(s.need||'');if(c==='go pee')return need==='pee'||need==='potty'&&s.pottyNext==='pee'?'pee':null;if(c==='go poop')return need==='poop'||need==='potty'&&s.pottyNext==='poop'?'poop':null;return ['pee','poop'].includes(need)?need:need==='potty'?(s.pottyNext||'pee'):null}
function executeWorkCommand(command,source='manual'){const s=session;if(!s?.running||s.mode!=='working')return;clearTimeout(workPottyTimer);const normalized=workCommandFrom(command,s.essa)||command;workSound('listening');feedback(true);playSuccessAfterResponse();s.commands=(s.commands||0)+1;eventLog('Command recognized: '+normalized,{type:'command',command:normalized,outcome:'Correct',source,points:0});const potty=workPottyNeed(s,normalized);if(['go pee','go poop','go potty'].includes(normalizeWork(normalized))){if(potty){workPottyTimer=setTimeout(()=>{if(session===s&&s.running)performPotty(true,potty)},3000)}else eventLog('Potty command acknowledged — no potty needed',{type:'command-note',command:normalized,outcome:'No potty needed',source,points:0})}}
function manualWorkCommand(){if(!session?.running||session.mode!=='working')return;const choices=allWorkCommands(session.essa);modal(`<h2>Manual Training Command</h2><p>Select the command you are giving ${esc(session.essa.name)}.</p><div class="grid">${choices.map((c,i)=>`<button class="btn alt" onclick="closeModal();executeWorkCommand(allWorkCommands(session.essa)[${i}],'manual')">${esc(c)}</button>`).join('')}</div><p><button class="btn alt" onclick="closeModal()">Cancel</button></p>`)}
function saveTrainingCommands(){const select=$('trainingEssa'),input=$('trainingList');if(!select||!input)return;const e=db.essas.find(x=>trainingKey(x)===select.value);if(!e)return;db.trainingCommands[trainingKey(e)]=[...new Set(input.value.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean))].filter(x=>!BUILTIN_WORK_COMMANDS.some(b=>normalizeWork(b)===normalizeWork(x))).slice(0,60);save();alert('Training commands saved for '+e.name);render()}
function refreshTrainingEditor(){const e=db.essas.find(x=>trainingKey(x)===$('trainingEssa')?.value);if($('trainingList'))$('trainingList').value=customCommands(e).join('\n')}
function processVoice(phrase){const s=session;if(!s?.running||s.mode!=='working')return;const heard=normalizeWork(phrase);const name=normalizeWork(s.essa.name);if(!heard||!name)return;let remainder=heard;const named=new RegExp('(?:^| )'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?: |$)').test(heard);if(named){voiceWindowUntil=Date.now()+30000;remainder=heard.replace(name,'').trim();workSound('listening');eventLog('Responded to name: '+s.essa.name)}if(!remainder)return;if(!named&&Date.now()>voiceWindowUntil)return;const found=workCommandFrom(remainder,s.essa);if(!found){workSound('heard');eventLog('Heard an unknown command: '+phrase,{type:'command',command:remainder,outcome:'Unknown command',source:'voice',points:0});return}voiceWindowUntil=Date.now()+30000;setTimeout(()=>{if(session===s&&s.running)executeWorkCommand(found,'voice')},named?950:0)}
function playSuccessAfterResponse(){/* The existing correct confirmation is played after the animal acknowledges the command. */setTimeout(()=>{if(session?.running&&session.mode==='working')playOverlay('correct')},1100)}
function playOverlay(key){if(!db.settings.sound||!FILES[key])return;const a=new Audio(encodeURI(FILES[key]));a.volume=.65;a.play().catch(()=>{})}
function performPotty(fromVoice=false,requestedType=null){const s=session;if(!s?.running)return;const type=requestedType|| (s.pottyNext==='poop'?'poop':'pee');s.pottyNext=type==='pee'?'poop':'pee';if(['pee','poop','potty'].includes(s.need))s.need=null;play(type);s.completed++;eventLog(type==='pee'?'Peed':'Pooped',{type:'care',points:0});if(!fromVoice)feedback(true);render()}

// Separate ambience channels keep the heartbeat audible under breathing and effects.
let heartbeatLayer=null, breathingLayer=null, breathingState='', breathingTransition=0;
const audioContextHolder={context:null};
function ensureAudioContext(){try{if(!audioContextHolder.context)audioContextHolder.context=new (window.AudioContext||window.webkitAudioContext)();audioContextHolder.context.resume().catch(()=>{});return audioContextHolder.context}catch{return null}}
function createLayer(path,volume,segment){const context=ensureAudioContext();if(!context)return null;const gain=context.createGain();gain.gain.value=volume;gain.connect(context.destination);let layer={gain,source:null,stopped:false,volume,segment};fetch(encodeURI(path)).then(r=>{if(!r.ok)throw Error('Missing audio: '+path);return r.arrayBuffer()}).then(b=>context.decodeAudioData(b)).then(buffer=>{if(layer.stopped)return;const source=context.createBufferSource();source.buffer=buffer;source.loop=true;if(segment){source.loopStart=Math.min(segment[0],Math.max(0,buffer.duration-.1));source.loopEnd=Math.min(segment[1],buffer.duration);if(source.loopEnd<=source.loopStart)source.loopEnd=buffer.duration;}source.connect(gain);source.start(0,segment?source.loopStart:0);layer.source=source}).catch(e=>console.warn(e));return layer}
function releaseLayer(layer,seconds=0){if(!layer)return;layer.stopped=true;const c=audioContextHolder.context;if(c){layer.gain.gain.cancelScheduledValues(c.currentTime);layer.gain.gain.setValueAtTime(layer.gain.gain.value,c.currentTime);layer.gain.gain.linearRampToValueAtTime(0,c.currentTime+seconds)}setTimeout(()=>{try{layer.source?.stop()}catch{}try{layer.gain.disconnect()}catch{}},seconds*1000+80)}
function setBreathing(asleep,immediate=false){if(!session?.running||!db.settings.sound)return;const kind=session.essa.kind;const dog=kind==='dog'||kind==='puppy';const state=asleep?'asleep':'awake';if(breathingState===state&&breathingLayer)return;breathingState=state;const old=breathingLayer;const key=dog?(asleep?'dogsleep':'dogawake'):(asleep?'catsleep':'catawake');const segment=dog?(asleep?[0,19]:[1,3]):null;const next=createLayer(FILES[key],dog?.16:.14,segment);breathingLayer=next;const duration=immediate?0:3;const c=audioContextHolder.context;if(next&&c){next.gain.gain.setValueAtTime(0,c.currentTime);next.gain.gain.linearRampToValueAtTime(next.volume,c.currentTime+duration)}releaseLayer(old,duration)}
function startAmbient(){if(!db.settings.sound||!session?.running)return;if(!heartbeatLayer)heartbeatLayer=createLayer(FILES.heartbeat,.045,null);setBreathing(!!session.asleep,true)}
function stopAmbient(){releaseLayer(heartbeatLayer);releaseLayer(breathingLayer);heartbeatLayer=null;breathingLayer=null;breathingState=''}
function sleepEssa(){if(!session?.running||session.mode==='working')return;session.asleep=true;stopAudio();setBreathing(true);render()}
function wakeEssa(){if(!session?.running)return;session.asleep=false;setBreathing(false);render();if(session.need)vocal();else scheduleNeed()}

function vocal(){if(!session?.running||!session.need||session.focused)return;let k=session.essa.kind;let key={puppy:'puppyhunger',dog:'dogwhine',kitten:'kittenhunger',cat:'cathunger'}[k];if(session.held&&(k==='puppy'||k==='dog'))return;play(key);if(k==='puppy'){const a=activeAudio;if(a)a.onended=()=>{if(session?.running&&session.need&&!session.held)loopTimer=setTimeout(vocal,5000)}}else{const a=activeAudio;if(a)a.onended=()=>{if(session?.running&&session.need)loopTimer=setTimeout(vocal,3500)}}}

function accessoriesScreen(){let items=[['bowl','Bowl'],['leash','Leash'],['brush','Brush'],['medicine','Medicine'],['soap','Soap'],['thermometer','Thermometer'],['bed','Bed']];screen(`<h1>Register NFC Accessories</h1><p class="muted">Bowl, Leash, and Brush come first. Existing Babiez tags can be reused.</p>${items.map(([k,n])=>`<div class="card"><div class="row"><strong>${n}</strong><button class="btn alt" onclick="register('item','${k}')">${db.registeredTags[k]?'Replace tag':'Scan tag'}</button></div><p class="tag">${esc(db.tags[k]||'Not registered')}</p></div>`).join('')}<div class="card"><h2>Brush Types</h2><p class="small muted">Your single brush tag works now. A second can be registered later.</p>${['short','long'].map(k=>`<div class="row" style="margin:10px 0"><span>${k==='short'?'Short-haired':'Long-haired'} brush<br><small class="tag">${esc(db.brushes[k]||'Not registered')}</small></span><button class="btn alt" onclick="register('brush','${k}')">Scan</button></div>`).join('')}</div><div class="card"><h2>Three Toys</h2>${db.toys.map((t,i)=>`<div class="row" style="margin:12px 0"><span>Toy ${i+1}<br><small class="tag">${esc(t||'Not registered')}</small></span><button class="btn alt" onclick="register('toy',${i})">Scan</button></div>`).join('')}</div>`,[{label:'Back',alt:true,fn:home}])}
function register(type,index){pending={type,index};modal(`<h2>Scan NFC Tag</h2><p>Hold the tag against your phone to register it.</p><p class="small muted">Web NFC requires Android Chrome, HTTPS, and an unlocked phone.</p><button class="btn" onclick="startNfc()">Enable NFC Scanner</button> <button class="btn alt" onclick="closeModal();pending=null">Cancel</button>`);startNfc()}
function readText(event){for(const record of event.message.records){try{if(record.recordType==='text')return new TextDecoder(record.encoding||'utf-8').decode(record.data).replace(/^\uFEFF/,'').trim()}catch{}}return event.serialNumber||''}
async function startNfc(){if(scanning)return;if(!('NDEFReader'in window)){alert('Web NFC requires Android Chrome on an HTTPS website.');return}try{scanner=new NDEFReader();await scanner.scan();scanning=true;scanner.addEventListener('reading',e=>{let value=readText(e);if(value)receiveTag(value)});scanner.addEventListener('readingerror',()=>alert('Could not read tag. Try again.'));closeModal()}catch(e){alert('NFC could not start: '+e.message)}}
function receiveTag(value){let now=Date.now();if(lastTag===value&&now-lastTagAt<1200)return;lastTag=value;lastTagAt=now;if(pending){let p=pending;pending=null;if(p.type==='wizardHandler'){wizard.newTag=value;play('registered');feedback(true);closeModal();if($('tagStatus'))$('tagStatus').textContent=value;return}else if(p.type==='handler')db.handlers[p.index].tag=value;else if(p.type==='item'){db.tags[p.index]=value;db.registeredTags[p.index]=true;}else if(p.type==='brush')db.brushes[p.index]=value;else if(p.type==='toy')db.toys[p.index]=value;save();play('registered');feedback(true);render();return}if(session?.running)handleTag(value)}
function modesScreen(){let e=db.essas.find(x=>x.id===selectedEssa);if(!e)return home();screen(`<h1>Choose a simulation</h1><p class="muted">${esc(e.name)} · ${esc(e.kind)}</p><button class="choice" onclick="chooseMode('demo')"><span class="grow">Demo<div class="small muted">Guided, immediate accessory practice</div></span>›</button><div class="card"><h2>Classic</h2><div class="grid2"><button class="btn alt" onclick="chooseMode('easy')">Easy</button><button class="btn alt" onclick="chooseMode('medium')">Medium</button><button class="btn alt" onclick="chooseMode('hard')">Hard</button><button class="btn alt" onclick="chooseMode('sick')">Sick</button></div></div><button class="choice" onclick="chooseMode('comfort')"><span class="grow">Comfort<div class="small muted">Relaxed simulation</div></span>›</button><button class="choice" onclick="chooseMode('quick')"><span class="grow">Quick Play<div class="small muted">Shortened care simulation</div></span>›</button><button class="choice" onclick="chooseMode('plush')"><span class="grow">Plush Mode<div class="small muted">Care with NFC accessories</div></span>›</button><button class="choice" onclick="chooseMode('daycare')"><span class="grow">Daycare<div class="small muted">Scheduled quiet periods</div></span>›</button><button class="choice" onclick="chooseMode('working')"><span class="grow">Working<div class="small muted">Awake, alert, optional voice commands and voluntary care</div></span>›</button>`,[{label:'Back',alt:true,fn:()=>{page='home';render()}}])}
function chooseMode(mode){let e=db.essas.find(x=>x.id===selectedEssa),h=db.handlers[e.primaryHandler??0]||db.handlers[0];session={mode,essa:e,handler:h,score:100,events:[],running:false,need:null,held:false,focused:false,focusKind:'',paused:false,foodCups:.5,started:0,completed:0,wrong:0,commands:0,pottyNext:'pee'};page='prepare';render()}
function prepareScreen(){screen(`<h1>Prepare ${esc(session.essa.name)}</h1><div class="card"><p><strong>Mode:</strong> ${esc(session.mode)}</p><p><strong>Handler:</strong> ${esc(session.handler.name)}</p><p><strong>Species:</strong> ${esc(session.essa.kind)}</p><p class="small muted">Feedings: ${['puppy','kitten'].includes(session.essa.kind)?4:2} daily. Water is available throughout the day.</p></div><p class="notice">Keep Tap open and your phone unlocked for NFC care. For Plush Mode, use the caregiver band and accessory tags; manual entry is optional.</p><button class="btn alt" onclick="startNfc()">Enable NFC Scanner</button>`,[{label:'Back',alt:true,fn:()=>{page='modes';render()}},{label:"I'm Ready",fn:beginSession}])}
function beginSession(){session.running=true;session.started=Date.now();session.asleep=session.mode==='comfort';page='live';render();startAmbient();startNfc();setTimeout(()=>{if(session?.running&&!session.focused&&!session.need&&!session.asleep)createNeed()},session.mode==='working'?999999999:session.mode==='demo'?1500:session.mode==='quick'?5000:12000)}
const needs=['food','water','potty','play','groom','rest','medicine','temperature'];
function createNeed(){if(session?.mode==='working')return;if(!session?.running||session.paused||session.focused||session.need||session.asleep)return;let pool=session.mode==='demo'?['food','water','play','groom','temperature','rest','medicine']:needs;session.need=session.mode==='demo'?pool[session.completed%pool.length]:pool[Math.floor(Math.random()*pool.length)];session.held=false;session.wrong=0;session.due=Date.now();vocal();render()}
function formatTime(ms){let n=Math.max(0,Math.floor(ms/1000));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function careSoFar(){if(!session)return;modal(`<h2>Care So Far</h2><div class="log">${session.events.map(e=>`<p>${esc(e.time)} — ${esc(e.text)}</p>`).join('')||'<p>No care recorded yet.</p>'}</div><p><button class="btn" onclick="closeModal()">Close</button></p>`)}
function workingReference(){
 if(!session?.running||session.mode!=='working')return;
 const name=esc(session.essa.name),kind=session.essa.kind;
 const commands=allWorkCommands(session.essa);
 const sounds=[['Listening',kind+'listen','Responds to their name or a known command'],['I heard you',(['cat','kitten'].includes(kind)?kind+'confused':kind+'listen'),'Acknowledges a genuinely unknown command'],['Awake breathing',['dog','puppy'].includes(kind)?'dogawake':'catawake','Quiet breathing while alert'],['Heartbeat','heartbeat','Continuous background heartbeat'],['Pee','pee','Potty sound when needed'],['Poop','poop','Potty sound when needed']];
 modal(`<div class="work-ref"><div class="work-ref-head"><h2>Working Reference</h2><button class="work-ref-close" onclick="closeModal()" aria-label="Close reference">×</button></div>
 <p class="muted">${name} · ${esc(kind)}</p><p>Say <b>“${name}”</b>, then give a command within 30 seconds.</p>
 <h3>Commands</h3><div class="work-command-list">${commands.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
 <p class="muted small">Natural variations are accepted, including “Go potty,” “Go pee,” “Go poop,” “Watch me,” and “Heel.” Add custom commands in Settings.</p>
 <h3>What the sounds mean</h3><div class="sound-reference">${sounds.map(([label,key,desc])=>`<div class="sound-ref-row"><div><b>${esc(label)}</b><div class="small muted">${esc(desc)}</div></div><button class="btn alt small" onclick="previewWorkSound('${key}')" aria-label="Play ${esc(label)}">▶ Play</button></div>`).join('')}</div>
 <div class="potty-help"><b>How potty commands work</b><span class="small">“Go Potty,” “Go Pee,” and “Go Poop” are recognized. If your ESSA already needs to go, the pee or poop sound plays about <b>3 seconds</b> after the command. Otherwise, the command is acknowledged without a potty sound. Working Mode currently does not create new potty needs automatically.</span></div>
 <p class="muted small">Food, water, and treats are optional during work. Tap your caregiver band to give a manual command or offer care.</p><button class="btn" onclick="closeModal()">Close</button></div>`);
}

function caregiverId(){if(!session?.running)return;modal(`<h2>Caregiver ID</h2><p>Scan your registered handler band to identify yourself and hold your ESSA.</p><p class="tag">${esc(session.handler.tag)}</p><button class="btn alt" onclick="closeModal()">Close</button>`)}
function breakSession(){let s=session;if(!s)return;s.paused=!s.paused;if(s.paused){clearTimeout(needTimer);stopAudio()}else{if(s.asleep)setBreathing(true);else if(s.need)vocal();else scheduleNeed()}render()}
function liveScreen(){if(!session?.running)return home();let s=session;let elapsed=formatTime(Date.now()-s.started),sleeping=s.asleep&&!s.focused;let state=s.mode==='working'?'Working — Awake & Alert':s.focused?'Focused — '+s.focusKind:s.paused?'On Break':sleeping?'ESSA is Asleep':s.need?'ESSA Needs Care':'ESSA is Awake';let instruction=s.mode==='working'?'Say your ESSA’s name, then a command. Routine care requests are muted.':s.focused?'Scan your handler band and leash to finish.':s.paused?'Simulation paused.':sleeping?'Your ESSA is sleeping peacefully.':s.need?'Time to scan handler band':'Waiting for the next care request';let detail=s.mode==='working'?'Heartbeat and awake breathing stay active. Treats, food and water are optional.':s.focused?'Focused state active':s.paused?'Take your time.':sleeping?'Listening for NFC tags':s.held?'Scan the accessory tag or scan your band again for manual entry.':'Scan handler tag.';
if(s.mode==='demo'){const label={food:'Bowl (food)',water:'Bowl (water)',potty:'Potty',play:'Toy',groom:'Brush',rest:'Bed',medicine:'Medicine',temperature:'Thermometer'}[s.need]||'care item';instruction=s.need?(s.held?'Now scan the '+label+' NFC tag.':'First scan your caregiver band. Then scan the '+label+' NFC tag.'):'Wait for the next demo instruction.';detail='Demo step '+Math.min(s.completed+1,7)+' of 7 — follow the NFC instructions.';}
screen(`<div class="care-stage"><div class="care-head"><h1>${esc(s.essa.name)}</h1><span class="pill">${esc(s.mode.toUpperCase())}</span><span class="pill" id="liveElapsed">${elapsed}</span></div><div class="inline"><span class="pill">${s.held?'Being held':sleeping?'Sleeping':s.focused?'Focused':'Awake'}</span><span class="pill">Score <b>${s.score}%</b></span><span class="pill">${s.mode==='demo'?Math.min(s.completed+1,7)+'/7':s.completed+' cared for'}</span></div><div class="baby-stage"><div class="baby-figure"></div><h2>${esc(state)}</h2><div class="big-timer" id="careClock">${sleeping?'Zzz':s.need?formatTime(Date.now()-s.due):elapsed}</div><p>${esc(instruction)}</p><p>${esc(detail)}</p></div><div class="nfc-indicator">${scanning?'Listening for NFC tags':'NFC scanner not enabled'}</div><div class="care-actions"><button class="btn alt" onclick="careSoFar()">Care So Far</button><button class="btn alt" onclick="caregiverId()">Tap here to use caregiver ID</button><button class="btn alt" onclick="startNfc()">Enable NFC</button>${s.mode==='working'?`<button class="btn alt" onclick="startVoice()">${recognition?'Stop Microphone':'Enable Microphone'}</button><button class="btn alt" onclick="manualWorkCommand()">Manual Command</button><button class="btn alt" onclick="manualEntry()">Offer Care / Treat</button><button class="btn alt" onclick="workingReference()">📖 Work Reference</button>`:''}<button class="btn alt" onclick="breakSession()">${s.paused?'Resume Simulation':'I Need a Break'}</button><button class="btn alt wide" onclick="stopSession(true)">End Simulation</button></div></div>`);
clearInterval(window.tapClockInterval);window.tapClockInterval=setInterval(()=>{if(page!=='live'||!session?.running){clearInterval(window.tapClockInterval);return}let e=$('liveElapsed'),c=$('careClock');if(e)e.textContent=formatTime(Date.now()-session.started);if(c&&!session.asleep)c.textContent=session.need?formatTime(Date.now()-session.due):formatTime(Date.now()-session.started)},1000)}

function eventLog(text,details={}){if(!session)return;session.events.push({time:new Date().toLocaleTimeString(),text,...details});render()}
function handleTag(tag){let s=session;if(!s||!s.running)return;let handler=db.handlers.find(h=>h.tag===tag)||tag==='ESSAZ-CAREGIVER-DEMO'?db.handlers.find(h=>h.tag===tag)||s.handler:null;if(handler&&s.mode==='working'){s.held=true;modal(`<h2>Handler Band — Working</h2><p>What would you like to do?</p><button class="btn" onclick="closeModal();manualWorkCommand()">Give Manual Command</button> <button class="btn alt" onclick="closeModal();manualEntry()">Offer Care / Treat</button> <button class="btn alt" onclick="closeModal()">Cancel</button>`);return}if(handler){if(s.awaitLeash){s.awaitLeash=false}s.held=true;stopAudio();if(s.need&&['cat','kitten'].includes(s.essa.kind))vocal();if(s.holdingOnce){s.holdingOnce=false;manualPrompt()}else{s.holdingOnce=true;eventLog('Handler holding ESSA');feedback(true)}return}if(tag===db.tags.leash){if(s.held){s.holdingOnce=false;focusPrompt();return}incorrect('Leash scanned without handler');return}let action=null;if(tag===db.tags.bowl)action=s.need==='water'?'water':'food';else if(tag===db.tags.brush||Object.values(db.brushes).includes(tag)&&tag)action='groom';else if(tag===db.tags.medicine)action='medicine';else if(tag===db.tags.soap)action='groom';else if(tag===db.tags.thermometer)action='temperature';else if(tag===db.tags.bed)action='rest';else if(db.toys.includes(tag)&&tag)action='play';if(!action){incorrect('Unknown accessory');return}if(!s.held){incorrect('Scan caregiver band first');return}s.holdingOnce=false;doCare(action)}
function manualPrompt(){modal(`<h2>Manual Entry?</h2><p>Would you like to select a care activity manually?</p><div class="row"><button class="btn alt" onclick="closeModal()">No — Scan an Item</button><button class="btn" onclick="closeModal();manualEntry()">Yes</button></div>`)}
function manualEntry(){if(!session?.running)return;modal(`<h2>Manual Care Entry</h2><p>Choose what you want to do.</p><div class="grid">${(session.mode==='working'?['treat','food','water','potty','play','groom','medicine','temperature']:needs).map(n=>`<button class="btn alt" onclick="closeModal();doCare('${n}')">${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div><p><button class="btn alt" onclick="closeModal()">Cancel</button></p>`)}
function focusPrompt(){let s=session;if(s.focused){modal(`<h2>Finish ${esc(s.focusKind)}?</h2><p>Allow your ESSA to relax and resume care requests?</p><button class="btn" onclick="closeModal();endFocus()">Yes</button> <button class="btn alt" onclick="closeModal()">No</button>`)}else modal(`<h2>Are we on an outing? Or is it time for work?</h2><p>Choose a focused activity. Your ESSA won't request care during it.</p><button class="btn" onclick="startFocus('Outing')">Outing</button> <button class="btn" onclick="startFocus('Work')">Work</button> <button class="btn alt" onclick="closeModal()">No</button>`)}
function startFocus(kind){closeModal();let s=session;s.focused=true;s.focusKind=kind;s.held=false;s.holdingOnce=false;stopAudio();clearTimeout(needTimer);eventLog(kind+' started');feedback(true)}
function endFocus(){let s=session;s.focused=false;s.focusKind='';s.held=false;s.holdingOnce=false;eventLog('Focused session ended');if(s.need)vocal();else scheduleNeed()}
function incorrect(reason){if(!session)return;session.score=Math.max(0,session.score-5);session.wrong++;play('lost');feedback(false);eventLog('Incorrect care: '+reason);if(['dog','puppy'].includes(session.essa.kind)&&session.wrong>=2){setTimeout(()=>play('dogtalk'),1200)}}
function doCare(action){let s=session;if(!s?.running||(s.focused&&s.mode!=='working'))return;if(s.mode==='working'&&action==='treat'){play('treat');s.completed++;eventLog('Treat given');feedback(true);return}if(s.mode==='working'&&action==='potty'){performPotty();return}if(action==='food'){feedingPicker();return}if(action==='temperature'){thermometer();return}completeCare(action)}
function feedingPicker(){let s=session;modal(`<h2>Prepare Food</h2><p>Choose the amount in cups.</p><p style="font-size:28px;color:var(--rust);font-weight:800;text-align:center" id="cupval">${s.foodCups.toFixed(2)} cups</p><input type="range" id="cups" min=".25" max="3" step=".25" value="${s.foodCups}" oninput="$('cupval').textContent=Number(this.value).toFixed(2)+' cups'"><div class="row"><button class="btn alt" onclick="closeModal()">Cancel</button><button class="btn" onclick="session.foodCups=Number($('cups').value);closeModal();completeCare('food')">Feed</button></div>`)}
function thermometer(){let s=session;let temp=s.need==='temperature'?39.8:38.5;let f=db.settings.unit==='F';let display=f?(temp*9/5+32):temp;let high=temp>=39.7,elev=temp>=39.2;let color=high?'#c62828':elev?'#b8860b':'#16843a';modal(`<h2>Thermometer</h2><div style="text-align:center;font-size:36px;font-weight:800;color:${color}">${display.toFixed(1)}°${f?'F':'C'}</div><p style="text-align:center;color:${color}">${high?'High':elev?'Elevated':'Normal'}</p><div class="row"><button class="btn alt" onclick="closeModal()">Cancel</button><button class="btn" onclick="closeModal();completeCare('temperature')">Record Temperature</button></div>`)}
function completeCare(action){let s=session;if(!s?.running)return;if(s.mode==='working'&&action!=='medicine'){const kind=s.essa.kind;const sound=action==='food'?kind+'food':action==='water'?kind+'water':action==='play'?kind+'play':null;if(sound)play(sound);s.completed++;eventLog(action+' offered'+(action==='food'?' ('+s.foodCups.toFixed(2)+' cups)':''));feedback(true);render();return}if(s.need!==action){incorrect(action==='medicine'?'Unnecessary medicine':'Expected '+(s.need||'no care')+', received '+action);return}feedback(true);play('correct');let duration=action==='food'?6500:action==='water'?4500:action==='rest'?5000:2500;let kind=s.essa.kind;let audioKey=action==='food'?(kind+'food'):action==='water'?(kind+'water'):action==='play'?(kind+'play'):action==='rest'&&['dog','puppy'].includes(kind)?'dogsleep':null;let cups=s.foodCups;s.need=null;s.held=false;s.holdingOnce=false;s.completed++;s.score=Math.min(100,s.score+2);eventLog(action+' completed'+(action==='food'?' ('+cups.toFixed(2)+' cups)':''));if(action==='rest')setTimeout(()=>{if(s.running){sleepEssa();if(s.mode==='demo')setTimeout(()=>{if(s.running)wakeEssa()},5000)}},600);if(audioKey&&action!=='rest'){setTimeout(()=>{if(s.running){play(audioKey,true);careTimer=setTimeout(()=>{stopAudio();scheduleNeed()},duration)}},400)}else if(action!=='rest')scheduleNeed()}
function scheduleNeed(){clearTimeout(needTimer);if(!session?.running||session.focused||session.asleep||session.mode==='working')return;let delay=session.mode==='quick'?14000:session.mode==='comfort'?90000:session.mode==='demo'?1200:45000;needTimer=setTimeout(createNeed,delay)}
function tapGrade(score){return score>=90?'A':score>=80?'B':score>=70?'C':score>=60?'D':'F'}
function stopSession(report){stopVoice();clearInterval(window.tapClockInterval);clearTimeout(needTimer);clearTimeout(careTimer);stopAudio();stopAmbient();closeModal();if(!session)return;let s=session;s.running=false;s.score=Math.max(0,Math.min(100,s.score));s.grade=tapGrade(s.score);s.ended=Date.now();if(s.mode!=='demo'){db.reports.unshift({essaId:s.essa.id,name:s.essa.name,kind:s.essa.kind,mode:s.mode,handler:s.handler.name,score:s.score,grade:s.grade,completed:s.completed,commands:s.commands||0,events:s.events,date:new Date().toLocaleString(),at:s.ended});db.reports=db.reports.slice(0,100);save()}if(report){page='report';render();play(s.score>=70?'pass':'fail')}else{session=null;page='home';render()}}
function reportHistoryRows(events,reportIndex=-1){return (events||[]).map((e,i)=>`<button class="history-entry" onclick="openReportEntry(${reportIndex},${i})"><span><b>${esc(e.time||'Activity')}</b> · ${esc(e.text||'Activity')}</span><span aria-hidden="true">›</span></button>`).join('')||'<p>No activities yet.</p>'}
function reportScreen(){if(!session)return reportsScreen();let s=session;screen(`<h1>${s.mode==='demo'?'Demo':'Simulation'} Report Card</h1><div class="card center"><div class="score grade${s.grade}" style="font-size:78px;font-weight:800;color:${s.score>=70?'#18804b':'#b42318'}">${s.grade}</div><h2 style="font-size:34px">${s.score}%</h2><p>${esc(s.essa.name)} · ${esc(s.mode==='working'?'Working':s.mode)}</p></div><div class="grid2"><div class="card center"><h2>${s.completed}</h2><span class="small">Care activities</span></div><div class="card center"><h2>${s.wrong}</h2><span class="small">Incorrect care actions</span></div></div>${s.mode==='working'?`<div class="card center"><h2>${s.commands||0}</h2><span class="small">Commands recognized</span></div>`:''}<div class="card"><h2>Caregivers</h2><p>${esc(s.handler.name)} (${esc(s.handler.role)})</p></div><div class="card"><h2>Care history</h2>${reportHistoryRows(s.events,-1)}</div>`,[{label:'Saved Report Cards',alt:true,fn:()=>{session=null;page='reports';render()}},{label:'Home',fn:()=>{session=null;page='home';render()}}])}
function openSavedReport(index){const r=db.reports[index];if(!r)return;screen(`<h1>${esc(r.name)} · Report Card</h1><div class="card center"><h2>${esc(r.grade||tapGrade(r.score))} · ${r.score}%</h2><p>${esc(r.mode)} · ${esc(r.date)}</p><p>Handler: ${esc(r.handler)} · ${r.completed||0} care activities · ${r.commands||0} commands</p></div><div class="card"><h2>Activity history</h2><p class="small muted">Tap an entry to view or correct its details.</p>${reportHistoryRows(r.events,index)}</div>`,[{label:'Back to Reports',fn:()=>{page='reports';render()}}])}
function openReportEntry(reportIndex,eventIndex){const r=reportIndex<0?session:db.reports[reportIndex];const e=r?.events?.[eventIndex];if(!e)return;const isCommand=e.type==='command'||/^Command recognized:|^Heard an unknown command:|^Unrecognized spoken command:/.test(e.text||'');const outcome=e.outcome|| (e.text?.startsWith('Command recognized:')?'Correct':e.text?.includes('unknown')||e.text?.includes('Unrecognized')?'Unknown command':'Recorded');modal(`<div class="work-ref"><div class="work-ref-head"><h2>Activity Details</h2><button class="work-ref-close" onclick="closeModal()">×</button></div><p><b>${esc(e.text)}</b></p><p class="small muted">${esc(e.time||'')} · ${esc(r.mode||'')} · ${esc(r.handler?.name||r.handler||'')}</p>${isCommand?`<p><b>Command:</b> ${esc(e.command||e.text.split(': ').slice(1).join(': '))}</p><p><b>Outcome:</b> ${esc(outcome)}</p><p><b>Input:</b> ${esc(e.source||'Voice / manual')}</p>`:''}<p><b>Points adjustment:</b> ${Number(e.points)||0}</p>${isCommand?`<button class="btn alt" onclick="editReportEntry(${reportIndex},${eventIndex})">Edit Entry</button>`:''}<button class="btn" onclick="closeModal()">Close</button></div>`)}
function editReportEntry(reportIndex,eventIndex){const r=reportIndex<0?session:db.reports[reportIndex];const e=r?.events?.[eventIndex];if(!e)return;const command=e.command||e.text.split(': ').slice(1).join(': ');const outcome=e.outcome||(e.text.startsWith('Command recognized:')?'Correct':'Unknown command');modal(`<div class="work-ref"><h2>Edit Command Entry</h2><label class="field">Command<input id="editCommand" maxlength="120" value="${esc(command)}"></label><label class="field">Outcome<select id="editOutcome">${['Correct','Incorrect','Unknown command'].map(o=>`<option ${outcome===o?'selected':''}>${o}</option>`).join('')}</select></label><p class="small muted">Changes to scored entries adjust the report's score and grade. The original entry is kept in correction history.</p><div class="grid2"><button class="btn alt" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveReportEdit(${reportIndex},${eventIndex})">Save Changes</button></div><button class="btn alt" onclick="deleteReportEntry(${reportIndex},${eventIndex})">Remove Entry</button></div>`)}
function reportCorrection(r,e,action){r.corrections ||= [];r.corrections.push({at:new Date().toISOString(),action,original:JSON.parse(JSON.stringify(e))})}
function scoreForOutcome(outcome){return outcome==='Incorrect'?-5:0}
function updateReportTotals(r){r.score=Math.max(0,Math.min(100,Number(r.score??100)));r.grade=tapGrade(r.score);r.commands=(r.events||[]).filter(e=>e.type==='command'&&e.outcome==='Correct'||e.text?.startsWith('Command recognized:')&&!e.outcome).length}
function saveReportEdit(reportIndex,eventIndex){const r=reportIndex<0?session:db.reports[reportIndex];const e=r?.events?.[eventIndex];if(!e)return;const command=$('editCommand').value.trim(),outcome=$('editOutcome').value;if(!command){alert('Enter a command.');return}reportCorrection(r,e,'edited');const oldPenalty=scoreForOutcome(e.outcome||'Correct'),newPenalty=scoreForOutcome(outcome);r.score=(r.score??100)-oldPenalty+newPenalty;e.command=command;e.outcome=outcome;e.type='command';e.text=(outcome==='Correct'?'Command recognized: ':outcome==='Incorrect'?'Command incorrect: ':'Heard an unknown command: ')+command;e.points=newPenalty;updateReportTotals(r);if(reportIndex>=0)save();closeModal();if(reportIndex<0)reportScreen();else openSavedReport(reportIndex)}
function deleteReportEntry(reportIndex,eventIndex){if(!confirm('Remove this activity from the report?'))return;const r=reportIndex<0?session:db.reports[reportIndex];const e=r?.events?.[eventIndex];if(!e)return;reportCorrection(r,e,'removed');r.score=(r.score??100)-scoreForOutcome(e.outcome||'Correct');r.events.splice(eventIndex,1);updateReportTotals(r);if(reportIndex>=0)save();closeModal();if(reportIndex<0)reportScreen();else openSavedReport(reportIndex)}
function reportsScreen(){screen(`<h1>Saved Report Cards</h1><div class="scrolllist">${db.reports.map((r,i)=>{let score=Math.max(0,Math.min(100,r.score??100)),grade=r.grade||tapGrade(score);return `<button class="history-entry" onclick="openSavedReport(${i})"><span><b>${esc(r.name)}</b> · ${new Date(r.at||r.date).toLocaleDateString()}<br><b style="color:${score>=70?'#18804b':'#b42318'}">${grade} · ${score}%</b> · ${esc(r.mode==='working'?'Working':r.mode)} · ${r.completed||0} tasks</span><span>›</span></button>`}).join('')||'<p>No saved simulations yet.</p>'}</div>`,[{label:'Back',fn:home}])}
function settingsScreen(){screen(`<h1>Settings</h1><a class="setup-help-link" href="https://youtube.com/playlist?list=PLVkbp0zOaKEg&amp;si=fkBN37F-XzM-tmTi" target="_blank" rel="noopener noreferrer">▶ I need setup help</a><div class="grid2"><button class="btn alt" onclick="page='handlers';render()">Handler Settings</button><button class="btn alt" onclick="page='accessories';render()">NFC Accessories</button></div><div class="card"><h2>Sounds</h2><label><input type="checkbox" ${db.settings.sound?'checked':''} onchange="db.settings.sound=this.checked;save();if(!this.checked){stopAudio();stopAmbient()}else if(session?.running)startAmbient()"> Enable sounds</label></div><div class="card"><h2>Temperature Unit</h2><label class="field">Display<select onchange="db.settings.unit=this.value;save()"><option value="F" ${db.settings.unit==='F'?'selected':''}>Fahrenheit (°F)</option><option value="C" ${db.settings.unit==='C'?'selected':''}>Celsius (°C)</option></select></label></div><div class="card"><h2>Training Commands</h2><p class="muted">Add commands for each ESSA to use in Working Mode. Enter one command per line. Built-in commands (Sit, Stay, Focus, Come, Let's go, Good job, Go Potty, Go Pee, Go Poop) are always available.</p>${db.essas.length?`<label class="field">ESSA<select id="trainingEssa" onchange="refreshTrainingEditor()">${db.essas.map(e=>`<option value="${esc(trainingKey(e))}">${esc(e.name)}</option>`).join('')}</select></label><label class="field">Additional commands<textarea id="trainingList" rows="7" placeholder="Down&#10;Leave it&#10;Touch"></textarea></label><button class="btn" onclick="saveTrainingCommands()">Save Commands</button>`:'<p>Add an ESSA to create training commands.</p>'}</div><div class="card"><h2>Refrigerator</h2><p class="muted">Coming in a future update: register and nickname food NFC tags.</p></div><div class="card"><h2>Backup and Restore</h2><button class="btn alt" onclick="backup()">Download Backup</button> <label class="btn alt" style="display:inline-block">Restore Backup<input type="file" accept=".json" hidden onchange="restore(event)"></label></div>`,[{label:'Back',alt:true,fn:home}]);refreshTrainingEditor()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='essazlife-tap-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function restore(e){try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.essas)||!Array.isArray(v.handlers))throw Error('Invalid backup');if(confirm('Replace Tap data with this backup?')){db=v;save();render()}}catch(err){alert('Could not restore: '+err.message)}}
render();
</script></body></html>
