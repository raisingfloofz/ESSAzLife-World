function profileFields(){return `<label>Profile photo</label>${db.profile.photo?`<img src="${db.profile.photo}" alt="Your photo" style="width:76px;height:76px;border-radius:50%;object-fit:cover;display:block;margin-bottom:10px">`:''}<input id="pphoto" type="file" accept="image/*"><label>Name</label><input id="pname" value="${esc(db.profile.name)}" placeholder="Your name"><label>Age</label><input id="page" type="number" min="0" max="120" inputmode="numeric" value="${esc(db.profile.age)}" placeholder="Your age"><label>Gender</label>${genderButtons(db.profile.gender)}<label>Birthday</label><input id="pdob" type="date" value="${esc(db.profile.dob)}"><label>Favorite color — app theme</label>${colorPicker(db.profile.favoriteColor)}<label>Home dimension</label><select id="pdim">${db.dimensions.map(d=>`<option ${d===db.profile.dimension?'selected':''}>${esc(d)}</option>`).join('')}</select>`}
function setupView(){const root=$('#app');root.className='app';root.innerHTML=`<main class="setup-wrap"><div class="setup-card"><div class="muted small">WELCOME TO DIMENSIONZ</div><h1>Let's set up your profile</h1><p class="muted">Make this space your own before you start chatting. You can change these details later.</p>${profileFields()}<p style="margin:20px 0 0"><button class="primary" style="width:100%" onclick="saveProfile(true)">Save & enter Dimensionz →</button></p></div></main>`}
const displayName=c=>(c?.nickname||c?.name||'Unknown');const avatar=c=>`<span class="avatar">${c.photo?`<img src="${c.photo}" alt="">`:esc((c.name||'?')[0].toUpperCase())}</span>`;
function status(c){if(c.dimension==='Heaven')return {text:'Read',cls:'online'};let d=Date.now()-(c.lastActivity||0);return d<300000?{text:'Online',cls:'online'}:d<900000?{text:'Away',cls:'away'}:{text:'Offline',cls:''}}
function render(){applyTheme();const root=$('#app');if(!db.settings.profileSetupComplete){setupView();return}if(selected){renderChat(root);return}root.className='app';const inbox=page==='home';root.innerHTML=`${inbox?'':`<header class="top"><button class="profile-trigger" aria-label="Your profile and settings" onclick="openMySettings()">${avatar(db.profile)}</button><div class="grow"><h1>Dimensionz</h1><div class="muted small">An ESSAzLife App · Your Personal Chat Diary</div></div></header>`}<main class="${inbox?'inbox-home':'page'}">${content()}</main><nav class="nav">${[['contacts','♙ Contacts'],['home','◉ Chats'],['calls','☎ Calls'],['library','▤ Library']].map(([id,n])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${n}</button>`).join('')}</nav>`;applyTheme();}
function inboxLast(c){const a=db.messages[c.id]||[];return a[a.length-1]||null}
function inboxUnread(c){const lastSeen=Number(c.lastReadAt||0);return (db.messages[c.id]||[]).filter(m=>m.side==='in'&&!m.deleted&&m.at>lastSeen).length}
function inboxDate(t){if(!t)return '';const d=new Date(t),now=new Date();if(messageDayKey(t)===messageDayKey(now.getTime()))return time(t);const y=new Date(now);y.setDate(y.getDate()-1);if(messageDayKey(t)===messageDayKey(y.getTime()))return 'Yesterday';return d.toLocaleDateString([],{month:'short',day:'numeric'})}
function inboxPreview(m){if(!m)return 'Start a conversation';if(m.deleted)return 'This message was deleted.';if(m.type==='memory-update')return 'Memory Updated';if(m.type==='photo')return m.side==='out'?'You: Photo':'Photo';if(m.type==='call')return (m.direction==='out'?'You: ':'')+callLabel(m);if(m.type==='voice')return m.side==='out'?'You: Voice message':'Voice message';return (m.side==='out'?'You: ':'')+(m.text||'')}
function inboxItem(c){const m=inboxLast(c),n=inboxUnread(c);return `<div class="inbox-item ${n?'unread':''}" role="button" tabindex="0" data-inbox-search="${esc((c.name+' '+(c.nickname||'')+' '+c.dimension).toLowerCase())}" onclick="inboxTap(event,'${c.id}')" oncontextmenu="event.preventDefault();inboxLongPressCancel();openClearChatDialog('${c.id}')" ontouchstart="inboxLongPressStart(event,'${c.id}')" ontouchend="inboxLongPressCancel()" ontouchcancel="inboxLongPressCancel()" ontouchmove="inboxLongPressMove(event)" onkeydown="if(event.key==='Enter')openChat('${c.id}')">${avatar(c)}<div class="inbox-item-main"><div class="inbox-item-head"><b>${esc(displayName(c))}</b><time>${m?esc(inboxDate(m.at)):''}</time></div><div class="inbox-preview">${n?'New message':esc(inboxPreview(m))}</div></div>${n?`<span class="unread-count">${n>99?'99+':n}</span>`:''}</div>`}
function inboxView(){const contacts=[...db.contacts].sort((a,b)=>(inboxLast(b)?.at||0)-(inboxLast(a)?.at||0));return `<div class="inbox-top"><button class="profile-trigger" aria-label="Your profile and settings" onclick="openMySettings()">${avatar(db.profile)}</button><h1 class="grow">Chats</h1><div class="inbox-actions"><button class="round-action" aria-label="Search chats" onclick="document.getElementById('inboxSearch').focus()">⌕</button><button class="round-action" aria-label="New conversation" onclick="navigate('contacts')">✎</button></div></div><div class="inbox-search"><input id="inboxSearch" type="search" placeholder="Search conversations" aria-label="Search conversations" oninput="filterInbox(this.value)"></div><div class="inbox-circles">${db.contacts.map(c=>`<button class="inbox-circle" onclick="openChat('${c.id}')">${avatar(c)}<i class="circle-presence ${status(c).cls||'offline'}" aria-label="${status(c).text}" title="${status(c).text}"></i><span>${esc(displayName(c))}</span></button>`).join('')||'<span class="muted small">Your contacts will appear here.</span>'}</div><div class="inbox-quick"><button onclick="openContactPacks()">Contact Packs</button><button onclick="editContact()">+ New contact</button></div><h2 class="inbox-section-title">Messages</h2><div class="inbox-list" id="inboxList">${contacts.map(inboxItem).join('')||'<div class="inbox-empty">No conversations yet. Add a contact to start chatting.</div>'}</div><div id="inboxNoResults" class="inbox-empty hidden">No matching conversations.</div>`}
function filterInbox(query){const q=query.trim().toLowerCase();let visible=0;document.querySelectorAll('[data-inbox-search]').forEach(el=>{const show=el.dataset.inboxSearch.includes(q);el.classList.toggle('inbox-hidden',!show);if(show)visible++});document.querySelector('#inboxNoResults')?.classList.toggle('hidden',visible!==0||!q)}

function content(){if(page==='home')return inboxView();

if(page==='calls')return callsView();
 if(page==='profile')return `<button onclick="navigate('settings')" class="primary" style="float:right">⚙ Settings</button><button class="profile-back" onclick="navigate('home')">← Back to Home</button><h2>Your profile</h2><div class="card">${profileFields()}<p><button class="primary" onclick="saveProfile(false)">Save profile</button></p></div>`;
if(page==='settings')return `<button onclick="navigate('profile')">← Back to Profile</button><h2>Settings</h2><div class="card"><h3>Messages & sounds</h3><label class="row"><input style="width:auto" type="checkbox" ${db.settings.autoTexts?'checked':''} onchange="db.settings.autoTexts=this.checked;save();syncAutoTexts()"> Enable automatic fictional texts</label><p class="muted small">Characters with automatic scripted replies enabled may text you throughout an active session, including when you open another chat. Nighttime messages can say “You up?” Uses cooldowns to avoid flooding. Only while the app is open and visible.</p><label class="row"><input style="width:auto" type="checkbox" ${db.settings.autonomy?'checked':''} onchange="db.settings.autonomy=this.checked;save();syncAutoTexts()"> Character Autonomy — let characters text first and double-text</label><p class="muted small">When enabled alongside automatic fictional texts, eligible characters can send more frequent, sometimes consecutive messages, including affectionate notes and original poems. Only while Dimensionz is open and visible. Turn this off anytime for quieter chats.</p><label class="row"><input style="width:auto" type="checkbox" ${db.settings.sounds?'checked':''} onchange="db.settings.sounds=this.checked;save()"> Play sound effects</label></div><div class="card"><h3>Dimensions</h3>${db.dimensions.map(d=>`<div class="row" style="margin:8px 0"><span class="grow">${esc(d)}</span>${DIM.includes(d)?'<span class="badge">Built-in</span>':`<button onclick="renameDimension('${esc(d)}')">Rename</button><button class="danger" onclick="deleteDimension('${esc(d)}')">Delete</button>`}</div>`).join('')}<div class="notice">Dimensions inspired by The Hardly Human Novels by Bia Contino</div><p><button onclick="addDimension()">+ Add dimension</button></p></div><div class="card"><h3>Backup & restore</h3><p class="muted small">Backups may contain private chats and photos. Keep them somewhere safe.</p><button onclick="backup()">Download backup</button><label>Restore backup</label><input type="file" accept="application/json" onchange="restoreBackup(this.files[0])"></div><div class="card"><h3>About</h3><p>Dimensionz is not AI generated. All conversations are fictional and manually created or scripted.</p><button onclick="playIntro(true)">Replay opening</button></div>`;
if(page==='library')return libraryView();return ''}

function openContactPacks(){const packs=CONTACT_PACKS;$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><h2 class="grow">Contact Packs</h2><button onclick="closeModal()">✕</button></div><p class="muted small">Select characters to add to your contacts. Ryan-Lucas is unavailable.</p>${packs.map(pack=>`<h3>${esc(pack.name)}</h3>${pack.contacts.map(c=>{const installed=db.contacts.some(x=>x.packKey===c.key||(x.name.toLowerCase()===c.name.toLowerCase()&&x.dimension===c.dimension));return c.unavailable?`<button type="button" class="pack-item unavailable-pack" onclick="ryanTeaser()" style="width:100%;text-align:left"><span style="font-size:22px">♡</span><div class="grow"><b>${esc(c.name)} ♂️</b><div class="contact-bio">Unavailable · Tap to learn more</div></div></button>`:`<label class="pack-item"><input type="checkbox" class="pack-check" value="${c.key}" ${installed?'disabled':''}><div class="grow"><b>${esc(c.name)} ${c.gender==='female'?'♀️':'♂️'}</b><div class="contact-bio">${esc(c.dimension)}${installed?' · Already added':''}</div></div></label>`}).join('')}`).join('')}<div class="dialog-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="importPackContacts()">Download Selected</button></div></div></div>`}

function importPackContacts(){const keys=[...document.querySelectorAll('.pack-check:checked')].map(x=>x.value);if(!keys.length)return alert('Select at least one contact.');let count=0;for(const pack of CONTACT_PACKS){for(const entry of pack.contacts){if(entry.unavailable||!keys.includes(entry.key)||db.contacts.some(x=>x.packKey===entry.key||(x.name.toLowerCase()===entry.name.toLowerCase()&&x.dimension===entry.dimension)))continue;const c={id:uid(),packKey:entry.key,name:entry.name,gender:entry.gender,age:entry.age,dimension:entry.dimension,relationship:entry.relationship,notes:entry.notes,photo:'',lastActivity:0,auto:false};db.contacts.push(c);db.messages[c.id]=[];count++}}save();closeModal();page='contacts';selected=null;render();alert(count+' contact'+(count===1?'':'s')+' added!')}
function contactRow(c){return `<div class="contact" onclick="openChat('${c.id}')" style="margin:12px 0">${avatar(c)}<div><b>${esc(c.name)}</b><div class="muted small">${esc(c.dimension)}</div></div></div>`}
function navigate(p){page=p;selected=null;multiSelect=false;selectedMessages.clear();render()}

function genderButtons(g){return `<div class="gender">${[['female','♀️'],['male','♂️'],['unknown','⁉️']].map(([v,l])=>`<button type="button" data-g="${v}" class="${g===v?'selected':''}" onclick="pickGender(this)">${l}</button>`).join('')}</div>`}
function pickGender(el){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===el))}
function getGender(scope=document){return scope.querySelector('.gender .selected')?.dataset.g||'unknown'}
async function compress(file){if(!file)return '';return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,600/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(u);resolve(canvas.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=u})}
async function saveProfile(first=false){const name=$('#pname').value.trim();if(!name)return alert('Please enter your name.');const age=$('#page').value.trim(),dob=$('#pdob').value;if(age!==''&&(!Number.isInteger(Number(age))||Number(age)<0||Number(age)>120))return alert('Enter a valid age.');if(!dob)return alert('Please enter your birthday.');db.profile.name=name;db.profile.age=age;db.profile.gender=getGender();db.profile.dob=dob;db.profile.dimension=$('#pdim').value;db.profile.favoriteColor=chosenColor();const f=$('#pphoto').files[0];if(f)db.profile.photo=await compress(f);db.settings.profileSetupComplete=true;save();if(first)page='home';render();if(!first)showSavedProfile()}
function showSavedProfile(){$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal success-dialog" role="dialog" aria-modal="true"><div class="success-symbol">✓</div><h2>Profile Saved</h2><p class="muted">Your profile and favorite-color theme have been updated.</p><button class="primary" onclick="closeModal()">Done</button></div></div>`}
const RELATIONSHIP_GROUPS={
  'Family':['Mother','Father','Mom','Dad','Stepmother','Stepfather','Sister','Brother','Stepsister','Stepbrother','Half-sister','Half-brother','Daughter','Son','Child','Grandmother','Grandfather','Granddaughter','Grandson','Aunt','Uncle','Niece','Nephew','Cousin','Parent','Sibling','Guardian','In-law','Other Family'],
  'Friends & Social':['Friend','Best Friend','Close Friend','Childhood Friend','Acquaintance','Roommate','Coworker','Classmate','Mentor','Neighbor'],
  'Romance':['Crush','Love Interest','Dating','Boyfriend','Girlfriend','Partner','Fiancé','Fiancée','Husband','Wife','Spouse','Ex','Ex-boyfriend','Ex-girlfriend','Ex-partner','Ex-spouse','Situationship','Complicated'],
  'Conflict & Other':['Enemy','Rival','Frenemy','Stranger','Other']
};
function relationshipOptions(current){
 const value=String(current||'').trim();
 let html='<option value="">Not specified</option>';
 const known=Object.values(RELATIONSHIP_GROUPS).flat();
 if(value&&!known.some(x=>x.toLowerCase()===value.toLowerCase()))html+=`<option value="${esc(value)}" selected>${esc(value)} (existing)</option>`;
 for(const [group,choices] of Object.entries(RELATIONSHIP_GROUPS)){
   html+=`<optgroup label="${esc(group)}">`;
   for(const choice of choices)html+=`<option value="${esc(choice)}" ${choice.toLowerCase()===value.toLowerCase()?'selected':''}>${esc(choice)}</option>`;
   html+='</optgroup>';
 }
 return html;
}
function editContact(id){const c=db.contacts.find(x=>x.id===id)||{name:'',age:'',gender:'unknown',dimension:'Dimension X',photo:'',auto:false,relationship:'',notes:''};modal=id||'new';$('#overlay').innerHTML=`<div class="modal-back"><div class="modal"><h2>${id?'Edit':'New'} contact</h2><label>Name</label><input id="cname" value="${esc(c.name)}"><label>Gender</label>${genderButtons(c.gender)}<label>Age (optional)</label><input id="cage" inputmode="numeric" value="${esc(c.age)}"><label>Character nickname (optional)</label><input id="cnickname" value="${esc(c.nickname||'')}" placeholder="What you call them"><label>What this character calls you</label><input id="ccallsyou" value="${esc(c.callsYou||'')}" placeholder="Your name, sweetheart, etc."><label>Personality</label><select id="cpersonality">${[["natural","Natural"],["caring","Caring"],["playful","Playful"],["reserved","Reserved"],["sarcastic","Sarcastic"]].map(([v,n])=>`<option value="${v}" ${((c.personality||"natural")===v)?"selected":""}>${n}</option>`).join("")}</select><label>Relationship</label><select id="crelationship">${relationshipOptions(c.relationship||'')}</select><label>Character traits (0–5)</label><div class="trait-grid">${["sarcasm","affection","protectiveness","humor","drama"].map(k=>`<label>${k[0].toUpperCase()+k.slice(1)} <select id="trait_${k}">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${Number(c.traits?.[k]??2)===n?"selected":""}>${n}</option>`).join("")}</select></label>`).join("")}</div><label>Special date (birthday or anniversary)</label><input id="cspecialdate" type="date" value="${esc(c.specialDate||'')}"><label>Special date description</label><input id="cspeciallabel" value="${esc(c.specialLabel||'Birthday')}"><label>Notes</label><textarea id="cnotes" rows="4" placeholder="Important details about this character...">${esc(c.notes||'')}</textarea><label>Dimension</label><select id="cdim">${db.dimensions.map(d=>`<option ${c.dimension===d?'selected':''}>${esc(d)}</option>`).join('')}</select><div class="muted tiny" style="margin-top:6px">Dimensions inspired by The Hardly Human Novels by Bia Contino</div><label>Photo</label><input id="cphoto" type="file" accept="image/*"><label><input type="checkbox" id="cauto" style="width:auto" ${c.auto?'checked':''}> Enable automatic scripted replies (when available)</label><div class="stack" style="margin-top:16px"><button class="primary" onclick="saveContact('${id||''}')">Save</button><button onclick="closeModal()">Cancel</button>${id?`<button class="danger" onclick="removeContact('${id}')">Delete contact</button>`:''}</div></div></div>`}
async function saveContact(id){const name=$('#cname').value.trim();if(!name)return alert('Enter a name');let c=db.contacts.find(x=>x.id===id);if(!c){c={id:uid(),lastActivity:0};db.contacts.push(c)}c.name=name;c.gender=getGender($('#overlay'));c.age=$('#cage').value;c.nickname=$('#cnickname').value.trim();c.callsYou=$('#ccallsyou').value.trim();c.personality=$('#cpersonality').value;c.relationship=$('#crelationship').value.trim();c.notes=$('#cnotes').value.trim();c.traits=Object.fromEntries(['sarcasm','affection','protectiveness','humor','drama'].map(k=>[k,Number($('#trait_'+k)?.value||2)]));c.specialDate=$('#cspecialdate')?.value||'';c.specialLabel=$('#cspeciallabel')?.value.trim()||'Birthday';c.dimension=$('#cdim').value;c.auto=$('#cauto').checked;const f=$('#cphoto').files[0];if(f)c.photo=await compress(f);db.messages[c.id]??=[];save();closeModal();if(selected===c.id){openContactProfile(c.id)}else{render()}}
function removeContact(id){const c=db.contacts.find(x=>x.id===id);if(!c)return;$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal delete-dialog" role="dialog" aria-modal="true"><div class="delete-icon">✕</div><h2>Remove ${esc(displayName(c))}?</h2><p class="muted">This removes the contact, their conversation and saved character memories from Dimensionz. This cannot be undone.</p><div class="dialog-actions"><button onclick="editContact('${id}')">Cancel</button><button class="danger" onclick="confirmRemoveContact('${id}')">Remove Contact</button></div></div></div>`}
function confirmRemoveContact(id){db.contacts=db.contacts.filter(c=>c.id!==id);delete db.messages[id];db.callHistory=(db.callHistory||[]).filter(x=>x.contactId!==id);db.scheduledCalls=(db.scheduledCalls||[]).filter(x=>x.contactId!==id);if(selected===id)selected=null;save();closeModal();render();if(typeof syncScheduledCalls==='function')syncScheduledCalls()}
function closeModal(){$('#overlay').innerHTML='';modal=null}
let inboxHoldTimer=null,inboxHoldStartX=0,inboxHoldStartY=0,inboxSuppressClick=false;
function inboxLongPressStart(e,id){if(e.touches.length!==1)return;inboxLongPressCancel();inboxHoldStartX=e.touches[0].clientX;inboxHoldStartY=e.touches[0].clientY;inboxHoldTimer=setTimeout(()=>{inboxHoldTimer=null;inboxSuppressClick=true;openClearChatDialog(id)},550)}
function inboxLongPressMove(e){if(!inboxHoldTimer||!e.touches.length)return;if(Math.abs(e.touches[0].clientX-inboxHoldStartX)>12||Math.abs(e.touches[0].clientY-inboxHoldStartY)>12)inboxLongPressCancel()}
function inboxLongPressCancel(){if(inboxHoldTimer!==null){clearTimeout(inboxHoldTimer);inboxHoldTimer=null}}
function inboxTap(e,id){if(inboxSuppressClick){inboxSuppressClick=false;e.preventDefault();return}openChat(id)}
function openClearChatDialog(id){const c=db.contacts.find(x=>x.id===id);if(!c)return;const count=(db.messages[id]||[]).length;$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal delete-dialog" role="dialog" aria-modal="true"><div class="delete-icon">✕</div><h2>Clear chat with ${esc(displayName(c))}?</h2><p class="muted">Permanently delete ${count} message${count===1?'':'s'}, including call cards and narration? The contact, nickname, character memories and profile will stay.</p><div class="dialog-actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="clearChatMessages('${id}')">Clear All Messages</button></div></div></div>`}
function clearChatMessages(id){if(!db.contacts.some(c=>c.id===id))return;db.messages[id]=[];const c=db.contacts.find(c=>c.id===id);c.lastReadAt=Date.now();save();closeModal();render()}
function openChat(id){const previous=selected;const c=db.contacts.find(x=>x.id===id);if(c){c.lastReadAt=Date.now();save()}selected=id;multiSelect=false;selectedMessages.clear();render();if(previous!==id)scheduleOtherContactNudge(id)}

function messageDayKey(at){const d=new Date(at);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function messageDayLabel(at){const d=new Date(at),today=new Date(),yesterday=new Date();yesterday.setDate(today.getDate()-1);const k=messageDayKey(at);if(k===messageDayKey(today.getTime()))return 'Today · '+d.toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});if(k===messageDayKey(yesterday.getTime()))return 'Yesterday · '+d.toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});return d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})}

function narrationCategory(text){const t=String(text||'').toLowerCase();
 if(/\b(sorry|apologiz|forgive me|my fault)\b/.test(t))return 'apology';
 if(/\b(angry|furious|pissed|mad at|hate|fight|argu|frustrat)\b/.test(t))return 'angry';
 if(/\b(sad|hurt|cry|upset|afraid|scared|lonely|worried|anxious|grief|depress|overwhelm)\b/.test(t))return 'sad';
 if(/\b(lol|lmao|haha|funny|joking|kidding|hilarious)\b|[😂🤣]/u.test(t))return 'joke';
 if(/\b(love you|miss you|hug|kiss|cuddle|sweetheart|darling)\b/.test(t))return 'affection';
 if(/\b(happy|excited|amazing|wonderful|yay|great news|good news|celebrat)\b/.test(t))return 'happy';
 if(/\b(shocked|surprised|no way|what?!|unbelievable)\b/.test(t))return 'surprise';
 if(/\b(maybe|not sure|i don't know|idk|unsure|confused)\b/.test(t))return 'uncertainty';
 if(/\b(tired|exhausted|drained|sleepy|worn out)\b/.test(t))return 'tired';
 if(/\b(dinner|lunch|breakfast|hungry|pizza|cook|bake|meal|food)\b/.test(t))return 'food';
 if(/\b(tomorrow|weekend|plan|visit|going to|meet up|trip)\b/.test(t))return 'plans';
 if(/\b(good night|goodnight|bedtime)\b/.test(t))return 'night';
 if(/^(hi|hello|hey|morning|good morning)[! .]*$/.test(t.trim()))return 'greeting';
 if(t.includes('?'))return 'question';return 'default';}
function makeNarration(id,text){const c=db.contacts.find(x=>x.id===id);if(!c?.narratorMode)return;
 const msgs=db.messages[id]||[];const kind=narrationCategory(text);const state=c.narrationState||(c.narrationState={turns:0,recent:[],lastKind:''});
 state.turns++; // Not every reply needs an action beat.
 if(state.turns%3!==1 && kind===state.lastKind)return;
 if(state.turns%2===0 && kind==='default')return;
 const options=NARRATION_BANK[kind]||NARRATION_BANK.default;
 const available=options.filter(x=>!state.recent.includes(x));const bank=available.length?available:options;
 const template=bank[Math.floor(Math.random()*bank.length)];state.recent=[...state.recent.slice(-7),template];state.lastKind=kind;
 const line=template.replaceAll('{name}',c.nickname||c.name);
 msgs.push({id:uid(),side:'narration',type:'narration',text:line,at:Date.now(),generated:true});}

function showConnectedCall(){const f=fictionalCall,c=db.contacts.find(x=>x.id===f?.contactId);if(!f||!c)return;$('#overlay').innerHTML=`<div class="fake-call" role="dialog" aria-modal="true" aria-label="Simulated call with ${esc(displayName(c))}"><div class="call-disclaimer">DIMENSIONZ · FICTIONAL SIMULATED CALL · NO REAL AUDIO CONNECTION</div><div class="call-identity">${avatar(c)}<h2>${esc(displayName(c))}</h2><div class="muted">${esc(c.dimension)}</div><div class="call-clock" id="fictionalCallClock">00:00:00</div><div class="muted small">Connected · Simulation only</div></div><div class="call-actions"><div class="call-action"><button id="fictionalMute" onclick="toggleFictionalCall('muted')" aria-pressed="false">♩</button><span>Mute</span></div><div class="call-action"><button id="fictionalSpeaker" onclick="toggleFictionalCall('speaker')" aria-pressed="false">◖))</button><span>Speaker</span></div></div><button class="call-end" onclick="endFictionalCall()" aria-label="End call">☎</button><div class="call-footer">No microphone or phone network is used.</div></div>`;clearInterval(fictionalCallTicker);fictionalCallTicker=setInterval(()=>{if(!fictionalCall)return;const el=$('#fictionalCallClock');if(el)el.textContent=callDuration(Date.now()-fictionalCall.started)},250)}
function toggleFictionalCall(key){if(!fictionalCall)return;fictionalCall[key]=!fictionalCall[key];const el=$(key==='muted'?'#fictionalMute':'#fictionalSpeaker');if(el){el.classList.toggle('on',fictionalCall[key]);el.setAttribute('aria-pressed',String(fictionalCall[key]))}}
function endFictionalCall(){if(!fictionalCall)return;if(fictionalCall.ringing)return finishRinging('declined');const f=fictionalCall;clearInterval(fictionalCallTicker);fictionalCallTicker=null;fictionalCall=null;clearTimeout(outgoingSoundCutoff);stopSound(audioFiles.outgoing);$('#overlay').innerHTML='';recordCall(f.contactId,f.direction,'completed',Date.now()-f.started);if(f.direction==='in')queueAfterCallText(f.contactId,'completed');syncScheduledCalls()}
function queueAfterCallText(id,status){const c=db.contacts.find(x=>x.id===id);if(!c||c.blocked==='receive')return;const lines=status==='missed'?["I called you... Guess you were busy.","I tried calling you. Text me when you can."]:status==='declined'?["I called you... Maybe we can talk later.","I tried calling. Everything okay?"]:["I called you... It was nice talking to you.","I'm glad we got to talk."];const text=lines[Math.floor(Math.random()*lines.length)];setTimeout(()=>{if(!db.contacts.some(x=>x.id===id))return;queueIncoming(id,text,350)},4000)}

const FOLLOWUPS=['Hey, are you still there?','Just checking in.','Did you see my message?','No rush, just wanted to hear from you.','Everything okay?'];
function scheduleFollowup(id){const c=db.contacts.find(x=>x.id===id);if(!db.settings.autoTexts||!c?.auto||c.followupPending||c.followupSent||c.blocked==='receive')return;c.followupPending=true;c.followupAt=Date.now()+90000;save();}
// Proactive fictional texts: only while the app is visible and auto-texts are enabled.
// Per-contact and global cooldowns prevent floods and repeated interruptions.
const PROACTIVE_LINES={
 late:["You up?","Still awake?","Can't sleep either?","Hey, you still up?","Thinking about you. 🥺"],
 morning:["Good morning! ☀️","Morning! How'd you sleep?","You awake yet?","Hey! Hope your morning's going okay."],
 afternoon:["Hey, how's your day going?","What are you up to?","Just checking in 💕","Got a minute to talk?"],
 evening:["Hey, how's your evening?","What are you doing tonight?","You around?","I've been meaning to text you."],
 neutral:["Hey, you around?","What's up?","Thought I'd check in.","Got a minute?"]
};
// Optional autonomous scripted conversations: no AI, background service, or network.
const DZ_AUTONOMY_NOTES={
 casual:["Just thought I'd say hello.","Something reminded me of you today.","Hope your day has been kind to you.","Got a moment? I've been meaning to talk.","You crossed my mind just now."],
 protective:["Just checking in. You doing alright?","Have you had a chance to rest?","You made it through the day okay?","You don't have to answer right away. Just making sure you're okay.","I hope you're taking care of yourself."],
 romantic:["Thinking of you. 💕","I wish I could steal a little more time with you. 🥺","You have a way of staying on my mind.","A little reminder: you matter to me. ❤️","If I could send a hug through a message, I would. 🫂"],
 poem:["A quiet sky, a distant star,\nA little wish for where you are.\nMay gentle moments find you there,\nAnd leave you knowing someone cares. 💕","Between the dusk and morning light,\nI hope your heart feels warm tonight.\nAcross the miles, however far,\nYou shine as brightly as a star. ✨","If words were petals, soft and true,\nI'd gather every one for you.\nNot for a grand or perfect show,\nJust so you'd always, always know. ❤️"]
};
function dzRomanticContact(c){return /^(partner|spouse|husband|wife|boyfriend|girlfriend|fianc[eé]e?|crush|ex|lover|dating|romantic interest)$/i.test(String(c.relationship||'').trim())}
function dzAutonomyLine(c){
 const traits=c.traits||{},protect=Number(traits.protectiveness??2),affection=Number(traits.affection??2);
 let pools=[...DZ_AUTONOMY_NOTES.casual];
 if(protect>=3)pools.push(...DZ_AUTONOMY_NOTES.protective,...(protect>=4?DZ_AUTONOMY_NOTES.protective:[]));
 if(dzRomanticContact(c)&&affection>=2){pools.push(...DZ_AUTONOMY_NOTES.romantic);if(Math.random()<.22)pools.push(...DZ_AUTONOMY_NOTES.poem)}
 return killianVoice(c,pools[Math.floor(Math.random()*pools.length)],'');
}
function dzAutonomyInterval(c){const protect=Number(c.traits?.protectiveness??2);return Math.max(45000,(210-protect*26)*1000)}
function dzAutonomyTick(){
 if(!db.settings.autoTexts||!db.settings.autonomy||document.visibilityState!=='visible'||fictionalCall||storyRunning)return;
 const now=Date.now();
 // An autonomy session may have more than one character texting, but not all at once.
 if(now-(db.settings.lastAutonomyAt||0)<40000)return;
 const candidates=db.contacts.filter(c=>{
  if(!c.auto||c.sitter||c.dimension==='Heaven'||c.blocked==='receive'||c.id===selected)return false;
  if(now-(c.autonomyAt||0)<dzAutonomyInterval(c))return false;
  const msgs=db.messages[c.id]||[],last=msgs[msgs.length-1];
  if(last?.side==='out'&&now-last.at<25000)return false;
  return true;
 });
 if(!candidates.length)return;
 // High-protectiveness characters are more likely to initiate a check-in.
 const weighted=candidates.flatMap(c=>Array(Math.max(1,Number(c.traits?.protectiveness??2)+1)).fill(c));
 const c=weighted[Math.floor(Math.random()*weighted.length)];
 const line=dzAutonomyLine(c);c.autonomyAt=now;db.settings.lastAutonomyAt=now;save();
 queueIncoming(c.id,line,500+Math.floor(Math.random()*1400));
 // Occasional double text; bounded to avoid an endless flood.
 if(Math.random()<.32){setTimeout(()=>{
  if(!db.settings.autonomy||!db.settings.autoTexts||document.visibilityState!=='visible'||fictionalCall)return;
  const msgs=db.messages[c.id]||[],last=msgs[msgs.length-1];
  if(last?.side!=='in')return;
  const extra=dzRomanticContact(c)?'💕':'Just wanted to check in.';
  queueIncoming(c.id,killianVoice(c,extra,''),500);
 },4500+Math.floor(Math.random()*4500))}
}
function proactivePeriod(){const h=new Date().getHours();return h>=22||h<5?'late':h<11?'morning':h<17?'afternoon':'evening'}
function eligibleAutoContact(c,excludedId=''){
 if(!c||c.id===excludedId||!c.auto||c.sitter||c.dimension==='Heaven'||c.blocked==='receive')return false;
 const now=Date.now(),msgs=db.messages[c.id]||[],last=msgs[msgs.length-1];
 if(c.proactiveAt&&now-c.proactiveAt<(db.settings.autonomy?5:45)*60*1000)return false;
 // Don't interrupt an active back-and-forth or pile texts onto an unanswered message.
 if(last?.side==='in'&&now-last.at<(db.settings.autonomy?1:30)*60*1000)return false;
 if(last?.side==='out'&&now-last.at<4*60*1000)return false;
 if(c.followupPending)return false;
 return true;
}
function sendProactiveText(c,reason='idle'){
 if(!db.settings.autoTexts||document.visibilityState!=='visible'||fictionalCall||!eligibleAutoContact(c,selected))return false;
 const now=Date.now();if(db.settings.lastProactiveAt&&now-db.settings.lastProactiveAt<(db.settings.autonomy?2:6)*60*1000)return false;
 const period=proactivePeriod(),choices=PROACTIVE_LINES[period];
 let text=choices[Math.floor(Math.random()*choices.length)];
 const occasion=dzSpecialOccasion(c);if(occasion)text=occasion;else if(db.settings.autonomy&&Math.random()<.6)text=dzAutonomyLine(c);else if(Math.random()<.42)text=dzStartStory(c);
 if(reason==='other-chat'&&period==='late')text=['You up?','Still awake?','Hey, you up?'][Math.floor(Math.random()*3)];
 text=killianVoice(c,text,'');
 c.proactiveAt=now;db.settings.lastProactiveAt=now;save();queueIncoming(c.id,text,1000+Math.floor(Math.random()*2200));return true;
}
let otherChatNudgeTimer=null;
function scheduleOtherContactNudge(openedId){
 clearTimeout(otherChatNudgeTimer);
 if(!db.settings.autoTexts||document.visibilityState!=='visible'||fictionalCall)return;
 const eligible=db.contacts.filter(c=>eligibleAutoContact(c,openedId));
 if(!eligible.length)return;
 // A separate contact may grab attention shortly after you open a conversation.
 otherChatNudgeTimer=setTimeout(()=>{
  if(!db.settings.autoTexts||selected!==openedId||document.visibilityState!=='visible')return;
  const options=db.contacts.filter(c=>eligibleAutoContact(c,openedId));
  if(options.length)sendProactiveText(options[Math.floor(Math.random()*options.length)],'other-chat');
 },9000+Math.floor(Math.random()*9000));
}
function syncAutoTexts(){
 clearInterval(autoTextTimer);clearTimeout(otherChatNudgeTimer);
 if(!db.settings.autoTexts)return;
 autoTextTimer=setInterval(()=>{
  if(document.visibilityState!=='visible'||fictionalCall)return;
  for(const c of db.contacts){
   if(!c.auto||c.blocked==='receive')continue;
   const msgs=db.messages[c.id]||[],last=msgs[msgs.length-1];
   if(c.followupPending&&Date.now()>=c.followupAt){
    c.followupPending=false;c.followupSent=true;
    if(last?.side==='in'&&last.type==='text'){queueIncoming(c.id,FOLLOWUPS[Math.floor(Math.random()*FOLLOWUPS.length)],300);save()}
   }
  }
  dzAutonomyTick();
  // Once every few minutes, an eligible contact may initiate a new conversation.
  // This works with existing chats too, not just brand-new empty conversations.
  const now=Date.now();
  if(!db.settings.lastProactiveAt||now-db.settings.lastProactiveAt>=(db.settings.autonomy?3:12)*60*1000){
   const eligible=db.contacts.filter(c=>eligibleAutoContact(c,selected));
   if(eligible.length)sendProactiveText(eligible[Math.floor(Math.random()*eligible.length)]);
  }
 },5000);
}

// Dimensionz Conversation Upgrade: local scripted context, story hooks, personality,
// reactions, special dates and opt-in relationship progression. No network/AI.
const DZ_STORY_STARTS=[
 {start:'You would not believe the day I had.',topic:'stress',detail:['One thing went wrong after another. I needed a minute to myself.','A plan fell apart at the worst possible moment. I was frustrated, but I managed.']},
 {start:'Something funny happened earlier. 😂',topic:'funny',detail:['I made a complete fool of myself in front of everyone.','I laughed at the worst possible time and could not stop.']},
 {start:'I have something on my mind.',topic:'thought',detail:['I have been thinking about the choices we make, and what they mean.','Sometimes the quiet moments make you think about everything.']},
 {start:'Today was actually rather nice.',topic:'good',detail:['I finally got a chance to relax. It was exactly what I needed.','Nothing dramatic happened for once, and I enjoyed the peace.']}
];
function dzStartStory(c){
 const pool=DZ_STORY_STARTS;const story=pool[Math.floor(Math.random()*pool.length)];
 c.dzStory={topic:story.topic,start:story.start,detail:story.detail[Math.floor(Math.random()*story.detail.length)],at:Date.now(),answered:false};save();return story.start;
}
function dzSpecialOccasion(c){
 if(!c.specialDate)return '';
 const today=new Date(),d=new Date(c.specialDate+'T12:00:00');
 if(d.getMonth()!==today.getMonth()||d.getDate()!==today.getDate())return '';
 const key=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();
 if(c.dzOccasionSent===key)return '';
 c.dzOccasionSent=key;
 const label=(c.specialLabel||'Birthday').toLowerCase();
 return label.includes('annivers')?'I remembered our anniversary today. ❤️':label.includes('birth')?'Happy birthday! I remembered. 🎂':`I remembered today is ${c.specialLabel||'a special day'}. 💕`;
}
function dzContinuity(c,raw,history=[]){
 const s=String(raw).trim().toLowerCase().replace(/[’]/g,"'");
 const recent=history.filter(m=>m.type==='text'&&!m.deleted).slice(-9);
 const lastIn=[...recent].reverse().find(m=>m.side==='in');
 const prev=(lastIn?.text||'').toLowerCase();
 const story=c.dzStory;
 const askWhy=/^(?:what happened|what happened\??|why|how come|tell me more|what do you mean|what's wrong|what was it|what went wrong)[?!. ]*$/i.test(s);
 if(story&&Date.now()-story.at<60*60*1000&&!story.answered&&askWhy){story.answered=true;save();return story.detail;}
 if(askWhy&&/stress|rough|frustrat|difficult|hard day|one thing after another/.test(prev))return isKillian(c)?'Bloody hell, just one frustration after another. I needed a moment to clear my head.':'A few things went wrong, one after another. I needed a little time to unwind.';
 if(askWhy&&/funny|laugh|hilarious|ridiculous/.test(prev))return dzFinalPick(c,'funny-follow',['I waved at someone who was actually waving at the person behind me. 😂','I walked into the wrong room and kept talking for a full minute before I noticed.','I spilled a drink while trying to look impressive. So much for that. 😂'],history);
 if(askWhy&&/nice|great|good day|wonderful/.test(prev))return 'I finally had a little peace and quiet. It felt good.';
 if(/^(?:perfectly said|well said|beautifully said|that's beautiful|that was sweet|so sweet|i appreciate that|thank you for saying that)[! .]*$/i.test(s))return isKillian(c)?'Aye. I meant every word. ❤️':'I meant it. ❤️';
 if(/^(?:of course i do|i do too|me too|same here|i wish i was|i wish you were)[! .]*$/i.test(s)&&/miss|wish|love|care|want you/.test(prev))return '🥺💕';
 if(/\b(?:wish i was there|wish you were here|wish i were with you|wish we were together)\b/i.test(s))return '🥺💕';
 if(/^(?:are you okay|you okay|everything okay)[?!. ]*$/i.test(s)&&/stress|rough|frustrat|difficult|hard/.test(prev))return 'I will be. Just a frustrating day. Thank you for asking.';
 return null;
}
function dzPersonalityPolish(c,reply,input){
 if(!reply||!/\p{L}/u.test(reply))return reply;
 const t=c.traits||{},aff=Number(t.affection??2),sar=Number(t.sarcasm??2),hum=Number(t.humor??2),drama=Number(t.drama??2);
 const msg=String(input||'').toLowerCase();
 if(/^(?:i'm listening|i am listening|go on|i'm following\. go on\.)[.! ]*$/i.test(reply)&&/\b(?:perfectly said|well said|thank you|appreciate|love that|that's sweet)\b/.test(msg))return '❤️';
 if(aff>=4&&/\b(?:miss you|love you|wish you were here)\b/.test(msg)&&Math.random()<.28)return '🥺💕';
 if(sar>=4&&/\b(?:ridiculous|annoying|frustrating)\b/.test(msg)&&Math.random()<.2)return isKillian(c)?'Bloody hell, you can say that again.':'Well, that sounds delightful. 🙄';
 if(hum>=4&&/[😂🤣]/u.test(msg)&&Math.random()<.25)return '😂';
 if(drama>=4&&/\b(?:unbelievable|shocking)\b/.test(msg)&&Math.random()<.2)return 'You cannot be serious!';
 return reply;
}

function dzSuggestRelationship(id,newRelationship){const c=db.contacts.find(x=>x.id===id);if(!c)return;$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Relationship suggestion</h3><p>Change ${esc(displayName(c))}'s relationship from <b>${esc(c.relationship||'Not specified')}</b> to <b>${esc(newRelationship)}</b>?</p><p class="muted small">Nothing changes without your approval.</p><button class="primary" onclick="dzApproveRelationship('${id}','${esc(newRelationship)}')">Approve change</button><button onclick="closeModal()">Keep current relationship</button></div></div>`}
function dzApproveRelationship(id,value){const c=db.contacts.find(x=>x.id===id);if(c){c.relationship=value;save()}closeModal();if(selected===id)renderChat($('#app'));else render()}

render();playIntro();syncScheduledCalls();if(!db.settings.lastProactiveAt||Date.now()-db.settings.lastProactiveAt>12*60*1000){db.settings.lastProactiveAt=Date.now();save()}syncAutoTexts();setInterval(refreshReceipts,350);setInterval(()=>{if(selected&&!storyRunning){const c=db.contacts.find(c=>c.id===selected);const el=document.querySelector('.chat-head .muted');if(c&&el){const s=status(c);el.innerHTML=`<span class="status ${s.cls}"></span>${s.text} · ${esc(c.dimension)}`}}},30000);
</script></body></html>
