let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()};db={...initial(),...db};db.profile??=initial().profile;db.library??=initial().library;db.dimensions??=[...DIM];db.messages??={};db.contacts??=[];db.sessions??=[];db.settings??={introSeen:false};db.profile={...initial().profile,...db.profile};db.settings.developerUnlocked??=false;db.settings.localAIEnabled??=false;

function inboxDate(t){if(!t)return '';const d=new Date(t),now=new Date();if(messageDayKey(t)===messageDayKey(now.getTime()))return time(t);const y=new Date(now);y.setDate(y.getDate()-1);if(messageDayKey(t)===messageDayKey(y.getTime()))return 'Yesterday';return d.toLocaleDateString([],{month:'short',day:'numeric'})}

async function compress(file){if(!file)return '';return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,600/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(u);resolve(canvas.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=u})}

function messageDayKey(at){const d=new Date(at);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function messageDayLabel(at){const d=new Date(at),today=new Date(),yesterday=new Date();yesterday.setDate(today.getDate()-1);const k=messageDayKey(at);if(k===messageDayKey(today.getTime()))return 'Today · '+d.toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});if(k===messageDayKey(yesterday.getTime()))return 'Yesterday · '+d.toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});return d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function chatMessagesHTML(messages){let previousDay=null;return messages.map(m=>{const day=messageDayKey(m.at);const divider=day!==previousDay?`<div class="day-divider" role="separator">${esc(messageDayLabel(m.at))}</div>`:'';previousDay=day;return divider+messageHTML(m)}).join('')}

function linkify(t){return esc(t).replace(/\*([^*\n]+)\*/g,(_,content)=>'<em>'+content+'</em>').replace(/https:\/\/www\.crisistextline\.org\/?/gi,'<a class="link" href="https://www.crisistextline.org/" target="_blank" rel="noopener noreferrer">crisistextline.org</a>')}

// Fully offline, template-driven fictional narration; not AI-generated.
// Narration v2: grounded in the actual message, varied and deliberately occasional.
const NARRATION_BANK={
 greeting:['{name} greets the message with an easy smile.','The exchange begins on a light note.','{name} settles into the conversation.','A familiar warmth enters the exchange.'],
 sad:['The conversation grows quieter.','{name} pauses, taking the words seriously.','A more careful tone settles over the exchange.','The moment calls for patience rather than a quick answer.','{name} takes a moment before replying.'],
 happy:['The mood brightens noticeably.','{name} seems caught up in the excitement.','A little enthusiasm spills into the conversation.','The good news changes the tone of the exchange.'],
 angry:['The tension is hard to miss.','{name} takes a moment before responding to the frustration.','The conversation takes a sharper turn.','A difficult silence follows the words.'],
 question:['{name} considers the question.','The question hangs for a beat before the reply.','{name} takes a moment to think it through.'],
 affection:['A softer warmth settles into the conversation.','{name} seems touched by the affection.','The exchange takes on a tender note.'],
 joke:['The mood turns playful.','A little humor breaks up the conversation.','{name} seems amused.','The exchange takes on a teasing rhythm.'],
 apology:['The apology shifts the tone of the conversation.','{name} takes a moment to consider the apology.','The moment feels a little more tentative.'],
 food:['The conversation turns to food.','{name} seems interested in the meal being described.','A lighter, everyday topic takes over.'],
 plans:['The discussion turns toward what comes next.','{name} considers the possibility.','A sense of anticipation enters the conversation.'],
 tired:['The conversation slows to a gentler pace.','{name} seems to notice the exhaustion behind the words.','A quieter mood settles over the exchange.'],
 night:['The conversation takes on a late-night stillness.','The exchange slows as the day winds down.'],
 surprise:['{name} seems taken aback for a moment.','The unexpected news changes the mood.','A surprised pause follows.'],
 uncertainty:['A moment of uncertainty hangs between the messages.','{name} seems to weigh the possibilities.','Neither answer feels entirely settled yet.'],
 default:['The conversation moves forward.','A brief pause separates the messages.','{name} considers what was said.','The exchange continues at an unhurried pace.']
};
function narrationCategory(text){const t=String(text||'').toLowerCase();
 if(/\b(sorry|apologiz|forgive me|my fault)\b/.test(t))return 'apology';
 if(/\b(angry|furious|pissed|mad at|hate|fight|argu|frustrat)\b/.test(t))return 'angry';
 if(/\b(sad|hurt|cry|upset|afraid|scared|lonely|worried|anxious|grief|depress|overwhelm)\b/.test(t))return 'sad';
 if(/\b(lol|lmao|haha|funny|joking|kidding|hilarious)\b|[😂🤣]/u.test(t))return 'joke';
 if(/\b(love you|miss you|hug|kiss|cuddle|sweetheart|darling)\b/.test(t))return 'affection';
 if(/\b(happy|excited|amazing|wonderful|yay|great news|good news|celebrat)\b/.test(t))return 'happy';
 if(/\b(shocked|surprised|no way|what?!|unbelievable)\b/.test(t))return 'surprise';
 if(/\b(maybe|not sure|i don't know|idk|unsure|confused)\b/.test(t))return 'uncertainty';
 if(/\b(tired|exhausted|drained|sleepy|worn out)\b/.test(t))return 'tired';
 if(/\b(dinner|lunch|breakfast|hungry|pizza|cook|bake|meal|food)\b/.test(t))return 'food';
 if(/\b(tomorrow|weekend|plan|visit|going to|meet up|trip)\b/.test(t))return 'plans';
 if(/\b(good night|goodnight|bedtime)\b/.test(t))return 'night';
 if(/^(hi|hello|hey|morning|good morning)[! .]*$/.test(t.trim()))return 'greeting';
 if(t.includes('?'))return 'question';return 'default';}
function makeNarration(id,text){const c=db.contacts.find(x=>x.id===id);if(!c?.narratorMode)return;
 const msgs=db.messages[id]||[];const kind=narrationCategory(text);const state=c.narrationState||(c.narrationState={turns:0,recent:[],lastKind:''});
 state.turns++; // Not every reply needs an action beat.
 if(state.turns%3!==1 && kind===state.lastKind)return;
 if(state.turns%2===0 && kind==='default')return;
 const options=NARRATION_BANK[kind]||NARRATION_BANK.default;
 const available=options.filter(x=>!state.recent.includes(x));const bank=available.length?available:options;
 const template=bank[Math.floor(Math.random()*bank.length)];state.recent=[...state.recent.slice(-7),template];state.lastKind=kind;

function expandedDialogue(c,input){const t=String(input||'').trim();if(t.length<9)return null;
 for(const [topic,bank] of Object.entries(EXPANDED_TOPICS)){
  if(!bank.words.test(t))continue;
  const st=c.scriptState||(c.scriptState={});const recent=st.expandedRecent||[];
  const subject=bank.subjects[Math.floor(Math.random()*bank.subjects.length)];
  const candidates=[];for(const a of bank.open)for(const b of bank.follow){const line=a.replaceAll('{subject}',subject)+' '+b;if(!recent.includes(line))candidates.push(line)}
  const line=candidates[Math.floor(Math.random()*candidates.length)]||bank.open[0].replaceAll('{subject}',subject);
  st.expandedRecent=[...recent.slice(-24),line];st.topic=topic;st.turns=(st.turns||0)+1;return line;
 }return null;
}

function engineV4(c,input,history=[]){
 const raw=String(input||'').trim(),s=raw.toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' '),plain=s.replace(/[.!?…\s]+$/g,'').trim();
 const st=c.scriptState||(c.scriptState={}),recent=[...history].filter(x=>x.type==='text'&&x.text),lastIncoming=recent.slice().reverse().find(x=>x.side==='in');

 const deep=deepDialogue(c,raw,history);if(deep)return deep;

 // One-word responses must refer to the previous question, not launch a new topic.
 if(exact(/^(?:what|huh|wdym|what do you mean|about what|what exactly|come again|explain|why do you ask)$/)){
  if(/curious/.test(prev))return say('clarify',["I meant I wanted to know what you were thinking about.","Sorry, that came out oddly. I was asking what was on your mind."]);
  if(/\b(day|week)\b/.test(prev))return say('clarify',[`I was asking how your ${/week/.test(prev)?'week':'day'} went.`,`Sorry, I meant what happened during your ${/week/.test(prev)?'week':'day'}.`]);
  if(/miss/.test(prev))return say('clarify',["I meant that I really miss you. I wasn't kidding.","I miss talking to you. That's what I meant."]);
  if(/mad|angry|upset|frustrat/.test(prev))return say('clarify',["I was trying to explain how I feel. I don't want us to fight.","I meant that I'd rather talk it out than stay upset."]);
  return say('clarify',["Sorry, I wasn't clear. I meant what I said about our conversation.","I worded that badly. I was responding to what you told me."]);
 }
 if(exact(/^(?:why|how come|but why)$/)){
  if(/miss|love|care/.test(prev))return say('why',["Because you matter to me.","Because I genuinely care about you."]);
  if(/mad|upset|angry/.test(prev))return say('why',["Because I want to work through this instead of fighting.","I think we misunderstood each other."]);
  return say('why',["Because that's how I felt about what we were discussing.","I guess I should explain my reasoning better."]);
 }
 if(exact(/^(?:really|seriously|are you sure|you sure|promise|for real)$/))return say('confirm',["Yes, I mean it.","I'm serious. I wouldn't say it otherwise.","I am. I want to be honest with you."]);
 if(exact(/^(?:and you|what about you|how about you)$/)){
  const context=st.engineIntent||'';
  if(/week/.test(prev)||/week/.test(context))return say('week');
  if(/day/.test(prev)||/day/.test(context))return say('day');
  return say('mood');
 }
 if(exact(/^(?:yes|yeah|yep|sure|okay|ok|absolutely|definitely)$/))return say('agreement');
 if(exact(/^(?:no|nope|nah|not really)$/))return say('disagreement');
 if(exact(/^(?:that's fair|fair enough|makes sense|i understand|i get it|that's true)$/))return say('agreement',["Thanks for hearing me out.","I appreciate that.","I'm glad we understand each other."]);
 // Specific questions take precedence over loose keywords and sentiment.
 if(has(/\b(?:are you|you still|still)\s+(?:awake|up)\b|\b(?:you awake|u awake|you up)\b/))return say('awake');
 if(has(/\b(?:are you|you)\s+(?:sleeping|asleep|going to bed)\b/))return say('asleep');
 if(has(/\b(?:did you|have you)\s+(?:eat|eaten|have (?:breakfast|lunch|dinner))\b/))return say('eating');
 if(has(/\b(?:how (?:was|is|has) (?:your|the) (?:day|today)|how(?:'s| has) your day|did you have (?:a )?(?:good|bad|nice|rough) day|how did your day go|was your day (?:good|bad|okay))\b/))return say('day');
 if(has(/\b(?:how (?:was|is|has) your week|how(?:'s| has) your week|did you have (?:a )?(?:good|bad|nice|rough) week|how did your week go|was your week (?:good|bad|okay))\b/))return say('week');
 if(has(/\b(?:how are you|how're you|how have you been|how've you been|how do you feel|how are you feeling|are you (?:okay|alright|good))\b/))return say('mood');
 if(has(/\b(?:what are you doing|what're you doing|what you doing|wyd|what are you up to|whatcha doing)\b/))return say('doing');
 if(has(/\b(?:where are you|where you at|where're you)\b/))return say('location');
 if(has(/\b(?:are you (?:mad|angry|upset|annoyed|disappointed) (?:at|with) me|did i (?:upset you|make you mad)|do you hate me)\b/))return say('mad');
 if(has(/\b(?:do you|you do|you really|you still|did you|are you)\b.{0,28}\bmiss\b|\bmiss me\b|\byou miss me\b/))return say('miss',romantic?ENGINE_V4.miss:["Of course I miss talking to you.","Yeah, I've missed you!","I do. It's nice hearing from you."]);
 if(has(/\b(?:do you|you really|you still|you do)\b.{0,24}\blove\b|\blove me\b/))return say('love',romantic?ENGINE_V4.love:["Of course I care about you.","You mean a lot to me.","Absolutely. You're important to me."]);
 if(has(/\b(?:do you care|you care about me|do i matter to you)\b/))return say('care');
 if(has(/\b(?:are you proud|proud of me)\b/))return say('proud');
 if(has(/\b(?:do you trust me|can you trust me)\b/))return say('trust');
 if(has(/\b(?:are you sorry|will you apologize|can you apologize)\b/))return say('apologize');
 if(has(/\b(?:do you forgive me|can you forgive me)\b/))return say('forgive');
 if(has(/\b(?:what (?:should|can) (?:we|i) (?:eat|cook)|what's for dinner)\b/))return say('hungry');
 if(has(/\b(?:what are your plans|got any plans|what are you doing (?:tomorrow|tonight|this weekend))\b/))return say('plans');
 // Either/or must actually choose one of the offered options.
 const options=pickChoice(raw);if(options&&/\b(?:or)\b/i.test(raw)){const choice=options[Math.floor(Math.random()*2)];return say('choice',[`I'd choose ${choice}. What about you?`,`Definitely ${choice}.`,`I think ${choice} sounds better.`])}

 if(has(/\b(?:my day|my week|today|this week)\b.{0,35}\b(?:bad|rough|awful|terrible|shitty|sucked)\b|\b(?:had a|having a) (?:bad|rough|awful|terrible|shitty) (?:day|week)\b/))return say('negative');
 if(has(/\b(?:my day|my week|today|this week)\b.{0,35}\b(?:great|good|amazing|wonderful)\b/))return say('positive');
 if(has(/\b(?:i miss you|missed you|missing you)\b/))return say('miss',romantic?ENGINE_V4.miss:["I miss you too!","It's really good to hear from you."]);
 if(has(/\b(?:i love you|love you)\b/))return say('love',romantic?ENGINE_V4.love:["Love you too!","That means a lot to me."]);
 if(has(/\b(?:i'm lonely|i feel lonely|feeling alone)\b/))return say('lonely');
 if(has(/\b(?:sad|crying|upset|anxious|overwhelmed|depressed|scared|worried|heartbroken)\b|[😢😭😔😞]/u))return say('negative');
 if(has(/\b(?:happy|excited|good news|great news|amazing news|celebrating)\b|[🥳🎉]/u))return say('positive');
 if(has(/\b(?:tired|exhausted|sleepy|drained|can't sleep|cannot sleep|insomnia)\b/))return say('tired');
 if(has(/\b(?:hungry|starving|craving|what to eat)\b/))return say('hungry');
 const expanded=expandedDialogue(c,raw);if(expanded)return expanded;
 if(has(/\b(?:work|job|boss|coworker|shift|office)\b/))return say('work');
 if(has(/\b(?:school|homework|class|teacher|exam|college|studying)\b/))return say('school');
 if(has(/\b(?:sick|ill|fever|headache|nauseous|not feeling well)\b/))return say('sick');
 if(has(/\b(?:bored|nothing to do)\b/))return say('bored');
 if(has(/\b(?:thanks|thank you|thank u)\b/))return say('thank');
 if(has(/\b(?:i'm sorry|im sorry|my bad|i apologize)\b/))return say('forgive');
 if(has(/\b(?:good morning|morning|gm)\b/))return say('morning');
 if(has(/\b(?:good night|goodnight|sweet dreams|gn)\b/))return say('night');
 if(has(/\b(?:goodbye|bye|see you|talk later|gotta go)\b/))return say('goodbye');
 if(has(/^(?:hi|hello|hey|heyy|hiya|sup)[! .]*$/))return say('greeting');
 if(has(/\b(?:weather|rain|snow|sunny|storm)\b/))return say('weather');
 if(has(/\b(?:music|song|playlist|singing)\b/))return say('music');
 if(has(/\b(?:movie|show|watching|netflix|television)\b/))return say('movie');
 if(has(/\b(?:pet|dog|cat|puppy|kitten)\b/))return say('pets');
 if(has(/\b(?:birthday|born today)\b/))return say('birthday');
 if(has(/\b(?:cute|handsome|beautiful|pretty|gorgeous)\b/))return say('compliment');
 if(has(/\b(?:lol|lmao|haha|funny|joking)\b|[😂🤣]/u))return say('joke');

// Route every non-Heaven, non-ESSA-Sitter scripted message through the new engine.
function scriptedReply(c,text,history=[]){return engineV4(c,text,history)}
function scheduleScriptedReply(id,t){const c=db.contacts.find(x=>x.id===id);if(!c||c.blocked==='receive')return;const history=previousConversation(id).slice(0,-1);const reply=scriptedReply(c,t,history);save();queueIncoming(id,reply,Math.min(2400,650+Math.random()*1400))}
function heavenReply(text){const s=text.toLowerCase();if(/\b(i|we)\s+(really\s+|so\s+)?miss\s+you\b/.test(s))return 'I miss you too';if(/\b(proud of me|be proud of me)\b/.test(s))return "I'm so proud of you.";if(/\b(i want to|i'm going to|i might|thinking about|i feel like)\b.{0,65}\b(kill myself|end my life|hurt myself|self.harm|relapse|kill someone|hurt someone)\b/i.test(s)||/\b(suicidal|want to die|kill him|kill her|kill them)\b/i.test(s))return "I know it's hard that I'm gone. But I need you to keep going for me. I love you so much. Reach out to https://www.crisistextline.org/ and talk to someone. I want to see you someday, but not yet.";if(/[😢😭😞😔☹️]/u.test(text))return '🫂';return null}
function scheduleHeaven(id,t){const reply=heavenReply(t);if(reply)queueIncoming(id,reply,3400)}
function showSafety(){if(!selected)return;const bar=document.createElement('div');bar.className='notice';bar.innerHTML='Dimensionz safety notice: This is a fictional scripted reply, not a real person. If you may hurt yourself or someone else, reach out to a trusted person. In the U.S. call or text <a class="link" href="https://988lifeline.org/" target="_blank" rel="noopener">988</a>; if anyone is in immediate danger call emergency services.';$('#messages')?.append(bar);scrollBottom()}
let holdTimer;function holdStart(e,id){holdEnd();holdTimer=setTimeout(()=>{holdTimer=null;messageMenu(id)},600)}function holdEnd(){if(holdTimer)clearTimeout(holdTimer);holdTimer=null}
function messageMenu(id){if(multiSelect){toggleSelectedMessage(id);return}const m=db.messages[selected]?.find(m=>m.id===id);if(!m)return;const actions=m.deleted?`<button class="danger" onclick="deleteMessage('${id}',true)">Delete permanently</button>`:`<button class="danger" onclick="deleteMessage('${id}',false)">Delete message</button>`;$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Message options</h3><div class="stack">${actions}<button onclick="beginMultiSelect('${id}')">Select multiple</button><button onclick="setStoryStart('${id}')">Start story here</button><button onclick="closeModal()">Cancel</button></div></div></div>`}
function beginMultiSelect(id){closeModal();multiSelect=true;selectedMessages=new Set([id]);renderChat($('#app'))}
function toggleSelectedMessage(id){if(selectedMessages.has(id))selectedMessages.delete(id);else selectedMessages.add(id);renderChat($('#app'))}
function cancelMultiSelect(){multiSelect=false;selectedMessages.clear();renderChat($('#app'))}
function confirmMultiDelete(){const n=selectedMessages.size;if(!n)return;$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal delete-dialog" role="dialog" aria-modal="true"><div class="delete-icon">✕</div><h2>Delete ${n} Message${n===1?'':'s'}?</h2><p class="muted">The selected messages will disappear completely, without leaving “This message was deleted.” This cannot be undone.</p><div class="dialog-actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="deleteSelectedMessages()">Delete Forever</button></div></div></div>`}
function deleteSelectedMessages(){db.messages[selected]=(db.messages[selected]||[]).filter(m=>!selectedMessages.has(m.id));save();closeModal();cancelMultiSelect()}
function showBlockNotice(side){const action=side==='out'?'send messages to':'receive messages from';$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Messaging Restricted</h2><p class="muted">You blocked the ability to ${action} this contact. You can change this in their contact profile.</p><button class="primary" onclick="closeModal();openContactProfile()">Contact Profile</button> <button onclick="closeModal()">Close</button></div></div>`}
function deleteMessage(id,permanent){if(permanent){showDeleteForever(id);return}const msgs=db.messages[selected]||[];const m=msgs.find(x=>x.id===id);if(!m)return;m.deleted=true;m.text='';delete m.photo;save();closeModal();renderChat($('#app'))}
function showDeleteForever(id){$('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal delete-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><div class="delete-icon">✕</div><h2 id="deleteTitle">Permanently Delete Message?</h2><p class="muted">This message will disappear from the conversation forever. This action cannot be undone.</p><div class="dialog-actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="confirmDeleteForever('${id}')">Delete Forever</button></div></div></div>`}
function confirmDeleteForever(id){const msgs=db.messages[selected]||[];const i=msgs.findIndex(m=>m.id===id);if(i<0)return closeModal();msgs.splice(i,1);save();closeModal();renderChat($('#app'))}
function setStoryStart(id){storyStart=id;closeModal();alert('Story starting point selected. Tap Play chat story to preview.')}
async function sendPhoto(){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{if(!input.files[0])return;const photo=await compress(input.files[0]);const side=confirm('Add photo as a received message? OK = received, Cancel = sent')?'in':'out';if(db.contacts.find(c=>c.id===selected)?.blocked===(side==='out'?'send':'receive'))return showBlockNotice(side);addMsg(selected,side,'','photo',{photo});renderChat($('#app'))};input.click()}

  const chosen=matches.find(x=>x.model_id===LOCAL_AI_MODEL)||matches.find(x=>/q4f16_1/i.test(x.model_id))||matches[0];
  if(!chosen)throw Error('The requested small AI model is not available in this WebLLM version.');
  localAIProgress='Preparing '+chosen.model_id+'…';updateLocalAIStatus();
  const engine=await webllm.CreateMLCEngine(chosen.model_id,{initProgressCallback:p=>{localAIProgress=p.text||Math.round((p.progress||0)*100)+'%';updateLocalAIStatus()}});
  localAIEngine=engine;localAIState='ready';localAIProgress='';updateLocalAIStatus();
 }catch(e){localAIState='error';localAIError=e?.message||String(e);db.settings.localAIEnabled=false;save();updateLocalAIStatus();}finally{localAILoadPromise=null}})();return localAILoadPromise;
}
function exitDeveloperMode(){db.settings.developerUnlocked=false;db.settings.localAIEnabled=false;save();closeModal();if(selected)renderChat($('#app'))}
function recentAIContext(id){return (db.messages[id]||[]).filter(m=>!m.deleted&&(m.type==='text'||m.type==='narration')).slice(-16).map(m=>({role:m.type==='narration'?'system':m.side==='out'?'user':'assistant',content:m.type==='narration'?'Previous fictional scene description: '+m.text:String(m.text||'').slice(0,900)}))}
async function scheduleLocalAIReply(id,text){
 if(!localAIActive()){const c=db.contacts.find(x=>x.id===id);if(c?.auto)scheduleScriptedReply(id,text);return}
 if(localAIBusy){const c=db.contacts.find(x=>x.id===id);if(c?.auto)scheduleScriptedReply(id,text);return}
 const c=db.contacts.find(x=>x.id===id);if(!c||c.blocked==='receive')return;
 localAIBusy=true;
 try{
  const context=recentAIContext(id);
  const system=`You are writing ONE reply from ${c.name}, a FICTIONAL character in a fictional chat diary. Never claim to be a real person or actually present. Personality: ${c.personality||'natural'}. Fictional relationship: ${c.relationship||'unspecified'}. Character notes: ${String(c.notes||'').slice(0,500)}. Their dimension: ${c.dimension}. The user's preferred name: ${db.profile.name||'friend'}. Reply conversationally, directly and coherently to the last message, usually 1-3 sentences. No role labels, no stage directions. Do not imply real-world contact or surveillance.`;
  const result=await localAIEngine.chat.completions.create({messages:[{role:'system',content:system},...context],temperature:0.75,max_tokens:130});
  const reply=String(result.choices?.[0]?.message?.content||'').trim().replace(/^(?:assistant|\w+):\s*/i,'');
  if(!reply||!db.settings.localAIEnabled||!db.settings.developerUnlocked)return;
  if(c.blocked==='receive')return;
  addMsg(id,'in',reply,'text',{aiGenerated:true});
  if(c.narratorMode){try{const narr=await localAIEngine.chat.completions.create({messages:[{role:'system',content:`Write exactly ONE brief third-person fictional scene description (max 28 words), not dialogue, for a fictional text chat. No invented physical contact, no claims the character is real. Character: ${c.name}. Output only the narration.`},{role:'user',content:'User: '+text.slice(0,500)+'\n'+c.name+': '+reply.slice(0,500)}],temperature:0.75,max_tokens:55});const line=String(narr.choices?.[0]?.message?.content||'').trim().replace(/^\*|\*$/g,'');if(line&&db.settings.localAIEnabled&&c.narratorMode){db.messages[id].push({id:uid(),side:'narration',type:'narration',text:line,at:Date.now(),generated:true,aiGenerated:true});save()}}catch(e){console.warn('AI narration unavailable',e)}}
  if(selected===id)renderChat($('#app'));
 }catch(e){localAIState='error';localAIError=e?.message||String(e);db.settings.localAIEnabled=false;save();if(c.auto)scheduleScriptedReply(id,text);if(selected===id)renderChat($('#app'))}finally{localAIBusy=false}
}

render();playIntro();setInterval(refreshReceipts,350);setInterval(()=>{if(selected&&!storyRunning){const c=db.contacts.find(c=>c.id===selected);const el=document.querySelector('.chat-head .muted');if(c&&el){const s=status(c);el.innerHTML=`<span class="status ${s.cls}"></span>${s.text} · ${esc(c.dimension)}`}}},30000);
</script></body></html>
