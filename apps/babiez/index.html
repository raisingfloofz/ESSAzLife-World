</style></head><body><div id="app"></div><script>
'use strict';
// Audio files live beside index.html in the repository root.
const SOUND_FILES={breathing:'breathing.wav',heartbeat:'heartbeat.wav',sleeping:'sleeping.wav',crying:'crying.wav',gassy:'gassy-crying.wav',fart:'fart.mp3',spit:'spit-up.wav',drinking:'drinking.wav',burp:'burp.mp3',neh:'neh.wav',owh:'owh.wav',eh:'eh.wav',caregiver:'caregiver-detected.wav',registered:'caregiver-registered.wav',lost:'points-lost.wav',passing:'passing.mp3',failing:'failing.m4a',babbling:'babbling.wav',happy:'happy.wav',attention:'attention.mp3',fussy:'fussy.wav',sneeze:'sneeze.wav',coo:'coo.wav',talking:'talking.wav',laugh:'laugh.wav',mama:'baby.calling.mama.wav',daddy:'baby.calling.daddy.wav',nana:'baby.calling.nana.wav'};
const audioState={foreground:null,background:null,heartbeat:null,crying:null,muted:false,unlocked:false};
let sleepTimer=null, micStream=null,micCtx=null,micAnalyser=null,micData=null,micLevel=0,micStatus='Microphone off',speechRecognition=null,lastSpeechAt=0,lastStartleAt=0,lastVoiceAt=0,voiceBusy=false,loudSamples=0,previousMicLevel=0;
function makeSound(key,loop=false){const a=new Audio('./'+SOUND_FILES[key]);a.preload='none';a.loop=loop;a.volume=key==='heartbeat'?.09:key==='breathing'?.23:key==='sleeping'?.34:.8;return a}
function stopAudio(a){if(a){a.pause();try{a.currentTime=0}catch{}}}
function silenceAll(){stopAudio(audioState.crying);audioState.crying=null;stopAudio(audioState.foreground);stopAudio(audioState.background);stopAudio(audioState.heartbeat);audioState.foreground=null;audioState.background=null;audioState.heartbeat=null}
function sound(key,{background=false,loop=false}={}){if(audioState.muted||!SOUND_FILES[key])return;
if(key==='crying'){
  if(audioState.crying&&!audioState.crying.paused)return;
  const cry=audioState.crying||makeSound('crying',true);cry.loop=true;cry.volume=1;audioState.crying=cry;
  cry.play().catch(err=>{console.warn('Crying audio playback blocked:',err);});
  return;
}
let a=makeSound(key,loop);if(background){stopAudio(audioState.background);audioState.background=a;if(key==='breathing'){stopAudio(audioState.heartbeat);audioState.heartbeat=makeSound('heartbeat',true);audioState.heartbeat.play().catch(()=>{})}else{stopAudio(audioState.heartbeat);audioState.heartbeat=null}a.play().catch(()=>{});return}
stopAudio(audioState.foreground);audioState.foreground=a;if(audioState.background)audioState.background.volume=.035;if(audioState.heartbeat)audioState.heartbeat.volume=.015;
a.addEventListener('ended',()=>{if(audioState.foreground===a){audioState.foreground=null;if(audioState.background)audioState.background.volume=audioState.background.src.endsWith('/'+SOUND_FILES.sleeping)?.34:.23;if(audioState.heartbeat)audioState.heartbeat.volume=.09}},{once:true});a.play().catch(()=>{});}
// Prepare the crying recording during the user's I'm Ready tap, before timed needs begin.
function primeCrying(){
  if(audioState.crying)return;
  const cry=makeSound('crying',true);
  cry.volume=0;
  cry.preload='auto';
  audioState.crying=cry;
  const started=cry.play();
  if(started&&typeof started.then==='function')started.then(()=>{
    if(audioState.crying===cry){if(!session?.running||!session.need){cry.pause();cry.currentTime=0;}cry.volume=1;}
  }).catch(err=>console.warn('Could not prepare crying audio:',err));
}
document.addEventListener('pointerdown',()=>{if(session?.running&&!session.paused&&session.need&&audioState.crying?.paused){sound('crying');}});
function startAmbient(){if(!session?.running||session.paused)return;const key=session.asleep?'sleeping':'breathing';if(audioState.background&&!audioState.background.paused&&audioState.background.src.endsWith('/'+SOUND_FILES[key]))return;sound(key,{background:true,loop:true})}
function stopAmbient(){stopAudio(audioState.background);stopAudio(audioState.heartbeat);audioState.background=null;audioState.heartbeat=null}
const KEY='essazlife-babiez-v3';
const ROLES=['Mom','Dad','Grandma','Grandpa','Aunt','Uncle','Sibling','Babysitter','Guardian','Custom'];
const ITEMS=[['bottle','Bottle'],['diaper1','Diaper #1'],['diaper2','Diaper #2'],['wipes','Baby Wipes'],['cream','Diaper Rash Cream'],['thermometer','Thermometer'],['teether','Teething Ring'],['soap','Soap'],['sleep','Safe Sleeping Spot'],['carseat','Car Seat'],['medicine','Medicine'],['aspirator','Nasal Aspirator'],['pacifier','Pacifier']];
const REQUIRED=ITEMS.filter(x=>x[0]!=='pacifier');
const DEMO_IDS=Object.fromEntries(ITEMS.map(([k])=>[k,'ESSAZ-'+({diaper1:'DIAPER1',diaper2:'DIAPER2',sleep:'SLEEP',teether:'TEETHER',carseat:'CARSEAT',aspirator:'ASPIRATOR',cream:'CREAM'}[k]||k.toUpperCase())+'-DEMO']));
const NEEDS=[{id:'feed',label:'Hungry baby',item:'bottle',prompt:'Scan the bottle NFC sticker.',message:'Neh… baby is hungry.'},{id:'diaper',label:'Diaper change',item:'diaper1',prompt:'Scan either diaper sticker.',message:'Baby needs a fresh diaper.'},{id:'wipe',label:'Wipe baby',item:'wipes',prompt:'Scan baby wipes.',message:'Time to clean baby.'},{id:'cream',label:'Apply rash cream',item:'cream',prompt:'Scan diaper rash cream.',message:'Baby has a little diaper irritation.'},{id:'temperature',label:'Check temperature',item:'thermometer',prompt:'Scan the thermometer.',message:'Baby feels warm.'},{id:'sleep',label:'Sleepy baby',item:'sleep',prompt:'Scan the safe sleeping spot.',message:'Owh… baby is sleepy.'},{id:'bath',label:'Bath time',item:'soap',prompt:'Scan the soap.',message:'Baby needs a bath.'},{id:'outing',label:'Car seat',item:'carseat',prompt:'Scan the car seat.',message:'Time for an outing.'},{id:'medicine',label:'Medicine check',item:'medicine',prompt:'Scan the medicine bottle.',message:'Follow the simulated care plan.'},{id:'nose',label:'Stuffy nose',item:'aspirator',prompt:'Scan the nasal aspirator.',message:'Baby sounds stuffy.'},{id:'diaper2',label:'Another diaper change',item:'diaper2',prompt:'Scan the second diaper sticker.',message:'Baby needs another diaper.'},{id:'pacifier',label:'Comfort baby',item:'pacifier',prompt:'Scan the pacifier or caregiver band.',message:'Baby wants comforting.'},{id:'teether',label:'Teething',item:'teether',prompt:'Scan the teething ring.',message:'Baby wants to chew.'}];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{};}catch{db={}};
db.caregivers ||= [];db.babies ||= [];db.tags ||= {};db.reports ||= [];db.settings ||= {helpUrl:''};
let page='home', wizard=null, session=null, pendingScan=null, nfcController=null, scannerActive=false, toastTimer=null, tickTimer=null, audioCtx=null, toneEnabled=true;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const babyById=id=>db.babies.find(x=>x.id===id);
const caregiverById=id=>db.caregivers.find(x=>x.id===id);
const ageMonths=b=>b?.ageMode==='birth'&&b.birth?Math.max(0,Math.min(24,Math.floor((Date.now()-new Date(b.birth+'T12:00:00').getTime())/2629800000))):Number(b?.months||0);
const neededItems=b=>REQUIRED.filter(([k])=>k!=='teether'||ageMonths(b)>=3);
const allRegistered=b=>neededItems(b).every(([k])=>!!db.tags[k]);
const $=id=>document.getElementById(id);
function showToast(msg){let el=$('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.append(el)}el.textContent=msg;el.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),3400)}
function beep(freq=520,ms=120){if(!toneEnabled)return;try{audioCtx ||=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+ms/1000)}catch{}}
function render(){const app=$('app');if(page==='outro'){renderDemoOutro();return}app.innerHTML=`<main class="shell"><header class="top"><div><div class="brand">ESSAzLife Babiez </div><div class="tiny">NFC-powered baby care</div></div><div class="top-actions"><button class="world-link" type="button" aria-label="Refresh Babiez" title="Refresh Babiez" onclick="refreshBabiez()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.4 6"/><path d="M20 4v7h-7"/></svg></button><a class="world-link" href="../../index.html" aria-label="Return to ESSAzLife World" title="Return to ESSAzLife World" onclick="return confirmWorldExit(event)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c-3 3-4.5 6-4.5 9s1.5 6 4.5 9M12 3c3 3 4.5 6 4.5 9s-1.5 6-4.5 9"></path></svg></a><button class="btn alt small" style="padding:7px 10px;min-height:36px" onclick="goHome()">Home</button></div></header><section class="content" id="screen"></section><footer class="footer" id="footer"></footer></main>`;const f=$('footer');if(!db.caregivers.length&&page==='home')page='welcome';({welcome:welcomeScreen,caregiver:caregiverScreen,caregiverMore:moreCaregiversScreen,baby:babyScreen,primary:primaryScreen,accessories:accessoriesScreen,home:homeScreen,choose:chooseScreen,modes:modesScreen,demoBandChoice:demoBandChoiceScreen,prepare:prepareScreen,live:liveScreen,report:reportScreen,settings:settingsScreen,reports:reportsScreen,help:helpScreen}[page]||homeScreen)();if(!f.children.length)f.classList.add('hide')}
function screen(html,buttons=[]){$('screen').innerHTML=html;const f=$('footer');f.innerHTML=buttons.map((b,i)=>`<button class="btn ${b.alt?'alt':''}" id="action${i}" ${b.disabled?'disabled':''}>${safe(b.label)}</button>`).join('');buttons.forEach((b,i)=>$('action'+i).onclick=b.fn)}
function refreshBabiez(){if(session?.running&&!confirm('Refresh Babiez? Your current simulation progress will be lost.'))return;window.location.reload()}
function confirmWorldExit(event){if(session?.running&&!confirm('Leave Babiez and return to ESSAzLife World? Your current simulation will end.')){event.preventDefault();return false}silenceAll();stopNfc();return true}
function goHome(){stopMicrophone();clearTimeout(sleepTimer);cancelPending();if(session?.running){silenceAll();stopNfc();session.running=false}wizard=null;page='home';render()}
function beginWizard(kind){wizard={kind,babyId:null,caregiverId:null,step:kind==='first'?'caregiver':'baby'};page=wizard.step;render()}
function welcomeScreen(){screen(`<h1>Welcome to ESSAzLife Babiez.</h1><p>An app designed with NFC Tag use.</p><button class="link" onclick="page='help';render()">I need setup help</button><div class="card"><h2>Care for your baby, one tap at a time.</h2><p class="muted">Set up caregivers, babies, and NFC accessories. Then choose a simulation.</p></div><p class="small muted">For Android Chrome with NFC on, use HTTPS. Keep this page open while scanning.</p>`,[{label:'Get Started',fn:()=>beginWizard('first')}])}

function saveBaby(){const name=$('babyName').value.trim(),ageMode=$('ageMode').value,months=Number($('babyMonths').value),birth=$('babyBirth').value;if(!name)return showToast('Enter a baby name.');if(ageMode==='months'&&(!Number.isInteger(months)||months<0||months>24))return showToast('Choose an age from 0 to 24 months.');if(ageMode==='birth'&&(!birth||new Date(birth)>new Date()))return showToast('Enter a valid birth date.');const b={id:uid(),name,gender:$('babyGender').value,ageMode,months,birth,primaryId:null};db.babies.push(b);wizard ||= {};wizard.babyId=b.id;save();page='primary';render()}

function accessoriesScreen(){const b=babyById(wizard?.babyId||session?.babyId);if(!b)return goHome();const items=neededItems(b),done=items.filter(([k])=>db.tags[k]).length;screen(`<h1>${safe(b.name)}'s accessories</h1><p class="small muted">Tap Scan beside each item. Registered stickers work for every baby.</p><div class="progress"><div style="width:${100*done/items.length}%"></div></div><p class="small"><b>${done} / ${items.length}</b> required tags ready</p><div class="accessory-grid">${[...items,['pacifier','Pacifier (optional)'],['toy001','ESSAZ-Toy-001 (optional)'],['toy002','ESSAZ-Toy-002 (optional)'],['toy003','ESSAZ-Toy-003 (optional)']].map(([k,label])=>`<div class="accessory-tile"><div><span class="${db.tags[k]?'ok':'bad'}">${db.tags[k]?'':''}</span> <strong>${safe(label)}</strong></div><button class="btn alt small" onclick="scanFor('accessory','${k}')">${db.tags[k]?'Replace tag':'Scan tag'}</button></div>`).join('')}</div><p class="small muted">In simulations, a caregiver band can provide assisted care if an item is unavailable.</p>`,[{label:'Back',alt:true,fn:()=>{page='primary';render()}},{label:'Next',fn:()=>{if(!allRegistered(b))return showToast('Register the required tags to continue.');wizard=null;session={babyId:b.id};page='modes';render()}}])}

function homeScreen(){if(!db.caregivers.length){page='welcome';return welcomeScreen()}screen(`<h1>Choose a baby to begin</h1>${session?.running?`<div class="notice"><b>Active Session</b> · ${safe(babyById(session.babyId)?.name)} ${session.paused?'(Paused)':''}<button class="btn alt" style="margin-top:9px;width:100%" onclick="page='live';render()">Return to session</button></div>`:''}<div class="scrolllist">${db.babies.map(b=>`<button class="choice" onclick="chooseBaby('${b.id}')"><span class="grow">${safe(b.name)}<div class="small muted">${ageMonths(b)} months · ${safe(b.gender)}</div></span><span>›</span></button><button class="btn alt small baby-delete-icon" aria-label="Delete ${safe(b.name)}" title="Delete ${safe(b.name)}" onclick="deleteBaby('${b.id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button>`).join('')}</div><button class="choice" onclick="beginWizard('newbaby')"><span class="grow">＋ Add a new baby</span></button><div class="grid2"><button class="btn alt" onclick="page='settings';render()">Caregivers & Settings</button><button class="btn alt" onclick="page='reports';render()">Report Cards</button></div>`,[])}
function deleteBaby(id){const b=babyById(id);if(!b)return;if(session?.running&&session.babyId===id){showToast('End this baby\'s active simulation before deleting.');return}const count=db.reports.filter(r=>r.babyId===id).length;document.getElementById('deleteBabyDialog')?.remove();const d=document.createElement('div');d.id='deleteBabyDialog';d.className='modal';d.setAttribute('role','presentation');d.innerHTML=`<div class="modal-box delete-confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="deleteBabyTitle" aria-describedby="deleteBabyDescription"><div class="delete-confirm-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></div><h2 id="deleteBabyTitle">Delete ${safe(b.name)}?</h2><p id="deleteBabyDescription">This will permanently remove ${safe(b.name)}'s baby profile and ${count} saved report card${count===1?'':'s'}. This cannot be undone.</p><div class="delete-confirm-actions"><button type="button" class="btn alt" id="cancelBabyDelete">Cancel</button><button type="button" class="btn delete-confirm-danger" id="confirmBabyDelete">Delete Baby</button></div></div>`;document.body.append(d);const close=()=>{d.remove();document.removeEventListener('keydown',onKey)};const onKey=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',onKey);d.addEventListener('click',e=>{if(e.target===d)close()});d.querySelector('#cancelBabyDelete').onclick=close;d.querySelector('#confirmBabyDelete').onclick=()=>{close();db.babies=db.babies.filter(x=>x.id!==id);db.reports=db.reports.filter(r=>r.babyId!==id);if(session?.babyId===id)session=null;save();render();showToast('Baby deleted.')};d.querySelector('#cancelBabyDelete').focus()}
function chooseBaby(id){const b=babyById(id);if(!b)return;if(!b.primaryId){wizard={babyId:id,caregiverId:null};page='primary'}else if(!allRegistered(b)){wizard={babyId:id,caregiverId:b.primaryId};page='accessories'}else{session={babyId:id};page='modes'}render()}
function modesScreen(){const b=babyById(session?.babyId);if(!b)return goHome();screen(`<h1>Choose a simulation</h1><p class="muted">${safe(b.name)} · ${ageMonths(b)} months</p><button class="choice" onclick="startMode('demo')"><span class="grow"> Demo<div class="small muted">Guided, immediate accessory practice</div></span>›</button><div class="card"><h2>Classic</h2><div class="grid2"><button class="btn alt" onclick="startMode('easy')">Easy</button><button class="btn alt" onclick="startMode('medium')">Medium</button><button class="btn alt" onclick="startMode('hard')">Hard</button><button class="btn alt" onclick="startMode('sick')">Sick (Cold)</button></div><p class="small muted">Babies can develop mild cold symptoms in other modes, too.</p></div><button class="choice" onclick="startMode('quick')"><span class="grow">Quick Play<div class="small muted">One-hour simulation with clustered care needs</div></span>›</button><button class="choice" onclick="startMode('doll')"><span class="grow">Doll Mode<div class="small muted">Simulation without needing to touch your screen</div></span>›</button><button class="choice" onclick="startMode('daycare')"><span class="grow"> Daycare<div class="small muted">Care needs arise in scheduled windows</div></span>›</button>`,[{label:'Back',alt:true,fn:goHome}])}
function demoBandChoiceScreen(){screen(`<h1> Demo setup</h1><div class="card"><h2>Use caregiver band for all?</h2><p>Would you like to use your caregiver NFC bracelet as a stand-in for every accessory during this demo?</p><p class="small muted">Yes: scan your band once to respond to baby, then scan it again whenever the demo asks for an accessory. No: use the separate accessory NFC tags.</p></div><button class="btn" onclick="setDemoBandForAll(true)">Yes — use caregiver band for all</button><button class="btn alt" onclick="setDemoBandForAll(false)">No — use individual NFC tags</button>`,[{label:'Back',alt:true,fn:()=>{page='modes';render()}}])}
function setDemoBandForAll(yes){if(!session||session.mode!=='demo')return;session.demoBandForAll=!!yes;page='prepare';render()}
function feedingGuide(m){return m<1?[2.5,2,3]:m<2?[3.5,2,3]:m<3?[4,2.5,4]:m<6?[5,3,4]:m<12?[6,3.5,5]:[5,3,5]}
function fmtClock(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:db.settings.clock!=='24'})}
function startMode(mode){silenceAll();const b=babyById(session.babyId),guide=feedingGuide(ageMonths(b));session={babyId:b.id,mode,caregiverId:b.primaryId,started:0,score:100,events:[],completed:0,paused:false,running:false,need:null,needSince:0,nextAt:0,step:0,feedingStage:'',prepEnd:Date.now()+300000,location:'held',attended:false,responseDeadline:0,responded:false,late:false,feedDue:0,diaperDue:0,sleepDue:0,comfortDue:0,feedOz:0,consumedOz:0,remainingOz:0,feedStarted:0,feedUntil:0,feedTarget:0,burpDue:0,burpCount:0,cryStarted:0,warningCount:0,warningAt:0,autoEnd:'',daycareWindows:[],guide,temperature:mode==='sick'?(Math.random()<.5?38.2:39.4):36.9,feverStage:mode==='sick'?(Math.random()<.5?1:2):0,medicineAt:0,asleep:false,sleepAt:0,awakeAt:0,activity:'',activityUntil:0,lastFartAt:0,nextSneezeAt:0,nextSpitAt:0,nextBabbleAt:0,holdVoiceAt:0,voiceReady:false,careMenu:false,envLevel:0,prepMic:false,demoBandForAll:null};page=mode==='demo'?'demoBandChoice':'prepare';render()}
function prepareScreen(){const b=babyById(session?.babyId);if(!b)return goHome();const [oz,lo,hi]=session.guide;screen(`<h1>Get ready for ${safe(b.name)}!</h1><div class="card"><h2> Feeding guide</h2><p>Typical bottle: <b>about ${oz} oz</b></p><p>Typically every <b>${lo}–${hi} hours</b> (from the start of one feeding to the next).</p><p class="small muted">These are approximate hints, not guaranteed feeding times. Baby may drink less or refuse.</p></div><div class="card center"><div class="score" id="prepClock">5:00</div><p>Preparation time remaining</p></div><button class="btn alt" onclick="session.prepEnd+=300000;updatePrepClock()">I Need More Time (+5 min)</button><label class="field">Starting caregiver<select onchange="session.caregiverId=this.value">${db.caregivers.map(c=>`<option value="${c.id}" ${session.caregiverId===c.id?'selected':''}>${safe(c.name)} (${safe(c.role)})</option>`).join('')}</select></label><div class="card"><label class="inline"><input type="checkbox" id="autoOn" ${session.autoEnd?'checked':''} onchange="$('autoTime').disabled=!this.checked;session.autoEnd=this.checked?$('autoTime').value:''"> End simulation automatically</label><label class="field">When do you want baby to end simulation automatically?<input type="time" id="autoTime" ${session.autoEnd?'':'disabled'} value="${session.autoEnd||'15:00'}" onchange="session.autoEnd=this.value"></label><p class="small muted">If the selected time has already passed today, it will end tomorrow. The app must remain open.</p></div>${session.mode==='daycare'?`<div class="card"><h2>Daycare no-care windows</h2><p class="small muted">Baby will remain content and require no care during these times.</p><div id="windows">${session.daycareWindows.map((w,i)=>`<p>${safe(w.start)}–${safe(w.end)} <button class="btn alt" onclick="session.daycareWindows.splice(${i},1);render()">Remove</button></p>`).join('')}</div><div class="inline"><input type="time" id="windowStart" value="12:00"><input type="time" id="windowEnd" value="13:00"></div><button class="btn alt" onclick="addDaycareWindow()">Add no-care window</button></div>`:''}${session.mode==='doll'?'<button class="btn alt" onclick="prepareDollPermissions()">Enable NFC and microphone for Doll Mode</button>':''}<p class="notice">${session.mode==='doll'?'Doll Mode starts automatically when the five-minute timer ends. Keep this page open.':'Tap I’m Ready when you are ready. Microphone access is requested on starting.'}</p>`,[{label:'Back',alt:true,fn:()=>{page='modes';render()}},{label:session.mode==='doll'?'Start Now':"I'm Ready",fn:beginSession}]);updatePrepClock()}
function addDaycareWindow(){const start=$('windowStart').value,end=$('windowEnd').value;if(!start||!end||start===end)return showToast('Choose two different times.');session.daycareWindows.push({start,end});render()}
function updatePrepClock(){if(page!=='prepare'||!session)return;if(session.mode==='doll'&&Date.now()>=session.prepEnd){beginSession();return}const sec=Math.max(0,Math.ceil((session.prepEnd-Date.now())/1000));if($('prepClock'))$('prepClock').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function clockDeadline(hm,now=Date.now()){const [h,m]=hm.split(':').map(Number),d=new Date(now);d.setHours(h,m,0,0);if(d.getTime()<=now)d.setDate(d.getDate()+1);return d.getTime()}
function prepareDollPermissions(){if(!session)return;session.running=true;startMicrophone();startNfcListener();session.running=false;showToast('Permissions requested. Doll Mode will start after the countdown.')}
function beginSession(){if(!session||session.running)return;primeCrying();const now=Date.now(),s=session;if(s.mode==='demo'&&s.demoBandForAll===null){page='demoBandChoice';render();return}s.running=true;s.started=now;startMicrophone();s.events=[];s.score=100;s.completed=0;s.attended=false;s.autoEndAt=s.autoEnd?clockDeadline(s.autoEnd,now):0;s.feedDue=now+(s.mode==='demo'?0:Math.max(10*60000,(s.guide[1]+Math.random()*(s.guide[2]-s.guide[1]))*3600000));s.diaperDue=now+((1.5+Math.random()*1.5)*3600000);s.sleepDue=now+(30+Math.random()*45)*60000;s.comfortDue=now+(45+Math.random()*90)*60000;s.nextAt=now+(s.mode==='demo'?0:15000);s.asleep=false;s.awakeAt=now;s.nextSneezeAt=now+18000;s.nextSpitAt=now+50000;s.nextBabbleAt=now+22000;s.quickEndAt=s.mode==='quick'?now+3600000:0;if(s.mode==='quick'){s.feedDue=now+60000;s.diaperDue=now+150000;s.sleepDue=now+220000;s.comfortDue=now+90000;}s.events.push({type:'awake',at:now});s.demoWaiting=false;page='live';render();startNfcListener();startAmbient();if(s.mode==='demo')activateNextNeed();else showToast('Simulation started. Keep the app open for NFC scanning.')}
function modeNeeds(){if(session?.mode==='demo')return NEEDS.filter(n=>!['wipe','diaper2'].includes(n.id)&&(n.id!=='teether'||ageMonths(babyById(session.babyId))>=3));return NEEDS.filter(n=>!(session.mode==='demo'?['outing','wipe','cream','diaper2']:['outing','temperature','wipe','cream','diaper2']).includes(n.id)&&(n.id!=='teether'||ageMonths(babyById(session.babyId))>=3)&&(n.id!=='pacifier'||!!db.tags.pacifier))}
function inNoCareWindow(now){if(session.mode!=='daycare')return false;const t=new Date(now),hm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');return session.daycareWindows.some(w=>w.start<w.end?hm>=w.start&&hm<w.end:hm>=w.start||hm<w.end)}
function scheduleAfter(id,now=Date.now(),oz=0){const s=session;switch(id){case'feed':{const fraction=Math.max(.3,Math.min(1.2,oz/s.guide[0]));s.feedDue=now+Math.max(25*60000,(s.guide[1]+Math.random()*(s.guide[2]-s.guide[1]))*3600000*fraction);break}case'diaper':s.diaperDue=now+(1.5+Math.random()*2)*3600000;break;case'sleep':s.sleepDue=now+(1+Math.random()*2)*3600000;break;default:s.comfortDue=now+(45+Math.random()*90)*60000}}
function startCrying(id){const s=session,now=Date.now();if(s.need||s.paused)return;wakeBaby('need');s.need={id,item:({feed:'bottle',diaper:'diaper1',sleep:'sleep',bath:'soap',nose:'aspirator',medicine:'medicine',pacifier:'pacifier',teether:'teether'}[id]||id)};s.needSince=now;s.cryStarted=now;s.responseDeadline=now+300000;s.responded=false;s.attended=false;s.late=false;s.events.push({type:'need',id,at:now});if(id==='nose')s.nextSneezeAt=now+5000;if(id==='diaper'&&s.mode!=='demo'&&now-s.lastFartAt>5000){sound('fart');s.lastFartAt=now;}stopAudio(audioState.foreground);audioState.foreground=null;sound('crying');render()}
function activateNextNeed(){if(!session?.running||session.paused)return;if(session.mode==='demo'){const needs=modeNeeds();if(session.step>=needs.length){finishSession();return}startCrying(needs[session.step].id);session.demoCareStage='caregiver';if(session.need?.id==='feed')beginRealCry();return}const now=Date.now();const due=[['feed',session.feedDue],['diaper',session.diaperDue],['sleep',session.sleepDue],['pacifier',session.comfortDue]].filter(x=>x[1]<=now).sort((a,b)=>a[1]-b[1]);if(due.length)startCrying(due[0][0])}
function beginRealCry(){const s=session;if(!s.need||s.cryStarted)return;const now=Date.now();s.cryStarted=now;s.responseDeadline=now+300000;s.needSince=now;stopAudio(audioState.foreground);audioState.foreground=null;sound('crying');render()}
function liveScreen(){if(!session?.running)return goHome();const s=session,b=babyById(s.babyId),n=s.need,demo=s.mode==='demo';const feeding=!!s.feedingStage;let status=s.paused?'Taking a break':s.asleep?'Baby is asleep':'Baby is Awake';let instruction=s.paused?'Simulation paused':feeding?({making:'Choose how many ounces to prepare.',drinking:'Baby is drinking. Listen for a pause.',burp:'Baby has paused. Try responding to their cue.',continue:'Continue feeding with the same bottle.'}[s.feedingStage]||''):(n?(demo?('Scan caregiver band, then '+(NEEDS.find(x=>x.id===n.id)?.prompt||'the matching accessory')):'Scan your caregiver bracelet to respond, then investigate the crying.'):'You can scan your caregiver band and provide care proactively.');if(demo&&n){const stage=s.demoCareStage||'caregiver';const steps=n.id==='feed'?{caregiver:'Scan caregiver tag.',bottle:'Scan bottle tag.',ounces:'Enter bottle ounces.',bottleAgain:'Scan bottle tag again to feed baby.',caregiverFinish:'Scan caregiver tag to finish feeding.'}:n.id==='diaper'?{caregiver:'Scan caregiver tag.',diaper:'Scan diaper tag.',wipes:'Scan wipes tag.',diaperAgain:'Scan diaper tag again to finish.'}:null;instruction=steps?.[stage]||(stage==='caregiver'?'Scan caregiver tag.':(NEEDS.find(x=>x.id===n.id)?.prompt||'Scan the matching accessory.'));}
const countdown=n&&s.cryStarted&&!s.responded?Math.max(0,s.responseDeadline-Date.now()):null;
screen(`<div class="care-stage"><div class="care-head"><h1>${safe(b.name)}</h1><span class="pill">${safe(s.mode.toUpperCase())}</span><span class="pill" id="liveTime">00:00</span></div><div class="inline"><span class="pill">${safe(s.location==='held'?'Being held':s.location==='sleep'?'In bed':'In resting spot')}</span><span class="pill">Score <b id="liveScore">${s.score}%</b></span>${demo?`<span class="pill">${s.step+1}/${modeNeeds().length}</span>`:''}</div><div class="baby-stage"><div class="baby-figure">${s.paused?'⏸':feeding?'':n?'':s.location==='held'?'':''}</div><h2>${safe(status)}</h2>${s.activity&&Date.now()<s.activityUntil?`<p class="small">${safe(s.activity)}</p>`:''}${s.mode==='sick'?`<p class="small">Fever: <b style="color:${s.feverStage===2?'#b52d2d':s.feverStage===1?'#a77900':'#16843a'}">${s.feverStage===2?'Red':s.feverStage===1?'Yellow':'Green'}</b></p>`:''}<div class="environment"><div class="environment-track"><div id="environmentBar" style="width:${Math.min(100,s.envLevel||0)}%;background:${s.envLevel>=75?'#dc4141':s.envLevel>=35?'#e5b338':'#27a66a'}"></div></div><span id="environmentText" class="small muted">${safe(micStatus)}</span></div>${countdown!==null?`<div class="score" id="responseClock">${formatTime(countdown)}</div><p class="small">Time to scan caregiver band</p>`:n&&s.responded?'<p class="small">Caregiver responded </p>':''}<p>${safe(instruction)}</p>${feeding?`<p class="small">Prepared: ${s.feedOz.toFixed(1)} oz · Consumed: ${s.consumedOz.toFixed(1)} oz · Remaining: ${s.remainingOz.toFixed(1)} oz</p>`:''}</div><div class="nfc-indicator" id="nfcState">${scannerActive?' NFC listening':' Enable NFC to scan'}</div><div class="care-actions">${s.feedingStage==='making'?'<button class="btn wide" onclick="openBottleDialog()"> Choose bottle ounces</button>':''}<button class="btn alt" onclick="openCareHistory()">Care So Far</button><button class="btn alt" onclick="openCareMenu()">Tap here to use caregiver ID</button><button class="btn alt" oncli  demoOutroScene('Now the fun part...',2900,()=>{
  demoOutroScene('In Classic and Daycare Modes, you will not know what baby needs. It’s your job to guess.',5500,()=>{
   demoOutroScene('Tell baby you are here by tapping the caregiver band.',0,null);
   setTimeout(()=>{if(page!=='outro')return;demoOutroWaiting=true;const hint=$('demoOutroHint');if(hint)hint.textContent=' Waiting for caregiver band';if(!scannerActive)startNfcListener()},900);
  });
 });
}
function finishDemoOutroScan(){
 if(page!=='outro'||!demoOutroWaiting)return;
 demoOutroWaiting=false;clearTimeout(demoOutroTimer);
 stopAmbient();stopAudio(audioState.crying);audioState.crying=null;stopAudio(audioState.foreground);
 showScanOverlay(true);scanSound();
 const hint=$('demoOutroHint');if(hint)hint.textContent='';
 setTimeout(()=>{
  if(page!=='outro')return;
  sound('happy');
  demoOutroScene('Good luck.',2600,()=>{
   stopNfc();silenceAll();session=null;page='home';render();
  });
 },1100);
}

// Babiez interactive care, sleep, fever, and microphone support.
function activity(text){const s=session;if(!s)return;s.activity=text;s.activityUntil=Date.now()+5000;s.events.push({type:'activity',text,at:Date.now(),caregiverId:s.caregiverId});showToast(text)}
function sleepBaby(){const s=session;if(!s?.running||s.paused||s.need||s.feedingStage||s.asleep)return;s.asleep=true;s.sleepAt=Date.now();s.events.push({type:'sleep',at:s.sleepAt});stopAmbient();startAmbient();if(page==='live')render()}
function placeBaby(k){const s=session;if(!s)return;s.location=k==='sleep'?'sleep':'carseat';s.attended=false;s.events.push({type:'placed',place:s.location,at:Date.now()});clearTimeout(sleepTimer);if(!s.asleep){activity('Baby is awake in '+(k==='sleep'?'bed':'car seat'));sleepTimer=setTimeout(()=>{if(session===s&&s.running&&!s.need&&s.location!=='held')sleepBaby()},5000)}else{activity('Baby is asleep');startAmbient()}render()}
function wakeBaby(reason,caregiver){const s=session;if(!s?.running)return;const wasAsleep=s.asleep;s.asleep=false;s.awakeAt=Date.now();clearTimeout(sleepTimer);if(wasAsleep){s.events.push({type:'wake',reason,at:Date.now()});stopAmbient();startAmbient();if(reason==='pickup'&&!s.need)playHeldGreeting(caregiver);if(page==='live')render()}}
function playVoice(key){if(!SOUND_FILES[key]||!session?.running)return;const a=makeSound(key);a.volume=.8;if(key==='nana'){a.addEventListener('loadedmetadata',()=>{if(Number.isFinite(a.duration))a.currentTime=Math.max(0,a.duration-1)},{once:true});a.addEventListener('timeupdate',()=>{if(a.currentTime>=a.duration-.03)a.pause()});}a.play().catch(()=>{});lastVoiceAt=Date.now();}
function playHeldGreeting(c){if(!session?.running||session.need||session.asleep)return;const role=(c?.role||'').toLowerCase();sound('coo');setTimeout(()=>{if(!session?.running||session.asleep||session.need||session.location!=='held')return;playVoice(role==='mom'?'mama':role==='dad'?'daddy':role==='grandma'?'nana':'talking')},1200)}
function handleMedicine(){const s=session;if(!s?.running)return;showScanOverlay(true);if(s.feverStage>0){s.medicineAt=Date.now();s.events.push({type:'medicine',at:s.medicineAt,caregiverId:s.caregiverId});activity('Medicine given. Fever is improving.');if(s.need?.id==='medicine')completeNeed('medicine')}else{sound('spit');activity('Medicine given without a fever — baby spit up');s.events.push({type:'spit-up',at:Date.now()});if(s.need?.id==='medicine')completeNeed('medicine')}s.attended=false;render()}
function handleToy(){const s=session;if(!s?.running)return;showScanOverlay(!s.asleep);if(s.asleep){activity('Baby is asleep');return}sound('laugh');activity('Playtime started');s.events.push({type:'toy',at:Date.now()});s.attended=false;render()}
function updateBabyLife(now){const s=session;if(!s?.running||s.paused||s.mode==='demo')return;if(s.medicineAt&&s.feverStage>0&&now-s.medicineAt>30000){s.feverStage--;s.temperature=s.feverStage===2?39.4:s.feverStage===1?38.2:36.9;s.medicineAt=s.feverStage?now:0;s.events.push({type:'fever',stage:s.feverStage,at:now});activity('Fever is now '+(s.feverStage===2?'red':s.feverStage===1?'yellow':'green'));if(page==='live')render()}if(s.mode==='sick'&&s.feverStage===1&&!s.medicineAt&&Math.random()<.001){s.feverStage=2;s.temperature=39.4;activity('Fever increased to red');if(page==='live')render()}if(!s.need&&now>=s.nextSneezeAt){s.nextSneezeAt=now+(s.mode==='sick'?13000+Math.random()*18000:130000+Math.random()*120000);if(s.mode==='sick'||Math.random()<.3)sound('sneeze')}if(!s.need&&s.mode==='sick'&&now>=s.nextSpitAt){s.nextSpitAt=now+60000+Math.random()*140000;sound('spit');s.events.push({type:'spit-up',at:now});activity('Baby spit up')}if(!s.need&&now-s.lastFartAt>(s.mode==='sick'?45000:170000)&&Math.random()<(s.mode==='sick'?.055:.012)){s.lastFartAt=now;sound('fart');s.events.push({type:'fart',at:now});s.diaperDue=Math.min(s.diaperDue,now+(s.mode==='sick'?15000:30000))}if(!s.asleep&&!s.need&&!s.feedingStage&&s.location==='held'&&now-s.awakeAt>=20000){sleepBaby()}if(!s.asleep&&!s.need&&s.location==='held'&&now>=s.nextBabbleAt){s.nextBabbleAt=now+30000+Math.random()*45000;sound('talking')}if(s.mode==='quick'&&!s.need){if(s.feedDue-now>300000)s.feedDue=now+90000;if(s.diaperDue-now>300000)s.diaperDue=now+160000;if(s.comfortDue-now>300000)s.comfortDue=now+210000}}
function openCareHistory(){const s=session;if(!s)return;const entries=s.events.slice().reverse().map(e=>`<p class="small" style="border-bottom:1px solid #eee;padding:7px 0"><b>${fmtClock(e.at)}</b> · ${safe(e.text||({need:'Care needed: '+e.id,resolved:'Completed '+e.need,caregiver:'Caregiver detected',pickup:'Baby picked up',placed:'Baby placed '+e.place,awake:'Baby is Awake',sleep:'Baby is asleep',wake:'Baby woke up',temperature:'Temperature checked',medicine:'Medicine given',fart:'Baby farted',toy:'Playtime',feeding:'Feeding completed',proactive:'Proactive '+e.item,fever:'Fever changed', 'spit-up':'Baby spit up'}[e.type]||e.type))}</p>`).join('');showCustomDialog('Care So Far',entries||'<p>No care recorded yet.</p>')}
function showCustomDialog(title,content){document.getElementById('careDialog')?.remove();const d=document.createElement('div');d.className='modal';d.id='careDialog';d.innerHTML=`<div class="modal-box" style="max-height:85dvh"><h2>${safe(title)}</h2><div style="overflow-y:auto;min-height:0">${content}</div><button class="btn" onclick="document.getElementById('careDialog').remove()">Close</button></div>`;document.body.append(d)}
function openCareMenu(){const s=session;if(!s?.running)return;showCustomDialog('Use caregiver ID',`<p class="small muted">Choose an activity. Babiez will show whether it matches the baby's needs.</p><div class="grid2">${[['bottle','Bottle'],['diaper1','Diaper'],['wipes','Wipes'],['cream','Cream'],['thermometer','Thermometer'],['medicine','Medicine'],['sleep','Bed'],['carseat','Car seat'],['soap','Bath'],['aspirator','Nasal care'],['pacifier','Pacifier'],['toy001','Toy']].map(([k,l])=>`<button class="btn alt" onclick="careMenuAction('${k}')">${l}</button>`).join('')}</div>`)}
function careMenuAction(k){document.getElementById('careDialog')?.remove();const s=session;if(!s?.running)return;const expected=s.need?.item;const correct=!s.need||k===expected||(s.need?.id==='diaper'&&k==='diaper1');showScanOverlay(correct);if(!correct){s.events.push({type:'incorrect',item:k,at:Date.now()});return}if(k==='thermometer')return showTemperature();if(k==='medicine')return handleMedicine();if(k.startsWith('toy'))return handleToy();if(k==='bottle'){s.attended=true;s.feedingStage='making';activity('Feeding started');render();return openBottleDialog()}if(k==='sleep'||k==='carseat')placeBaby(k);else activity(({diaper1:'Diaper change started',wipes:'Diaper change started',cream:'Rash care started',soap:'Bath started',aspirator:'Nasal care started',pacifier:'Soothing started'}[k]||'Care started'));if(s.need)completeNeed(k);else{s.events.push({type:'proactive',item:k,at:Date.now()});s.completed++;render()}}
async function startMicrophone(){if(micStream||!session?.running||session.paused)return;try{if(!navigator.mediaDevices?.getUserMedia){micStatus='Microphone unavailable';return}micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});micCtx=new(window.AudioContext||window.webkitAudioContext)();const source=micCtx.createMediaStreamSource(micStream);micAnalyser=micCtx.createAnalyser();micAnalyser.fftSize=1024;source.connect(micAnalyser);micData=new Uint8Array(micAnalyser.fftSize);micStatus='Quiet';startSpeechRecognition()}catch(e){micStatus='Microphone unavailable';console.warn('Mic permission:',e)}}
function stopMicrophone(){try{speechRecognition?.abort()}catch{}speechRecognition=null;try{micStream?.getTracks().forEach(t=>t.stop())}catch{}micStream=null;try{micCtx?.close()}catch{}micCtx=null;micAnalyser=null;micData=null;micStatus='Microphone off';micLevel=0;loudSamples=0;previousMicLevel=0}
function updateMicrophoneLevel(){
 const s=session;if(!s?.running)return;
 const bar=$('environmentBar'),txt=$('environmentText');
 if(!micAnalyser||!micData||micCtx?.state!=='running'){
  s.envLevel=0;micLevel=0;loudSamples=0;micStatus='Microphone off / unavailable';
  if(bar){bar.style.width='0%';bar.style.background='#a0a0a0'}
  if(txt)txt.textContent=micStatus;
  return;
 }
 micAnalyser.getByteTimeDomainData(micData);
 let sum=0;for(const x of micData){const v=(x-128)/128;sum+=v*v}
 const rms=Math.sqrt(sum/micData.length);
 micLevel=Math.min(100,Math.round(rms*430));s.envLevel=micLevel;
 micStatus=micLevel>=75?'Loud':micLevel>=35?'Moderate / White Noise':'Quiet';
 if(bar){bar.style.width=micLevel+'%';bar.style.background=micLevel>=75?'#dc4141':micLevel>=35?'#e5b338':'#27a66a'}
 if(txt)txt.textContent=micStatus;
 // Only a sustained loud environment can startle a sleeping baby.
 // Demo is for guided NFC practice, not environmental startle testing.
 // Never react to the baby's own crying or to short audio peaks.
 const eligible=s.mode!=='demo'&&s.asleep&&!s.need&&!audioState.crying&&!audioState.foreground;
 loudSamples=eligible&&micLevel>=80?loudSamples+1:0;
 if(loudSamples>=3&&Date.now()-lastStartleAt>30000){
  loudSamples=0;lastStartleAt=Date.now();
  activity('Baby startled by loud noise');startCrying('pacifier');
 }
 previousMicLevel=micLevel;
}
function startSpeechRecognition(){const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C||speechRecognition||!micStream)return;try{const r=new C();speechRecognition=r;r.lang='en-US';r.continuous=true;r.interimResults=false;r.onresult=e=>{if(!session?.running||session.asleep||session.need||session.location!=='held'||session.feedingStage)return;if(Date.now()-lastVoiceAt<2500||Date.now()-lastSpeechAt<3500)return;const heard=Array.from(e.results).slice(e.resultIndex).map(x=>x[0]?.transcript||'').join(' ').toLowerCase();const key=/\b(mama|momma)\b/.test(heard)?'mama':/\b(dada|daddy)\b/.test(heard)?'daddy':/\bnana\b/.test(heard)?'nana':null;lastSpeechAt=Date.now();if(key)playVoice(key);else if(heard.trim())sound('talking')};r.onend=()=>{if(speechRecognition===r&&session?.running&&!session.paused&&micStream){try{r.start()}catch{}}};r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){speechRecognition=null}};r.start()}catch(e){console.warn('Speech recognition unavailable',e);speechRecognition=null}}
window.prepareDollPermissions=prepareDollPermissions;window.openCareHistory=openCareHistory;window.openCareMenu=openCareMenu;window.careMenuAction=careMenuAction;window.setDemoBandForAll=setDemoBandForAll;window.nextDemoCare=nextDemoCare;window.goHome=goHome;window.beginWizard=beginWizard;window.openHelpVideo=openHelpVideo;window.scanFor=scanFor;window.saveCaregiver=saveCaregiver;window.saveBaby=saveBaby;window.chooseBaby=chooseBaby;window.startMode=startMode;window.beginSession=beginSession;window.startNfcListener=startNfcListener;window.togglePause=togglePause;window.finishSession=finishSession;window.bottleMade=bottleMade;window.useBandForBottle=useBandForBottle;window.saveHelpUrl=saveHelpUrl;window.replaceBand=replaceBand;window.removeCaregiver=removeCaregiver;window.render=render;window.page=page;window.wizard=wizard;window.session=session;
// Keep inline onclick references synchronized with state changes.
Object.defineProperty(window,'page',{get:()=>page,set:v=>page=v});Object.defineProperty(window,'wizard',{get:()=>wizard,set:v=>wizard=v});Object.defineProperty(window,'session',{get:()=>session,set:v=>session=v});
setInterval(tick,1000);render();
