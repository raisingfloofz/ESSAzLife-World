<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Swipez</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8f8fc;color:#17343c;font:16px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}header{height:76px;background:#83d7e9;display:flex;align-items:center;justify-content:space-between;padding:8px 18px}header img{height:60px;border-radius:12px}header button,header a{border:0;background:none;font-size:29px;text-decoration:none;color:inherit}main{max-width:560px;margin:auto;padding:12px;height:calc(100dvh - 76px);display:flex;flex-direction:column;gap:8px}.card{position:relative;flex:1;min-height:0;background:white;border-radius:22px;overflow:hidden;box-shadow:0 5px 24px #1233;touch-action:none;transition:transform .23s,opacity .23s}.photo{position:absolute;inset:0 0 155px;display:grid;place-items:center;background:white}.photo img{width:100%;height:100%;object-fit:contain}.placeholder{text-align:center;padding:25px;color:#52727a}.placeholder span{font-size:70px}.bottom{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#17232c 28%);color:white;padding:40px 18px 18px}.bottom h2{margin:8px 0 2px}.source{display:inline-block;background:#555;color:white;border-radius:20px;padding:5px 10px;font-size:12px;text-decoration:none}.actions{display:flex;justify-content:space-around;align-items:center;margin-top:16px}.actions button{border:2px solid currentColor;background:#202a32;border-radius:50%;width:58px;height:58px;font-size:31px;line-height:1}.actions button:nth-child(1){color:#ff5274}.actions button:nth-child(2){color:#ffd15a;width:48px;height:48px;font-size:24px}.actions button:nth-child(3){color:#ffd15a;width:48px;height:48px}.actions button:nth-child(4){color:#35dfa0}.foot{display:flex;justify-content:space-between;align-items:center;font-size:13px}.foot button,.panel button,dialog button{border:0;border-radius:10px;padding:10px;background:#83d7e9;color:#17343c}.shade{position:fixed;inset:0;background:#0006;z-index:5}.panel{position:absolute;inset:0 auto 0 0;width:min(340px,88vw);background:white;padding:20px;overflow:auto}.panel button{display:block;width:100%;margin:8px 0;text-align:left}.panel h2{margin-top:0}dialog{border:0;border-radius:18px;max-width:min(92vw,480px);width:100%;padding:22px;color:#17343c}dialog::backdrop{background:#0007}dialog a{color:#087b9b}dialog button{margin:4px}input{width:100%;padding:10px;border:1px solid #abc;border-radius:8px}.hidden,[hidden]{display:none!important}.stamp{position:absolute;top:20px;left:20px;border:4px solid currentColor;padding:8px;font-size:28px;font-weight:bold;transform:rotate(-12deg);z-index:2;pointer-events:none}.entry{border-bottom:1px solid #ddd;padding:12px 0}.entry button{font-size:13px}.empty{margin:auto;text-align:center;padding:25px}.empty button{background:#83d7e9;border:0;padding:12px;border-radius:10px}
</style><header><button id="menu" aria-label="Open lists">☰</button><img src="../../app-icons/swipez.icon.png" alt="Swipez"><a href="../../index.html" aria-label="Return to World">🌎</a></header><main><div id="card" class="card"><div id="photo" class="photo"></div><div id="stamp" class="stamp" hidden></div><div class="bottom"><a id="source" class="source" target="_blank" rel="noopener noreferrer"></a><h2 id="name"></h2><div id="brand"></div><small>Tap card for more information</small><div class="actions"><button data-action="Not Interested" aria-label="Not interested" title="Not interested">❌</button><button data-action="Maybe" aria-label="Maybe" title="Maybe">🤔</button><button data-action="I got it" aria-label="I got it" title="I got it">🌠</button><button data-action="Liked" aria-label="Like" title="Like">✅</button></div></div></div><div id="empty" class="empty" hidden><h2 id="emptyTitle">All caught up!</h2><p id="emptyText">Review your lists or undo your last decision.</p><button id="review">Open lists</button></div><div class="foot"><button id="undo">↶ Undo</button><span id="count"></span></div></main><div id="shade" class="shade" hidden><aside class="panel"><button id="closeMenu">✕ Close</button><h2>My Lists</h2><div id="lists"></div><button id="newList">＋ Create New List</button><div id="entries"></div></aside></div><dialog id="details"></dialog><dialog id="create"><form id="createForm"><h2>Create a list</h2><input id="listName" required maxlength="60" placeholder="List name"><button type="submit">Create</button><button type="button" id="cancelCreate">Cancel</button></form></dialog><script>
const $=id=>document.getElementById(id), defaults=['Liked','Maybe','I got it','Not Interested'], key='swipez.v1';let state={decisions:{},custom:{},history:[]};try{const s=JSON.parse(localStorage.getItem(key));if(s)state={...state,...s}}catch{}let products=[],current=null,busy=false,activeList=null;function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Unable to save locally.')}}function node(tag,txt){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n}function button(txt,fn){const b=node('button',txt);b.onclick=fn;return b}function safe(url){try{const u=new URL(url,location.href);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}function render(){const remaining=products.filter(p=>!state.decisions[p.id]);current=remaining[0]||null;$('count').textContent=`${remaining.length} remaining · ${products.length} total`;$('undo').disabled=!state.history.length;$('card').hidden=!current;$('empty').hidden=!!current;if(!current)return;const p=current;$('name').textContent=p.name;$('brand').textContent=p.brand;const src=safe(p.sourceUrl);$('source').hidden=!src;if(src){$('source').href=src;$('source').textContent=new URL(src).hostname.replace(/^www\./,'')+' ↗'}const photo=$('photo');photo.replaceChildren();const fallback=()=>{photo.replaceChildren();const d=node('div');d.className='placeholder';d.append(node('span',p.species==='Cat'?'🐈':p.species==='Dog'?'🐕':'🧸'),node('p','Photo not available'),node('small','Open the source to view the plush.'));photo.append(d)};if(p.imageUrl&&safe(p.imageUrl)){const img=node('img');img.alt=p.name;img.draggable=false;img.onerror=fallback;img.src=safe(p.imageUrl);photo.append(img)}else fallback();}
function decide(action){if(!current||busy)return;busy=true;const id=current.id;state.history.push({id,previous:state.decisions[id]||null});state.decisions[id]=action;save();$('card').style.transform=`translate(${action==='Liked'?400:action==='Not Interested'?-400:0}px,${action==='I got it'?-400:0}px) rotate(${action==='Liked'?15:action==='Not Interested'?-15:0}deg)`;$('card').style.opacity=0;setTimeout(()=>{$('card').style.transition='none';$('card').style.transform='';$('card').style.opacity=1;$('stamp').hidden=true;render();requestAnimationFrame(()=>{$('card').style.transition='';busy=false})},230)}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>decide(b.dataset.action));$('undo').onclick=()=>{if(busy)return;const h=state.history.pop();if(!h)return;if(h.previous)state.decisions[h.id]=h.previous;else delete state.decisions[h.id];save();render()};
let start=null;const card=$('card');card.onpointerdown=e=>{if(busy||e.target.closest('button,a'))return;start={x:e.clientX,y:e.clientY,id:e.pointerId};card.setPointerCapture(e.pointerId);card.style.transition='none'};card.onpointermove=e=>{if(!start)return;const x=e.clientX-start.x,y=e.clientY-start.y;card.style.transform=`translate(${x}px,${Math.min(0,y)}px) rotate(${x/20}deg)`;const s=$('stamp');s.hidden=Math.max(Math.abs(x),-y)<35;s.textContent=-y>Math.abs(x)?'I GOT IT':x>0?'LIKE':'PASS';s.style.color=-y>Math.abs(x)?'#eab308':x>0?'#16a36b':'#ef476f'};function reset(){start=null;card.style.transition='';card.style.transform='';$('stamp').hidden=true}card.onpointerup=e=>{if(!start)return;const x=e.clientX-start.x,y=e.clientY-start.y;reset();if(-y>85&&-y>Math.abs(x))decide('I got it');else if(Math.abs(x)>85)decide(x>0?'Liked':'Not Interested');else if(Math.hypot(x,y)<12&&current)detail(current)};card.onpointercancel=reset;document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||!$('shade').hidden)return;const a={ArrowLeft:'Not Interested',ArrowRight:'Liked',ArrowUp:'I got it',ArrowDown:'Maybe'}[e.key];if(a){e.preventDefault();decide(a)}});
function detail(p){const d=$('details');d.replaceChildren(node('h2',p.name),node('p',p.brand));for(const [label,k] of [['Species','species'],['Breed','breed'],['Size','size'],['Price','price'],['Availability','availability'],['Weight','weight'],['Dimensions','dimensions']])d.append(node('p',label+': '+(p[k]??'Not verified')));d.append(node('small','Price and stock are from the November 25, 2026 catalog snapshot. Check the source for current details.'));if(p.description)d.append(node('p',p.description));if(safe(p.sourceUrl)){const a=node('a','View original source ↗');a.href=safe(p.sourceUrl);a.target='_blank';a.rel='noopener noreferrer';d.append(a,node('hr'))}for(const list of defaults)d.append(button(list,()=>{state.history.push({id:p.id,previous:state.decisions[p.id]||null});state.decisions[p.id]=list;save();d.close();render();renderLists()}));for(const list of Object.keys(state.custom))d.append(button('Add to '+list,()=>{if(!state.custom[list].includes(p.id))state.custom[list].push(p.id);save();d.close();renderLists()}));d.append(button('Close',()=>d.close()));d.showModal()}
function renderLists(){const el=$('lists');el.replaceChildren();for(const l of [...defaults,...Object.keys(state.custom)]){const ids=defaults.includes(l)?Object.keys(state.decisions).filter(id=>state.decisions[id]===l):state.custom[l];el.append(button(l+' ('+ids.length+')',()=>{activeList=l;renderLists()}))}const entries=$('entries');entries.replaceChildren();if(!activeList)return;entries.append(node('h3',activeList));const ids=defaults.includes(activeList)?Object.keys(state.decisions).filter(id=>state.decisions[id]===activeList):state.custom[activeList]||[];if(!ids.length)entries.append(node('p','Nothing here yet.'));for(const id of ids){const p=products.find(p=>p.id===id);if(!p)continue;const e=node('div');e.className='entry';e.append(node('strong',p.name),button('Details / move',()=>detail(p)),button('Remove',()=>{if(defaults.includes(activeList)){state.history.push({id,previous:state.decisions[id]});delete state.decisions[id]}else state.custom[activeList]=state.custom[activeList].filter(i=>i!==id);save();render();renderLists()}));entries.append(e)}}function openMenu(){renderLists();$('shade').hidden=false}$('menu').onclick=$('review').onclick=openMenu;$('closeMenu').onclick=()=>{$('shade').hidden=true};$('shade').onclick=e=>{if(e.target===$('shade'))$('shade').hidden=true};$('newList').onclick=()=>{$('listName').value='';$('create').showModal()};$('cancelCreate').onclick=()=>$('create').close();$('createForm').onsubmit=e=>{e.preventDefault();const l=$('listName').value.trim();if(!l||[...defaults,...Object.keys(state.custom),'__proto__','constructor','prototype'].some(x=>x.toLowerCase()===l.toLowerCase())){alert('Choose a unique list name.');return}state.custom[l]=[];activeList=l;save();$('create').close();renderLists()};fetch('../shared/plush-catalog.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{products=d.products;for(const id of ['demo-douglas-dog','demo-douglas-cat']){delete state.decisions[id];for(const l of Object.keys(state.custom))state.custom[l]=state.custom[l].filter(x=>x!==id)}state.history=state.history.filter(h=>!h.id.startsWith('demo-douglas-'));save();render()}).catch(()=>{$('card').hidden=true;$('empty').hidden=false;$('emptyTitle').textContent='Catalog unavailable';$('emptyText').textContent='Check the shared catalog path and open Swipez through GitHub Pages or a local web server.'});
</script></html>
