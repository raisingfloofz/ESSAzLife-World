
name: Update ESSAzTube Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update ESSAzTube feeds
        run: python apps/essaztube/update_videos.py

      - name: Commit updated video database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/essaztube/videos.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ESSAzTube video feeds"
            git push
          fi
